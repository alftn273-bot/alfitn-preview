      {key:'v', label:'الإصدار', num:false, render:v => h`<span class="fg-vv"><b class="num">v${A.ar(v.v)}</b>${v.v === cur ? U.chip('الحالي', 'brand') : ''}</span>`, value:v => v.v, width:'140px'},
      {key:'th', label:'الشكل', sort:false, render:v => h`<span class="fg-vth">${A.raw(iftnSvg(f, v.spec))}</span>`, width:'120px'},
      {key:'kind', label:'النوع', render:v => h`<span class="nw">${KIND_V[v.kind] || v.kind}</span>`},
      {key:'note', label:'الملاحظة', render:v => v.note || '—', sort:false},
      {key:'by', label:'بواسطة', render:v => h`<span class="nw">${v.by}</span>`},
      {key:'at', label:'التاريخ', render:v => h`<span class="nw">${A.when(v.at)}</span>`, value:v => v.at},
      {key:'act', label:'', sort:false, render:v => v.v === cur ? h`<span class="mut nw">معروض الآن</span>` : U.btn({label:'استرجاع هذا الإصدار', icon:'undo', sm:true, a:'restore', attrs:'data-v="' + v.v + '"', disabled:!canEdit()})}
    ],
    sort:{key:'v', dir:'desc'}, empty:{title:'لا إصدارات سابقة بعد', text:''},
    card:{title:v => 'v' + A.ar(v.v) + (v.v === cur ? ' · الحالي' : ''), sub:v => (KIND_V[v.kind] || v.kind) + ' · ' + A.when(v.at), skip:['v', 'kind', 'at', 'th']}}).draw();
  const log = D().figLog.filter(e => e.qid === f.qid || (e.scope === 'template' && e.family === f.family) || e.scope === 'global');
  body.querySelector('.fg-log').innerHTML = String(log.length ? U.timeline(log.map(e => ({icon:SCOPE[e.scope][1], text:e.summary, who:e.by + ' · ' + SCOPE[e.scope][0] + (e.qid && e.qid !== f.qid ? ' · ' + e.qid : ''), at:e.at, reason:e.reason})))
    : U.empty({icon:'clock', title:'لا تصحيحات مسجّلة بعد لهذا السؤال', text:''}));
  bindTab(body, {restore:b => {
    if (!canEdit()) return noPerm();
    const ver = f.versions.find(x => x.v === +b.dataset.v); if (!ver) return; const nv = cur + 1;
    U.confirm({title:'استرجاع الإصدار v' + A.ar(ver.v) + '؟', text:'يبقى الإصدار الحالي v' + A.ar(cur) + ' في السجل، ويصبح المسترجَع إصدارًا جديدًا v' + A.ar(nv) + '.', reason:'optional', confirmLabel:'استرجع'}).then(v => {
      if (!v) return; const before = clone(f.spec);
      f.spec = clone(ver.spec); f.versions.push({v:nv, at:A.iso(), by:A.me().name, kind:'restore', note:'استرجاع v' + ver.v + (v.reason ? ' — ' + v.reason : ''), spec:clone(ver.spec)}); work(f).spec = null;
      logFig({qid:f.qid, family:f.family, scope:'question', summary:'استرجاع الإصدار v' + A.ar(ver.v) + ' كإصدار v' + A.ar(nv), reason:v.reason});
      A.changed(); U.toast('استُرجع الإصدار v' + A.ar(ver.v) + '.', {undo:() => { f.spec = before; f.versions = f.versions.filter(x => x.v !== nv); logFig({qid:f.qid, family:f.family, scope:'question', summary:'تراجع عن الاسترجاع'}); A.changed(); }});
    });
  }});
}
})();

</script>
<script data-part="page-home.js">
/* الرئيسية — greeting, 4 tiles (the only KPIs in the admin), «يحتاج انتباهك» (≤ 6 rows), one small chart. */
(function(){
'use strict';
const h = A.h, I = A.icon, D = () => A.D;

const greet = () => { const hr = new Date(A.now() + 3 * 3600e3).getUTCHours(); return hr < 12 ? 'صباح الخير' : 'مساء الخير'; };
const monthStart = () => { const d = new Date(A.now() + 3 * 3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - 3 * 3600e3; };

function tiles(){
  const ms = D().members.filter(m => !m.deleted), now = A.now();
  const new30 = ms.filter(m => Date.parse(m.registeredAt) > now - 30 * 864e5).length;
  const active = ms.filter(m => m.plan !== 'free' && m.planEnd && Date.parse(m.planEnd) > now).length;
  const paidM = D().payments.filter(p => p.status === 'paid' && Date.parse(p.at) >= monthStart());
  const rev = paidM.reduce((a, p) => a + p.amount, 0);
  const newR = D().reports.filter(r => r.status === 'new');
  const oldest = newR.reduce((a, r) => !a || r.at < a ? r.at : a, null);
  return [
    {label:'المشتركون', value:A.n(ms.length), sub:A.n(new30) + ' جديدًا في آخر ٣٠ يومًا', href:A.href('members')},
    {label:'اشتراكات فعّالة', value:A.n(active), sub:A.pct(Math.round(active / Math.max(1, ms.length) * 100)) + ' من المشتركين', href:A.href('subscriptions')},
    {label:'إيراد هذا الشهر', value:A.n(rev), unit:'ر.س', sub:A.n(paidM.length) + ' عملية مدفوعة منذ ١ ' + A.MONTHS[new Date(A.now()).getUTCMonth()], href:A.href('payments')},
    {label:'بلاغات جديدة', value:A.n(newR.length), sub:oldest ? 'أقدمها ' + A.ago(oldest) : 'لا شيء جديد', href:A.href('reports')}
  ].filter(t => A.can(t.href.slice(2).split('?')[0] + '.view'));   /* staff see only what their permissions open */
}

function attention(){
  const rows = [], now = A.now();
  D().batches.filter(b => b.status === 'review').forEach(b => rows.push({icon:'bank', text:'دفعة أسئلة تنتظر مراجعتك', sub:h`${A.id(b.id)} · ${A.n(b.questions)} سؤال · ${A.n(b.exceptions)} استثناءات للمراجعة`, href:A.href('bank', {tab:'batches'})}));
  const nr = D().reports.filter(r => r.status === 'new').length;
  if (nr) rows.push({icon:'inbox', text:A.n(nr) + ' ' + (nr <= 10 ? 'بلاغات جديدة' : 'بلاغًا جديدًا'), sub:'أخطاء أسئلة ورسائل دعم وبلاغات لاعبين', href:A.href('reports')});
  const pend = D().payments.filter(p => p.status === 'pending');
  if (pend.length) rows.push({icon:'card', text:A.n(pend.length) + ' مدفوعات معلّقة', sub:'بمجموع ' + A.money(pend.reduce((a, p) => a + p.amount, 0)) + ' · تحويلات تنتظر التأكيد', href:A.href('payments', {tab:'pending'})});
  const unm = D().payments.filter(p => p.unmatched && !p.memberId);
  if (unm.length) rows.push({icon:'users', text:A.n(unm.length) + ' مدفوعات بلا مشترك', sub:'تحتاج ربطها بحساب', href:A.href('payments')});
  D().releases.filter(r => r.status === 'pending').forEach(r => rows.push({icon:'rocket', text:h`إصدار ${A.id(r.version)} ينتظر اعتمادك`, sub:A.n(r.changes.length) + ' تغييرات · الفحوص ناجحة ' + A.n(r.tests.passed) + ' من ' + A.n(r.tests.total), href:A.href('updates')}));
  const exp = D().members.filter(m => !m.deleted && m.plan !== 'free' && m.planEnd && Date.parse(m.planEnd) > now && Date.parse(m.planEnd) - now <= 7 * 864e5);
  if (exp.length) rows.push({icon:'clock', text:A.n(exp.length) + ' اشتراكات تنتهي هذا الأسبوع', sub:A.n(exp.filter(m => !m.autoRenew).length) + ' منها بلا تجديد تلقائي', href:A.href('subscriptions', {tab:'soon'})});
  return rows.filter(r => A.can(r.href.slice(2).split('?')[0] + '.view')).slice(0, 6);
}

function chart(){
  const now = A.now(), today = A.dayKey(now), N = 30;
  const counts = Array(N).fill(0);
  D().members.filter(m => !m.deleted).forEach(m => { const d = today - A.dayKey(m.registeredAt); if (d >= 0 && d < N) counts[N - 1 - d]++; });
  const total = counts.reduce((a, b) => a + b, 0), max = Math.max(3, ...counts);
  const W = 600, H = 180, pb = 24, pt = 8, gap = 2, bw = W / N - gap;
  const y = v => H - pb - (v / max) * (H - pb - pt);
  const dayIso = i => new Date(now - (N - 1 - i) * 864e5).toISOString();
  const bars = counts.map((c, i) => { const x = W - (i + 1) * (bw + gap) + gap / 2, top = y(c), hgt = H - pb - top;   // RTL: newest on the left
    return h`<g class="hm-b" data-i="${i}"><rect class="hit" x="${x - gap / 2}" y="${pt}" width="${bw + gap}" height="${H - pb - pt}" fill="transparent"></rect>
      ${c ? h`<path class="bar" d="M${x},${H - pb} V${top + Math.min(4, hgt)} q0,-4 4,-4 H${x + bw - 4} q4,0 4,4 V${H - pb} Z"></path>` : h`<rect class="zero" x="${x}" y="${H - pb - 2}" width="${bw}" height="2" rx="1"></rect>`}
      <title>${A.date(dayIso(i), {weekday:true})}: ${A.n(c)} ${c === 1 ? 'مشترك' : 'مشتركين'}</title></g>`; });
  const grid = [0, Math.ceil(max / 2), max].map(v => h`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="${v ? 'g' : 'base'}"></line><text x="${W + 8}" y="${y(v) + 4}" class="yl">${A.n(v)}</text>`);
  const xl = [0, 14, 29].map(i => h`<text x="${W - (i + 0.5) * (bw + gap)}" y="${H - 4}" class="xl" text-anchor="middle">${A.date(dayIso(i))}</text>`);
  return {total, svg:h`<svg class="hm-chart" viewBox="-4 0 ${W + 36} ${H}" role="img" aria-label="${'مشتركون جدد في آخر ٣٠ يومًا: ' + A.n(total)}">${grid}${bars}${xl}</svg>`, counts, dayIso};
}

A.page('home', {
  title:() => greet() + ' يا ' + A.me().name.split(' ')[0],
  sub:() => A.date(A.iso(), {weekday:true, year:true}) + ' — هذا ما يحدث في الفطن اليوم.',
  render(el){
    const t = tiles(), att = attention(), seeMembers = A.can('members.view'), c = chart();
    el.innerHTML = String(h`<div class="stack">
      <div class="hm-tiles${t.length < 4 ? ' few' : ''}">${t.map(x => h`<a class="card hm-tile" href="${x.href}"><span class="lb">${x.label}</span><b class="num">${x.value}${x.unit ? h`<small>${x.unit}</small>` : ''}</b><span class="sb">${x.sub}</span></a>`)}</div>
      <div class="${seeMembers ? 'grid2 hm-grid' : 'hm-one'}">
        ${A.ui.card({title:'يحتاج انتباهك', flush:true, body:att.length ? h`<ul class="hm-att">${att.map(r => h`<li><a href="${r.href}"><span class="ai">${I(r.icon)}</span><span class="tt"><b>${r.text}</b><small>${r.sub}</small></span>${I('chev', 's16')}</a></li>`)}</ul>`
          : A.ui.empty({icon:'checkCircle', title:'كل شيء تحت السيطرة', text:'لا شيء ينتظرك الآن.'})})}
        ${seeMembers ? A.ui.card({title:'مشتركون جدد', cls:'hm-ch', body:h`<div class="hm-ch-top"><b class="num">${A.n(c.total)}</b><span>في آخر ٣٠ يومًا</span></div>${c.svg}<div class="hm-tip" hidden></div>`}) : ''}
      </div></div>`);
    if (!seeMembers) return;
    /* hover tooltip on bars */
    const svg = el.querySelector('.hm-chart'), tip = el.querySelector('.hm-tip'), box = el.querySelector('.hm-ch');
    svg.querySelectorAll('.hm-b').forEach(g => {
      g.addEventListener('mouseenter', () => { const i = +g.dataset.i; svg.querySelectorAll('.hm-b').forEach(x => x.classList.toggle('dim', x !== g));
        tip.innerHTML = String(h`<b>${A.n(c.counts[i])}</b> ${c.counts[i] === 1 ? 'مشترك جديد' : 'مشتركين جدد'}<small>${A.date(c.dayIso(i), {weekday:true})}</small>`); tip.hidden = false;
        const r = g.querySelector('.hit').getBoundingClientRect(), b = box.getBoundingClientRect();
        tip.style.left = Math.max(8, Math.min(b.width - tip.offsetWidth - 8, r.left - b.left + r.width / 2 - tip.offsetWidth / 2)) + 'px'; tip.style.top = (r.top - b.top + 8) + 'px'; });
      g.addEventListener('mouseleave', () => { tip.hidden = true; svg.querySelectorAll('.hm-b').forEach(x => x.classList.remove('dim')); });
    });
  }
});
})();

</script>
<script data-part="page-members.js">
/* المشتركون — the members table (#/members) and the member profile (#/member?id=M-1001).
   Actions on a member: أهدِ (باقة / عنصر من المتجر / عملات — via A.grant) · قيّد · احظر · ⋯ (إعادة ضبط الدخول، إشعار، حذف بطلبه).
   List: «أرسل إشعارًا» (one member / the filtered group / a plan / everyone, live count, step-up above 50) + quiet «تصدير CSV».
   Profile › المعلومات: parent link (resend, unlink, the parent's pay-for-me requests).
   Every action: permission check → reason → step-up (A.secure) where sensitive → change A.D → A.log → A.changed() → toast (with undo for gifts/restrictions). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const live = () => D().members.filter(m => !m.deleted);
const planName = id => A.planOf(id).name;

/* ---------- shared cells ---------- */
const statusCell = m => { const s = A.statusOf(m);
  return h`${U.chip(s.label, s.tone)}${s.key === 'banned' ? h`<span class="sub nw">${s.detail}</span>` : s.key === 'restricted' ? h`<span class="sub nw">متبقٍّ ${A.days(s.left)}</span>` : ''}`; };
const courseCell = m => { const c = A.courseOf(m); return c.owns ? h`<div class="mb-cp">${U.bar(c.pct, {thin:true, tone:c.pct === 100 ? 'ok' : ''})}<span class="num">${A.pct(c.pct)}</span></div>` : h`<span class="mut">—</span>`; };
const progKey = m => { const c = A.courseOf(m); return !c.owns ? 'none' : c.pct === 0 ? 'zero' : c.pct === 100 ? 'done' : c.pct < 50 ? 'lt50' : 'gte50'; };

/* ---------- list ---------- */
function filterRows(st){
  const qn = A.norm(st.s), qp = A.normPhone(st.s), digits = qn.replace(/\D/g, '');
  return live().filter(m => {
    if (st.plan && m.plan !== st.plan) return false;
    if (st.status && A.statusOf(m).key !== st.status) return false;
    if (st.prog && progKey(m) !== st.prog) return false;
    if (!qn) return true;
    if (A.norm(m.name + ' ' + m.code + ' ' + m.email).includes(qn)) return true;
    if (digits.length >= 3 && (m.phone.includes(qp || digits) || m.phone.includes(digits) || m.code.includes(digits))) return true;
    return false;
  });
}
const COLS = [
  {key:'name', label:'الاسم', render:m => h`<span class="nm"><b>${m.name}</b><small>${A.id(m.code)}</small></span>`, value:m => m.name},
  {key:'phone', label:'الجوال', render:m => h`<bdi class="ltr num">${A.mask.phone(m.phone)}</bdi>`, sort:false},
  {key:'plan', label:'الباقة', render:m => h`<span class="nw">${planName(m.plan)}</span>`, value:m => ['free', 'pro', 'lux', 'course'].indexOf(m.plan)},
  {key:'status', label:'الحالة', render:statusCell, value:m => ['active', 'restricted', 'banned'].indexOf(A.statusOf(m).key)},
  {key:'coins', label:'العملات', num:true},
  {key:'xp', label:'الخبرة', num:true, width:'120px', render:m => h`<span class="nw" title="${'المستوى ' + A.n(A.levelOf(m.xp).n)}"><span class="num">${A.n(m.xp)}</span> <span class="mut">· م${A.n(A.levelOf(m.xp).n)}</span></span>`},
  {key:'tests', label:'الاختبارات', num:true, value:m => m.tests.length},
  {key:'course', label:'تقدّم الدورة', render:courseCell, value:m => A.courseOf(m).owns ? A.courseOf(m).pct : -1, width:'150px'},
  {key:'lastSeen', label:'آخر دخول', render:m => h`<span class="nw">${A.ago(m.lastSeen)}</span>`, value:m => m.lastSeen},
  {key:'registeredAt', label:'التسجيل', render:m => h`<span class="nw">${A.date(m.registeredAt)}</span>`, value:m => m.registeredAt}
];

A.page('members', {
  title:'المشتركون',
  sub:'كل من سجّل في الفطن: بياناته وباقته وتقدّمه.',
  primary:() => ({label:'أرسل إشعارًا', icon:'bell', disabled:!A.can('members.edit'), run:() => broadcast()}),
  render(el){
    el.innerHTML = '<section class="card mb-list"><div class="mb-tb"></div><div class="mb-tbl"></div></section>';
    let tbl;
    const tb = U.toolbar(el.querySelector('.mb-tb'), {id:'members', unit:'مشترك', search:'ابحث بالاسم أو الجوال أو الكود أو البريد',
      selects:[{key:'plan', label:'الباقة', options:D().plans.map(p => ({v:p.id, label:p.name}))},
        {key:'status', label:'الحالة', options:[{v:'active', label:'نشط'}, {v:'restricted', label:'مقيّد'}, {v:'banned', label:'محظور'}]},
        {key:'prog', label:'تقدّم الدورة', options:[{v:'zero', label:'لم يبدأ'}, {v:'lt50', label:'أقل من ٥٠٪'}, {v:'gte50', label:'٥٠٪ فأكثر'}, {v:'done', label:'أنهى الدورة'}, {v:'none', label:'لا يملك الدورة'}]}],
      actions:[{label:'تصدير CSV', icon:'download', run:() => exportCsv(), disabled:!A.can('export'), title:A.can('export') ? '' : 'تحتاج صلاحية تصدير البيانات'}],
      onChange:() => { tbl.reset(); draw(); }});
    tbl = U.table(el.querySelector('.mb-tbl'), {id:'members', columns:COLS, rows:() => filterRows(tb.state), rowHref:m => A.href('member', {id:m.id}), sort:{key:'registeredAt', dir:'desc'},
      card:{title:m => m.name, sub:m => h`${A.id(m.code)} · ${planName(m.plan)}`, side:m => statusCell(m), skip:['name', 'plan', 'status', 'phone', 'tests', 'registeredAt']},
      empty:{title:'لا يوجد مشترك بهذا البحث', text:'جرّب الاسم أو آخر أرقام الجوال أو الكود (مثل 4821).'}});
    const draw = () => { tbl.draw(); tb.count(filterRows(tb.state).length, live().length); };
    draw();
  }
});

/* CSV export (sensitive: reason + step-up + audit) */
function exportCsv(){
  if (!A.can('export')) return U.toast('لا تملك صلاحية تصدير البيانات.', {tone:'no'});
  const st = A.mem('tb:members'); const rows = filterRows(Object.assign({s:''}, st));
  U.confirm({title:'تصدير المشتركين', text:'سيُنزَّل ملف CSV فيه ' + A.n(rows.length) + ' مشترك' + (rows.length === live().length ? '' : ' (حسب الفلاتر الحالية)') + ' بأرقام الجوال والبريد كاملة.',
    secure:'تصدير بيانات المشتركين', confirmLabel:'صدّر الملف', reasonPh:'لماذا تحتاج هذا الملف؟'}).then(r => {
    if (!r) return;
    const head = ['الاسم', 'الكود', 'الجوال', 'البريد', 'المدينة', 'الباقة', 'الحالة', 'العملات', 'الخبرة', 'المستوى', 'الاختبارات', 'تقدم الدورة %', 'آخر دخول', 'التسجيل'];
    const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')].concat(rows.map(m => { const c = A.courseOf(m);
      return [m.name, m.code, m.phone, m.email, m.city, planName(m.plan), A.statusOf(m).label, m.coins, m.xp, A.levelOf(m.xp).n, m.tests.length, c.owns ? c.pct : '', m.lastSeen.slice(0, 10), m.registeredAt.slice(0, 10)].map(q).join(','); }));
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'alfitn-members-' + A.iso().slice(0, 10) + '.csv'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    A.log({action:'members.export', summary:'تصدير ' + A.n(rows.length) + ' مشترك (CSV)', reason:r.reason});
    A.changed(); U.toast('نُزّل الملف وسُجّل التصدير.');
  });
}

/* search provider: members by name / phone (any format) / code / email */
A.searchProvider({id:'members', label:'المشتركون', icon:'user', max:6, find:(qn, raw) => filterRows({s:raw}).slice(0, 6).map(m => ({title:m.name, sub:m.code + ' · ' + planName(m.plan) + ' · ' + A.statusOf(m).label, href:A.href('member', {id:m.id}), icon:'user'}))});

/* ---------- profile ---------- */
/* calm rule: ≤ 4 tabs — the account log (what the team did + notifications he got) opens in a drawer from «⋯ › سجل الحساب» */
const TABS = [{id:'info', label:'المعلومات'}, {id:'sub', label:'الاشتراك والمدفوعات'}, {id:'prog', label:'التقدّم'}, {id:'coins', label:'العملات والخبرة'}];

A.page('member', {
  nav:'members', bare:true,
  title:q => (A.member(q.id) || {}).name || 'مشترك',
  crumb:q => (A.member(q.id) || {}).name || 'غير موجود',
  render(el, q){
    const m = A.member(q.id);
    if (!m || m.deleted) { el.innerHTML = String(h`<a class="back" href="${A.href('members')}">${I('chev')}المشتركون</a>${U.card({body:U.empty({icon:'user', title:m ? 'حُذف هذا الحساب' : 'لم نجد هذا المشترك', text:m ? 'حُذف بطلب صاحبه، وبقي أثره في السجل.' : 'ربما تغيّر الرابط.', action:h`<a class="btn secondary" href="${A.href('members')}">كل المشتركين</a>`})})}`); return; }

/* --- tab: الاشتراك والمدفوعات --- */
function sub(el, m){
  const p = A.planOf(m.plan), left = m.planEnd ? A.left(m.planEnd) : null;
  const span = m.planStart && m.planEnd ? Math.max(1, (Date.parse(m.planEnd) - Date.parse(m.planStart)) / 864e5) : 1;
  const subs = D().subscriptions.filter(s => s.memberId === m.id).sort((a, b) => b.start.localeCompare(a.start));
  const pays = D().payments.filter(x => x.memberId === m.id);
  el.innerHTML = String(h`<div class="stack">
    ${U.card({title:'الاشتراك الحالي', body:m.plan === 'free' ? h`<div class="mb-plan"><div><b>مجاني</b><p class="mut">${p.features.join(' · ')}</p></div>${A.can('gift') ? U.btn({label:'أهدِ باقة', icon:'gift', a:'tabGift'}) : ''}</div>`
      : h`<div class="mb-plan"><div><b>${p.name}</b><p class="mut">${p.price ? A.money(p.price) + ' ' + p.period : ''}${m.plan === 'course' ? '' : m.autoRenew ? ' · تجديد تلقائي' : ' · بلا تجديد تلقائي'}</p></div>
        <div class="mb-plan-t"><div class="mb-plan-d"><span>من ${A.date(m.planStart)}</span><span>${left > 0 ? 'ينتهي ' + A.date(m.planEnd) + ' · متبقٍ ' + A.days(left) : 'انتهى ' + A.date(m.planEnd)}</span></div>${U.bar(Math.min(100, Math.max(0, 100 - left / span * 100)), {tone:left <= 7 ? '' : ''})}</div></div>`})}
    ${U.card({title:'سجل الاشتراكات', flush:true, body:h`<div class="mb-t1"></div>`})}
    ${U.card({title:'المدفوعات', flush:true, body:h`<div class="mb-t2"></div>`})}
  </div>`);
  const SS = {active:['فعّال', 'ok'], ended:['منتهٍ', ''], replaced:['استُبدل', ''], cancelled:['ملغى', 'no']};
  U.table(el.querySelector('.mb-t1'), {id:'m-subs', rows:subs, pageSize:10, columns:[
    {key:'plan', label:'الباقة', render:s => planName(s.plan)}, {key:'start', label:'البداية', render:s => A.date(s.start)}, {key:'end', label:'النهاية', render:s => A.date(s.end)},
    {key:'status', label:'الحالة', render:s => U.chip(SS[s.status][0], SS[s.status][1])}, {key:'source', label:'المصدر', render:s => s.source === 'gift' ? U.chip('هدية', 'brand') : 'دفع'}],
    empty:{icon:'repeat', title:'لم يشترك بعد', text:'كل اشتراك أو هدية يظهر هنا.'}}).draw();
  const PS = {paid:['مدفوعة', 'ok'], pending:['معلّقة', 'warn'], refunded:['مستردة', 'info'], failed:['فاشلة', 'no']};
  U.table(el.querySelector('.mb-t2'), {id:'m-pays', rows:pays, pageSize:10, sort:{key:'at', dir:'desc'}, columns:[
    {key:'id', label:'رقم العملية', render:x => A.id(x.id)}, {key:'product', label:'المنتج'}, {key:'amount', label:'المبلغ', num:true, render:x => A.money(x.amount)},
    {key:'method', label:'الطريقة'}, {key:'status', label:'الحالة', render:x => U.chip(PS[x.status][0], PS[x.status][1])}, {key:'at', label:'التاريخ', render:x => h`<span class="nw">${A.date(x.at)}</span>`}],
    empty:{icon:'card', title:'لا مدفوعات', text:'لم يدفع هذا المشترك أي مبلغ بعد.'}}).draw();
}

const giftOf = (m, id) => D().purchases.some(p => p.memberId === m.id && p.item === id && p.gift);

/* --- account log (drawer) --- */
function logDrawer(m){
  const list = D().audit.filter(e => e.target === m.id && !e.quiet);
  const ns = (m.notifications || []).slice(0, 8);
  U.drawer({title:'سجل الحساب', sub:m.name + ' · ' + m.code, wide:true,
    body:h`<div class="stack mb-log"><section><h3 class="mb-lh">ما فعله الفريق على هذا الحساب</h3>${U.timeline(list.map(e => ({at:e.at, who:e.actorName, text:e.summary, reason:e.reason, ba:U.auditBA(e), icon:ICON_OF[e.action.split('.').slice(0, 2).join('.')] || 'edit'})))}</section>
      <section><h3 class="mb-lh">إشعارات وصلته منّا</h3>${ns.length ? U.timeline(ns.map(n => ({at:n.at, who:n.by, text:n.title, icon:n.kind === 'gift' ? 'gift' : 'bell'}))) : h`<p class="mut">لم نرسل له إشعارًا بعد.</p>`}</section></div>`});
}
const ICON_OF = {'member.parent':'users', 'member.gift':'gift', 'member.restrict':'pause', 'member.unrestrict':'undo', 'member.ban':'ban', 'member.unban':'undo', 'member.reset':'key', 'member.notify':'bell', 'member.delete':'trash', 'member.undo':'undo'};

/* ---------- actions ---------- */
const dur = (v) => ({d1:1, d3:3, w1:7, m1:30, m3:90}[v]);
const durLabel = (v) => ({d1:'يوم', d3:'٣ أيام', w1:'أسبوع', m1:'شهر', m3:'٣ أشهر', exam:'حتى موعد اختباره', perm:'نهائيًا'}[v]);
const done = (text, undo) => { A.changed(); U.toast(text, undo ? {undo} : {}); };

function giftPlan(m){
  U.confirm({title:'أهدِ ' + m.name + ' باقة', text:'تُفتح الباقة فورًا ويصله إشعار، وتظهر في «الاشتراكات» كهدية. الباقة الحالية: ' + planName(m.plan) + '.', secure:'إهداء باقة', confirmLabel:'أهدِ الباقة',
    fields:[{name:'plan', type:'opts', label:'الباقة', value:m.plan === 'pro' ? 'lux' : 'pro', options:D().plans.filter(p => p.id !== 'free').map(p => ({v:p.id, label:p.name, sub:A.money(p.price) + ' ' + p.period}))},
      {name:'dur', type:'seg', label:'المدة', value:'m1', options:[{v:'w1', label:'أسبوع'}, {v:'m1', label:'شهر'}, {v:'m3', label:'٣ أشهر'}, {v:'exam', label:'حتى موعد اختباره'}]}]}).then(r => {
    if (!r) return;
    const end = r.dur === 'exam' ? new Date(m.examDate + 'T20:59:00Z').toISOString() : A.addDays(null, dur(r.dur));
    if (r.plan === 'course' && m.plan !== 'course') m.lessonsDone = m.lessonsDone || 0;
    const undo = A.grant.plan(m, r.plan, end, r.reason, durLabel(r.dur));
    done('أُهدي ' + m.name + ' «' + planName(r.plan) + '» ' + durLabel(r.dur) + '.', () => { undo(); done('تراجعنا عن الهدية.'); });
  });
}
function giftItem(m){
  const opts = D().storeItems.filter(x => !m.owned.includes(x.id));
  U.confirm({title:'أهدِ ' + m.name + ' عنصرًا من المتجر', text:'يُضاف العنصر لخزانته مباشرة دون أن تُخصم عملاته، ويظهر في مبيعات المتجر كهدية.', secure:'إهداء عنصر من المتجر', confirmLabel:'أهدِ العنصر',
    fields:[{name:'item', type:'select', label:'العنصر', options:opts.map(x => ({v:x.id, label:x.name + ' — ' + x.catLabel + (x.exclusive ? ' (حصري)' : ' · ' + A.coins(x.price))}))}]}).then(r => {
    if (!r) return; const it = D().storeItems.find(x => x.id === r.item); if (!it) return;
    const undo = A.grant.item(m, it, r.reason);
    done('أُضيف «' + it.name + '» لخزانة ' + m.name + '.', () => { undo(); done('تراجعنا عن الهدية.'); });
  });
}
function giftCoins(m){
  U.confirm({title:'أهدِ ' + m.name + ' عملات', text:'رصيده الآن ' + A.coins(m.coins) + '. تظهر في حركة عملاته.', secure:'إهداء عملات', confirmLabel:'أهدِ العملات',
    fields:[{name:'amount', type:'number', label:'عدد العملات', value:200, min:1, max:10000, hint:'من ١ إلى ١٠٬٠٠٠ عملة.'}],
    validate:v => !(v.amount >= 1 && v.amount <= 10000) ? ['amount', 'اكتب عددًا من ١ إلى ١٠٬٠٠٠.'] : ''}).then(r => {
    if (!r) return; const amt = Math.round(r.amount);
    const undo = A.grant.coins(m, amt, r.reason);

function ban(m){

/* edit registered info on the member's request (each change logged before → after) */
function editInfo(m){

/* notifications: one member, the filtered group, a plan, or everyone — live count; step-up above 50 recipients */
const LINKS = [{v:'', label:'لا شيء — رسالة فقط'}, {v:'home', label:'الرئيسية'}, {v:'plan', label:'خطة اليوم'}, {v:'course', label:'دورة الفطن'}, {v:'bank', label:'بنك الأسئلة'}, {v:'store', label:'المتجر'}, {v:'sub', label:'اشتراكي'}];
const reachable = list => list.filter(m => A.statusOf(m).key !== 'banned');
function broadcast(one){
  if (!A.can('members.edit')) return U.toast('تحتاج صلاحية تعديل المشتركين لإرسال الإشعارات.', {tone:'no'});
  const st = A.mem('tb:members'); const hasF = !!(st.s || st.plan || st.status || st.prog);
  const filtered = () => reachable(filterRows(Object.assign({s:''}, st)));
  const findOne = q => { if (!q || A.norm(q).length < 2) return null; return filterRows({s:q})[0] || null; };
  const AUD = (one ? [{v:'one', label:'مشترك واحد', sub:one.name}] : []).concat(hasF ? [{v:'filtered', label:'الظاهرون في الجدول', sub:'حسب البحث والفلاتر الحالية'}] : [],
    [{v:'plan', label:'أصحاب باقة', sub:'تختار الباقة'}, {v:'all', label:'كل المشتركين', sub:'المحظورون لا يصلهم'}], one ? [] : [{v:'one', label:'مشترك واحد', sub:'بالاسم أو الكود أو الجوال'}]);

  const recipients = el => { const v = U.values(el);

    if (v.aud === 'filtered') return filtered();
    if (v.aud === 'plan') return reachable(live().filter(m => m.plan === v.plan));
    return reachable(live()); };
  const sync = el => { const v = U.values(el); aud = v.aud;
    el.querySelector('[data-fld="plan"]').style.display = v.aud === 'plan' ? '' : 'none';
    el.querySelector('[data-fld="who"]').style.display = v.aud === 'one' && !one ? '' : 'none';
    const r = recipients(el), n = r.length, c = el.querySelector('.mb-aud');
    c.innerHTML = String(n === 0 ? h`<span class="mut">لا أحد بهذا الاختيار بعد.</span>` : v.aud === 'one' ? h`يصل إلى <b>${r[0].name}</b> <span class="mut">${A.id(r[0].code)}</span>`
      : h`يصل إلى <b class="num">${A.n(n)}</b> ${n === 1 ? 'مشترك' : n === 2 ? 'مشتركَين' : n <= 10 ? 'مشتركين' : 'مشتركًا'}${n > 50 ? h` <span class="mut">· يطلب تأكيد هويتك</span>` : ''}`); };

    body:h`<div class="fields">${U.field({name:'aud', type:'opts', label:'إلى من؟', value:aud, options:AUD})}

    fields:[{name:'title', label:'العنوان', placeholder:'مثال: تحدّي جديد ينتظرك', required:true, maxlength:60, hint:'حتى ٦٠ حرفًا.'},

    onOpen:mel => { sync(mel); mel.addEventListener('change', () => sync(mel)); mel.querySelector('input[name=who]').addEventListener('input', () => sync(mel)); },

    if (!r) return;
    const list = r.aud === 'one' ? [one && !r.who ? one : findOne(r.who)].filter(Boolean) : r.aud === 'filtered' ? filtered() : r.aud === 'plan' ? reachable(live().filter(m => m.plan === r.plan)) : reachable(live());

    const send = () => {

      list.forEach(m => (m.notifications = m.notifications || []).unshift({at:b.at, title:r.title, body:r.body, link:r.link, by:b.by, kind:'notice', bid:b.id}));

        : {action:'notify.broadcast', target:b.id, targetLabel:audLabel, summary:'إشعار «' + r.title + '» إلى ' + A.n(list.length) + ' مشترك (' + audLabel + ')', reason:r.reason, after:{المستلمون:list.length}});

/* parent link: resend while waiting, unlink on request (cancels his pending requests), see the pay-for-me requests */
const RQ = {sent:['ينتظر وليّ الأمر', 'warn'], paid:['دفعه وليّ الأمر', 'ok'], declined:['لم يوافق', ''], cancelled:['أُلغي', '']};
function parentCard(m){
  const p = m.parent, reqs = (m.parentRequests || []).slice().sort((a, b) => b.at.localeCompare(a.at)), can = A.can('members.edit');
  if (!p) return U.card({title:'ولي الأمر', body:h`<p class="mut">لم يربط وليّ أمر بحسابه بعد. يستطيع وليّ الأمر الربط برمز المشترك ${A.id(m.code)}.</p>`});
  const linked = p.status !== 'sent';
  return U.card({title:'ولي الأمر', actions:can ? h`<div class="mb-par-a">${!linked ? U.btn({label:'أعد إرسال الرابط', icon:'mail', sm:true, tone:'ghost', a:'parResend'}) : ''}${U.btn({label:'افصل الربط', sm:true, tone:'ghost', a:'parUnlink'})}</div>` : '',
    body:h`${U.kv([['الاسم', p.name], ['الصلة', p.relation], ['الجوال', h`<bdi class="ltr num">${A.phone(p.phone)}</bdi>`],
      ['حالة الربط', linked ? h`${U.chip('مرتبط', 'ok')} <span class="mut">منذ ${A.date(p.linkedAt)}</span>` : h`${U.chip('ننتظر تأكيده', 'warn')} <span class="mut">أُرسل ${A.ago(p.sentAt)}</span>`],
      ['التقرير الأسبوعي', p.weekly ? 'يصله كل أحد' : 'موقوف']], {one:true})}
      <div class="mb-req"><h3>طلبات «ادفع عني»</h3>${reqs.length ? h`<ul>${reqs.map(q => h`<li><span class="tt"><b>${q.title}</b><small>${A.date(q.at)} · ${A.money(q.sar)}</small></span>${U.chip(RQ[q.status][0], RQ[q.status][1])}${q.status === 'sent' && can ? U.btn({label:'ألغِ', sm:true, tone:'ghost', a:'reqCancel', attrs:h`data-rq="${q.id}"`}) : ''}</li>`)}</ul>`
        : h`<p class="mut">لم يرسل طلبات لوليّ أمره.</p>`}</div>`});
}
function parResend(m){

}
function parUnlink(m){
  U.confirm({title:'افصل ربط وليّ الأمر', text:'لا يصله التقرير الأسبوعي بعد الآن، وتُلغى طلبات «ادفع عني» المعلّقة. يستطيع الربط من جديد برمز المشترك.', tone:'danger', secure:'فصل ربط وليّ الأمر', confirmLabel:'افصل الربط',
    reasonPh:'مثال: طلب المشترك ذلك عبر الدعم'}).then(r => {

    done('فُصل ربط وليّ الأمر.', () => { m.parent = before; pend.forEach(q => { q.status = 'sent'; delete q.unl; });
      A.log({action:'member.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن فصل وليّ الأمر'}); done('عاد الربط كما كان.'); });
  });
}
function reqCancel(m, id){
  const q = (m.parentRequests || []).find(x => x.id === id); if (!q) return;

    if (!r) return; q.status = 'cancelled';
    A.log({action:'member.parent', target:m.id, targetLabel:m.name, summary:'إلغاء طلب «' + q.title + '» من وليّ الأمر', reason:r.reason, before:{الطلب:'ينتظر'}, after:{الطلب:'أُلغي'}});

function del(m){
  U.confirm({title:'احذف حساب ' + m.name, text:'بطلب صاحب الحساب أو وليّ أمره فقط. تُمحى بياناته الشخصية ولا يمكن التراجع؛ تبقى المدفوعات بلا اسم لأغراض المحاسبة.', tone:'danger', typed:'احذف', secure:'حذف حساب مشترك', confirmLabel:'احذف الحساب',
    reasonPh:'مثال: طلب عبر البريد بتاريخ اليوم'}).then(r => {

})();

<script data-part="page-payments.js">
/* المدفوعات (#/payments) — one table of every payment; tabs الكل · معلّقة · مستردة · بلا مشترك; search + filters.
   Row → drawer: details + «استرداد» (secured, reason → status مستردة, the access it bought is removed)
   + «اربطها بمشترك» (unmatched: pick a member, optionally open the plan he paid for) + «أكّد التحويل» / «ارفض» (pending bank transfers).
   The month's revenue sits in the page's one short line. */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const planName = id => A.planOf(id).name;
const PS = {paid:['مدفوعة', 'ok'], pending:['معلّقة', 'warn'], refunded:['مستردة', 'info'], failed:['فاشلة', 'no'], unmatched:['بلا مشترك', 'warn']};
const keyOf = p => p.status === 'paid' && p.unmatched && !p.memberId ? 'unmatched' : p.status;
const chipOf = p => U.chip(PS[keyOf(p)][0], PS[keyOf(p)][1]);
const monthStart = () => { const d = new Date(A.now() + 3 * 3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - 3 * 3600e3; };
const who = p => { const m = p.memberId && A.member(p.memberId); return m ? (m.deleted ? 'حساب محذوف' : m.name) : p.payer || '—'; };
const done = (text, undo) => { A.changed(); U.toast(text, undo ? {undo} : {}); };

let opened = '';
const TABS = {all:() => true, pending:p => p.status === 'pending', refunded:p => p.status === 'refunded', unmatched:p => keyOf(p) === 'unmatched'};
function filterRows(tab, st){
  const qn = A.norm(st.s), digits = qn.replace(/\D/g, ''), qp = A.normPhone(st.s);
  return D().payments.filter(p => {
    if (!TABS[tab](p)) return false;
    if (st.method && p.method !== st.method) return false;
    if (st.status && keyOf(p) !== st.status) return false;
    if (!qn) return true;
    const m = p.memberId && A.member(p.memberId);
    if (A.norm([p.id, p.ref, p.product, who(p), m ? m.code + ' ' + m.email : ''].join(' ')).includes(qn)) return true;
    return !!m && digits.length >= 3 && m.phone.includes(qp || digits);
  });
}

A.page('payments', {
  title:'المدفوعات',
  sub:() => { const ps = D().payments.filter(p => p.status === 'paid' && Date.parse(p.at) >= monthStart());
    return 'إيراد ' + A.MONTHS[new Date(A.now() + 3 * 3600e3).getUTCMonth()] + ' حتى اليوم ' + A.money(ps.reduce((a, p) => a + p.amount, 0)) + ' من ' + A.n(ps.length) + ' عملية مدفوعة.'; },
  primary:{label:'تصدير CSV', icon:'download', tone:'secondary', run:q => exportCsv(q.tab || 'all')},
  tabs:() => { const n = f => D().payments.filter(f).length || null;
    return [{id:'all', label:'الكل'}, {id:'pending', label:'معلّقة', count:n(TABS.pending)}, {id:'refunded', label:'مستردة'}, {id:'unmatched', label:'بلا مشترك', count:n(TABS.unmatched)}]; },
  render(el, q, ctx){
    const tab = ctx.tab;
    el.innerHTML = '<section class="card py-list"><div class="py-tb"></div><div class="py-tbl"></div></section>';
    const methods = [...new Set(D().payments.map(p => p.method))];
    let tbl;
    const tb = U.toolbar(el.querySelector('.py-tb'), {id:'payments-' + tab, unit:'عملية', search:'ابحث برقم العملية أو الاسم أو الجوال أو المنتج',
      selects:[{key:'method', label:'الطريقة', options:methods.map(x => ({v:x, label:x}))}].concat(tab === 'all' ? [{key:'status', label:'الحالة', options:Object.entries(PS).map(([v, [label]]) => ({v, label}))}] : []),
      onChange:() => { tbl.reset(); draw(); }});
    const EMPTY = {all:['لا عملية بهذا البحث', 'جرّب رقم العملية (مثل 30412) أو اسم المشترك.'], pending:['لا مدفوعات معلّقة', 'التحويلات البنكية التي تنتظر تأكيدك تظهر هنا.'],
      refunded:['لا مبالغ مستردة', 'كل استرداد يظهر هنا مع سببه.'], unmatched:['كل المدفوعات مربوطة بمشتركين', 'الدفعة التي لا نعرف صاحبها تظهر هنا لتربطها بحسابه.']};
    const base = filterRows(tab, {s:''}).length;
    tbl = U.table(el.querySelector('.py-tbl'), {id:'payments-' + tab, rows:() => filterRows(tab, tb.state), onRow:openPay, sort:{key:'at', dir:'desc'}, columns:[
      {key:'id', label:'رقم العملية', render:p => A.id(p.id), width:'140px'},
      {key:'who', label:'المشترك', value:who, render:p => { const m = p.memberId && A.member(p.memberId);
        return m && !m.deleted ? U.who(m, {tab:'sub'})
          : h`<span class="nm"><b class="${m ? 'mut' : ''}">${who(p)}</b><small>${m ? 'بيانات ممسوحة' : 'اسم الدافع'}</small></span>`; }},
      {key:'product', label:'المنتج', render:p => h`<span class="nw">${p.product}</span>`},
      {key:'amount', label:'المبلغ', num:true, render:p => h`<span class="nw${p.status === 'refunded' || p.status === 'failed' ? ' py-strike' : ''}">${A.money(p.amount)}</span>`},
      {key:'method', label:'الطريقة', render:p => h`<bdi class="nw">${p.method}</bdi>`},
      {key:'status', label:'الحالة', render:chipOf, value:p => ['pending', 'unmatched', 'paid', 'refunded', 'failed'].indexOf(keyOf(p))},
      {key:'at', label:'التاريخ', render:p => h`<span class="nw">${A.date(p.at)}</span>`}],
      card:{title:who, sub:p => h`${A.id(p.id)} · ${p.product}`, side:p => h`<b class="num nw">${A.money(p.amount)}</b>`, skip:['id', 'who', 'product', 'amount']},
      empty:{icon:'card', title:base ? EMPTY.all[0] : EMPTY[tab][0], text:base ? EMPTY.all[1] : EMPTY[tab][1]}});
    const draw = () => { tbl.draw(); tb.count(filterRows(tab, tb.state).length, base); };
    draw();
    if (q.id && q.id !== opened) { opened = q.id; const p = D().payments.find(x => x.id === q.id); if (p) openPay(p); }
    if (!q.id) opened = '';
  }
});

/* ---------- drawer ---------- */
function openPay(p){
  const m = p.memberId && A.member(p.memberId), k = keyOf(p);
  const rows = [['المبلغ', h`<b class="py-amt">${A.money(p.amount)}</b>`], ['الحالة', chipOf(p)],
    ['المنتج', p.product], ['الطريقة', h`<bdi>${p.method}</bdi>`],
    ['المشترك', m && !m.deleted ? h`<a href="${A.href('member', {id:m.id, tab:'sub'})}">${m.name}</a> <span class="mut">${A.id(m.code)}</span>` : m ? 'حساب محذوف' : h`<span>${p.payer || '—'}</span> <span class="mut">· لم يُربط بحساب</span>`, true],
    ['التاريخ', A.date(p.at, {year:true}) + '، ' + A.time(p.at)], ['مرجع البوابة', h`<bdi class="ltr">${p.ref}</bdi>`],
    p.failReason ? ['سبب الفشل', p.failReason, true] : null,
    p.status === 'refunded' ? ['استُرد', (p.refundedAt ? A.date(p.refundedAt, {year:true}) : '—') + (p.refundBy ? ' · ' + p.refundBy : ''), true] : null,
    p.refundReason ? ['سبب الاسترداد', p.refundReason, true] : null,
    p.confirmedAt ? ['أُكّد التحويل', A.when(p.confirmedAt) + ' · ' + p.confirmedBy, true] : null,
    p.linkedAt ? ['رُبطت بالحساب', A.when(p.linkedAt) + ' · ' + p.linkedBy, true] : null];
  const note = k === 'pending' ? 'تحويل بنكي ينتظر تأكيدك. أكّده بعد أن تراه في كشف الحساب؛ يُفتح له «' + (p.planId ? planName(p.planId) : p.product) + '» فورًا.'
    : k === 'unmatched' ? 'وصل المبلغ ولا نعرف صاحبه. اربطه بحساب المشترك ليُفتح له ما دفع ثمنه.'
    : p.status === 'refunded' && p.accessNote ? p.accessNote : '';
  U.drawer({title:'عملية ' + p.id, sub:who(p) + ' · ' + A.date(p.at),
    body:h`<div class="stack">${note ? h`<p class="py-note">${I(k === 'refunded' ? 'undo' : 'alert', 's16')}<span>${note}</span></p>` : ''}${U.kv(rows)}</div>`,
    foot:h`${k === 'pending' ? h`${U.btn({label:'أكّد التحويل', icon:'check', tone:'primary', a:'confirm', disabled:!A.can('payments.edit')})}${U.btn({label:'لم يصل', tone:'ghost', a:'reject', disabled:!A.can('payments.edit')})}` : ''}
      ${k === 'unmatched' ? U.btn({label:'اربطها بمشترك', icon:'user', tone:'primary', a:'link', disabled:!A.can('payments.edit')}) : ''}
      ${p.status === 'paid' ? U.btn({label:'استرداد', icon:'undo', tone:'danger', a:'refund', disabled:!A.can('refund'), title:A.can('refund') ? '' : 'تحتاج صلاحية الاسترداد'}) : ''}
      ${m && !m.deleted ? U.btn({label:'ملف المشترك', tone:'ghost', href:A.href('member', {id:m.id, tab:'sub'})}) : ''}`,
    bind:{confirm:l => { l.close(); confirmTransfer(p); }, reject:l => { l.close(); rejectTransfer(p); }, link:l => { l.close(); linkMember(p); }, refund:l => { l.close(); refund(p); }}});
}

/* what this payment gave the member (used by refund) */
function accessOf(p){
  const m = p.memberId && A.member(p.memberId); if (!m) return {text:'', sub:null};
  if (p.kind === 'coins') { const pk = D().addons.find(a => a.id === p.addon); const c = pk ? pk.coins : 0;
    return {coins:c, text:'تُخصم ' + A.coins(Math.min(c, m.coins)) + ' من رصيده (رصيده الآن ' + A.n(m.coins) + ').'}; }
  const s = D().subscriptions.filter(x => x.memberId === m.id && x.plan === p.planId && x.status === 'active' && Date.parse(x.end) > A.now())
    .sort((a, b) => Math.abs(Date.parse(a.start) - Date.parse(p.at)) - Math.abs(Date.parse(b.start) - Date.parse(p.at)))[0];
  if (s && Math.abs(Date.parse(s.start) - Date.parse(p.at)) < 3 * 864e5) return {sub:s, text:'يتوقف اشتراكه «' + planName(s.plan) + '» فورًا ويعود إلى الباقة المجانية.'};
  return {text:'لا وصول مرتبطًا بهذه الدفعة الآن (انتهت مدتها أو استُبدلت).'};
}

/* activate the plan a payment bought (confirm transfer / link unmatched) → returns undo */
function activate(m, planId){
  const prev = D().subscriptions.find(s => s.memberId === m.id && s.status === 'active');
  const snap = {plan:m.plan, planStart:m.planStart, planEnd:m.planEnd, autoRenew:m.autoRenew};
  const end = planId === 'course' ? new Date(m.examDate + 'T20:59:00Z').toISOString() : A.addDays(null, 30 * (A.planOf(planId).months || 1));
  if (prev) prev.status = 'replaced';
  const s = {id:'SUB-' + (6000 + D().subscriptions.length), memberId:m.id, plan:planId, start:A.iso(), end, status:'active', renew:false, source:'payment'};
  D().subscriptions.push(s); Object.assign(m, {plan:planId, planStart:s.start, planEnd:end, autoRenew:false});
  return () => { D().subscriptions.splice(D().subscriptions.indexOf(s), 1); if (prev) prev.status = 'active'; Object.assign(m, snap); };
}

function refund(p){
  if (!A.can('refund')) return U.toast('لا تملك صلاحية الاسترداد.', {tone:'no'});
  const m = p.memberId && A.member(p.memberId), acc = accessOf(p);
  U.confirm({title:'استرداد ' + A.money(p.amount), text:h`يعود المبلغ إلى ${who(p)} عبر ${p.method} خلال ٥–١٠ أيام عمل. ${acc.text || ''}`, tone:'danger',
    secure:'استرداد مبلغ', confirmLabel:'استرد المبلغ', reasonPh:'مثال: طلب ولي الأمر خلال ٤٨ ساعة'}).then(r => {
    if (!r) return;
    Object.assign(p, {status:'refunded', refundedAt:A.iso(), refundReason:r.reason, refundBy:A.me().name});
    let note = 'لم يتغيّر وصول المشترك.';
    if (m && acc.sub) { const s = acc.sub; Object.assign(s, {status:'cancelled', end:A.iso(), cancelledAt:A.iso(), cancelReason:'استرداد ' + p.id, renew:false});
      if (m.plan === s.plan) Object.assign(m, {plan:'free', planStart:null, planEnd:null, autoRenew:false}); note = 'أُوقف اشتراك «' + planName(s.plan) + '» وعاد إلى المجانية.'; }
    else if (m && acc.coins) { const take = Math.min(acc.coins, m.coins); m.coins -= take;
      m.ledger.unshift({id:'L-R' + Date.now(), at:A.iso(), amount:-take, why:'استرداد شحن ' + p.id, balance:m.coins}); note = 'خُصمت ' + A.coins(take) + ' من رصيده.'; }
    p.accessNote = note;
    A.log({action:'payment.refund', target:m ? m.id : p.id, targetLabel:m ? m.name : who(p), summary:'استرداد ' + A.money(p.amount) + ' (' + p.id + ') — ' + note, reason:r.reason,
      before:{الحالة:'مدفوعة'}, after:{الحالة:'مستردة'}});
    done('استُرد ' + A.money(p.amount) + '. ' + note);
  });
}

function confirmTransfer(p){
  const m = A.member(p.memberId); if (!m) return;
  U.confirm({title:'أكّد تحويل ' + A.money(p.amount), text:'تأكّد أن المبلغ ظهر في كشف الحساب البنكي باسم ' + m.name + '. يُفتح له «' + planName(p.planId) + '» فورًا ويصله إشعار.',
    reason:'optional', confirmLabel:'أكّد التحويل'}).then(r => {
    if (!r) return;
    Object.assign(p, {status:'paid', confirmedAt:A.iso(), confirmedBy:A.me().name});
    const undoA = activate(m, p.planId);
    A.log({action:'payment.confirm', target:m.id, targetLabel:m.name, summary:'تأكيد تحويل ' + A.money(p.amount) + ' (' + p.id + ') وفتح «' + planName(p.planId) + '»', reason:r.reason, before:{الحالة:'معلّقة'}, after:{الحالة:'مدفوعة'}});
    done('أُكّد التحويل وفُتح «' + planName(p.planId) + '» لـ' + m.name + '.', () => { undoA(); p.status = 'pending'; delete p.confirmedAt; delete p.confirmedBy;
      A.log({action:'payment.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن تأكيد التحويل ' + p.id}); done('عادت العملية معلّقة.'); });
  });
}
function rejectTransfer(p){
  const m = A.member(p.memberId);
  U.confirm({title:'التحويل لم يصل', text:'تصبح العملية «فاشلة» ويصل ' + (m ? m.name : 'المشترك') + ' إشعار بأن التحويل لم يصل.', confirmLabel:'سجّلها فاشلة', reasonPh:'مثال: لا يوجد مبلغ بهذا الاسم في كشف ٢٠ أكتوبر'}).then(r => {
    if (!r) return; Object.assign(p, {status:'failed', failReason:'التحويل لم يصل — ' + r.reason});
    A.log({action:'payment.reject', target:m ? m.id : p.id, targetLabel:m ? m.name : p.id, summary:'تحويل لم يصل (' + p.id + ')', reason:r.reason, before:{الحالة:'معلّقة'}, after:{الحالة:'فاشلة'}});
    done('سُجّلت العملية فاشلة.', () => { p.status = 'pending'; delete p.failReason; A.log({action:'payment.undo', target:m ? m.id : p.id, targetLabel:m ? m.name : p.id, summary:'تراجع: العملية ' + p.id + ' معلّقة من جديد'}); done('عادت العملية معلّقة.'); });
  });
}

/* member picker inside a confirm modal (search by name / code / phone) */
function pickerBody(){ return h`<div class="fld py-pick" data-fld="member"><span class="lb">المشترك</span><label class="tb-s">${I('search', 's16')}<span class="sr">ابحث عن المشترك</span><input type="search" class="py-q" placeholder="الاسم أو الكود أو الجوال" autocomplete="off"></label><div class="py-res" role="radiogroup" aria-label="المشترك"></div></div>`; }
function wirePicker(mel, suggest){
  let picked = '';
  const inp = mel.querySelector('.py-q'), res = mel.querySelector('.py-res');
  const draw = () => { const raw = inp.value.trim(), qn = A.norm(raw), digits = qn.replace(/\D/g, ''), qp = A.normPhone(raw);
    const live = D().members.filter(m => !m.deleted);
    const list = !qn ? suggest() : live.filter(m => A.norm(m.name + ' ' + m.code + ' ' + m.email).includes(qn) || (digits.length >= 3 && (m.phone.includes(qp || digits) || m.code.includes(digits)))).slice(0, 6);
    res.innerHTML = String(list.length ? h`${!qn ? h`<span class="py-res-h">${suggest.label || 'مقترحات'}</span>` : ''}${list.map(m => h`<label class="opt"><input type="radio" name="member" value="${m.id}"${m.id === picked ? A.raw(' checked') : ''}><span><b>${m.name}</b><small>${A.id(m.code)} · ${planName(m.plan)}</small></span></label>`)}`
      : h`<p class="py-res-none">لا مشترك بهذا البحث.</p>`);
    res.querySelectorAll('input[name=member]').forEach(x => x.onchange = () => { picked = x.value; const e = mel.querySelector('[data-fld="member"] > .err'); if (e) e.remove(); }); };
  inp.addEventListener('input', draw); draw();
  return () => picked;
}

function linkMember(p){
  const tokens = A.norm(p.payer || '').split(' ').filter(t => t.length > 2 && t !== 'ام' && t !== 'ابو');
  const suggest = () => { const live = D().members.filter(m => !m.deleted);
    const sc = m => { const n = A.norm(m.name + ' ' + (m.parent ? m.parent.name : '') + ' ' + m.email); return tokens.filter(t => n.includes(t)).length; };
    return live.map(m => [m, sc(m)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]); };
  suggest.label = 'مقترحون من اسم الدافع «' + (p.payer || '') + '»';
  let getPick;
  U.confirm({title:'اربط ' + A.money(p.amount) + ' بمشترك', text:'الدافع: ' + (p.payer || 'غير معروف') + ' · ' + p.product + ' · ' + A.date(p.at) + '.', reason:'optional', confirmLabel:'اربط الدفعة',
    body:pickerBody(), fields:p.planId ? [{name:'open', type:'toggle', label:'افتح له «' + planName(p.planId) + '» الآن', value:true}] : [],
    onOpen:mel => { getPick = wirePicker(mel, suggest); },
    validate:() => getPick && getPick() ? '' : ['member', 'اختر المشترك أولًا.']}).then(r => {
    if (!r) return; const m = A.member(r.member); if (!m) return;
    const snap = {memberId:p.memberId, unmatched:p.unmatched};
    Object.assign(p, {memberId:m.id, unmatched:false, linkedAt:A.iso(), linkedBy:A.me().name});
    const undoA = r.open && p.planId ? activate(m, p.planId) : null;
    A.log({action:'payment.link', target:m.id, targetLabel:m.name, summary:'ربط ' + p.id + ' (' + A.money(p.amount) + ' من «' + p.payer + '») بالحساب' + (undoA ? ' وفتح «' + planName(p.planId) + '»' : ''), reason:r.reason, before:{المشترك:'بلا مشترك'}, after:{المشترك:m.name}});
    done('رُبطت الدفعة بحساب ' + m.name + (undoA ? ' وفُتح له «' + planName(p.planId) + '»' : '') + '.', () => { if (undoA) undoA(); Object.assign(p, snap); delete p.linkedAt; delete p.linkedBy;
      A.log({action:'payment.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن ربط ' + p.id}); done('عادت الدفعة بلا مشترك.'); });
  });
}

/* CSV export of the current tab (sensitive: reason + step-up + audit) */
function exportCsv(tab){
  if (!A.can('export')) return U.toast('لا تملك صلاحية تصدير البيانات.', {tone:'no'});
  const st = A.mem('tb:payments-' + tab); const rows = filterRows(tab, Object.assign({s:''}, st));
  if (!rows.length) return U.toast('لا عمليات لتصديرها.', {tone:'no'});
  U.confirm({title:'تصدير المدفوعات', text:'سيُنزَّل ملف CSV فيه ' + A.n(rows.length) + ' عملية حسب التبويب والفلاتر الحالية.', secure:'تصدير المدفوعات', confirmLabel:'صدّر الملف', reasonPh:'مثال: مطابقة المحاسب الشهرية'}).then(r => {
    if (!r) return;
    const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['رقم العملية', 'المشترك', 'الكود', 'المنتج', 'المبلغ', 'الطريقة', 'الحالة', 'التاريخ', 'المرجع'].map(q).join(',')].concat(rows.map(p => { const m = p.memberId && A.member(p.memberId);
      return [p.id, who(p), m ? m.code : '', p.product, p.amount, p.method, PS[keyOf(p)][0], p.at.slice(0, 10), p.ref].map(q).join(','); }));
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'alfitn-payments-' + A.iso().slice(0, 10) + '.csv'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    A.log({action:'payments.export', summary:'تصدير ' + A.n(rows.length) + ' عملية دفع (CSV)', reason:r.reason}); done('نُزّل الملف وسُجّل التصدير.');
  });
}

/* search: payments by number / reference */
A.searchProvider({id:'payments', label:'المدفوعات', icon:'card', max:4, find:(qn, raw) => { const d = A.norm(raw).replace(/\D/g, ''); if (d.length < 4 && !/^(pay|ch_)/i.test(raw)) return [];
  return D().payments.filter(p => p.id.includes(d || '\u0000') || A.norm(p.ref).includes(qn)).slice(0, 4).map(p => ({title:'عملية ' + p.id.replace('PAY-', '') + ' · ' + A.money(p.amount), sub:who(p) + ' · ' + PS[keyOf(p)][0], href:A.href('payments', {id:p.id}), icon:'card'})); }});
})();

</script>
<script data-part="page-reports.js">
/* البلاغات — ONE inbox for every user report (#/reports): خطأ في سؤال · بلاغ على لاعب · رسالة دعم · تقييم · ولي أمر.
   Tabs by status (جديد / قيد المعالجة / مغلق) + type filter. A row opens a drawer: the message, the related item
   (question → #/bank?q=…, member → #/member?id=…), the replies, a reply box (goes to the member's notifications),
   quick actions by type, and close-with-note. Deep link: #/reports?id=R-2440 opens that report.
   «قيّد اللاعب» uses the same restriction data + audit shape as the member profile (m.restrictions, action member.restrict). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;

const TYPES = {
  question:{label:'خطأ في سؤال', icon:'file'},
  player:{label:'بلاغ على لاعب', icon:'alert'},
  support:{label:'رسالة دعم', icon:'mail'},
  rating:{label:'تقييم', icon:'star'},
  parent:{label:'ولي أمر', icon:'users'}
};
const ST = {new:['جديد', 'brand'], progress:['قيد المعالجة', 'warn'], closed:['مغلق', '']};
const TAB_OF = {new:undefined, progress:'progress', closed:'closed'};
const statusChip = r => U.chip(ST[r.status][0], ST[r.status][1]);
const typeCell = r => h`<span class="rp-type">${I(TYPES[r.type].icon, 's16')}<span>${TYPES[r.type].label}</span></span>`;
const fromOf = r => { const m = A.member(r.from) || {name:'مشترك محذوف', code:''};
  if (r.type === 'parent' && m.parent) return {m, name:m.parent.name, sub:(m.parent.relation === 'الأم' ? 'والدة ' : 'والد ') + m.name.split(' ')[0]};
  return {m, name:m.name, sub:m.code}; };
const qOf = id => D().questions.find(q => q.id === id);
const excerpt = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const canEdit = () => A.can('reports.edit');

/* ---------- list ---------- */
function rowsFor(status, st){
  const qn = A.norm(st.s);
  return D().reports.filter(r => {
    if (r.status !== status) return false;
    if (st.type && r.type !== st.type) return false;
    if (!qn) return true;
    const f = fromOf(r);
    return A.norm([r.id, r.subject, r.body, f.name, f.m.name, f.m.code, TYPES[r.type].label].join(' ')).includes(qn);
  });
}
const COLS = [
  {key:'type', label:'النوع', render:typeCell, value:r => TYPES[r.type].label, width:'170px'},
  {key:'from', label:'من', render:r => { const f = fromOf(r);
    return h`<span class="nm"><a class="rp-who" href="${A.href('member', {id:r.from})}"><b>${f.name}</b></a><small>${f.sub && /^FTN/.test(f.sub) ? A.id(f.sub) : f.sub}${f.m && f.m.id && A.statusOf(f.m).key === 'banned' ? h` · <span class="flag-no">محظور</span>` : ''}</small></span>`; }, value:r => fromOf(r).name, width:'220px'},
  {key:'subject', label:'الموضوع', render:r => h`<span class="rp-subj"><b>${r.subject}</b>${r.replies.length ? h`<small>${A.n(r.replies.length)} ${r.replies.length === 1 ? 'رد' : r.replies.length === 2 ? 'ردّان' : 'ردود'}</small>` : ''}</span>`, value:r => r.subject},
  {key:'at', label:'التاريخ', render:r => h`<span class="nw" title="${A.when(r.at)}">${A.ago(r.at)}</span>`, value:r => r.at, width:'140px'},
  {key:'status', label:'الحالة', render:statusChip, sort:false, width:'130px'}
];

let deepHandled = null;
A.page('reports', {
  title:'البلاغات',
  sub:'كل ما يرسله المشتركون في مكان واحد: أخطاء الأسئلة، وبلاغات اللاعبين، ورسائل الدعم، والتقييمات.',
  tabs:() => [{id:'new', label:'جديد', count:D().reports.filter(r => r.status === 'new').length},
    {id:'progress', label:'قيد المعالجة', count:D().reports.filter(r => r.status === 'progress').length},
    {id:'closed', label:'مغلق', count:D().reports.filter(r => r.status === 'closed').length}],
  render(el, q, ctx){
    const status = ctx.tab || 'new';
    el.innerHTML = '<section class="card rp-list"><div class="rp-tb"></div><div class="rp-tbl"></div></section>';
    const EMPTY = {new:['لا بلاغات جديدة', 'كل بلاغ جديد يصل من المشتركين يظهر هنا أولًا.'], progress:['لا شيء قيد المعالجة', 'البلاغ الذي تبدأ معالجته أو ترد عليه ينتقل إلى هنا.'], closed:['لا بلاغات مغلقة بعد', 'البلاغات التي تغلقها تبقى هنا مع ملاحظة الإغلاق.']};
    const empty = {icon:'inbox'};
    let tbl;
    const tb = U.toolbar(el.querySelector('.rp-tb'), {id:'reports', unit:'بلاغ', search:'ابحث بالموضوع أو اسم المشترك أو رقم البلاغ',
      selects:[{key:'type', label:'النوع', options:Object.entries(TYPES).map(([v, t]) => ({v, label:t.label}))}],
      onChange:() => { tbl.reset(); draw(); }});
    tbl = U.table(el.querySelector('.rp-tbl'), {id:'reports-' + status, columns:COLS, rows:() => rowsFor(status, tb.state), onRow:r => openReport(r), sort:{key:'at', dir:'desc'},
      card:{title:r => r.subject, sub:r => h`${TYPES[r.type].label} · ${fromOf(r).name}`, side:r => statusChip(r), skip:['type', 'from', 'subject', 'status']}, empty});
    const draw = () => {
      const filtered = tb.state.s || tb.state.type;
      Object.assign(empty, filtered ? {icon:'search', title:'لا بلاغ بهذا البحث', text:'غيّر البحث أو امسح الفلاتر.'} : {icon:'inbox', title:EMPTY[status][0], text:EMPTY[status][1]});
      tbl.draw(); tb.count(rowsFor(status, tb.state).length, D().reports.filter(r => r.status === status).length);
    };
    draw();
    /* deep link from search / home: #/reports?id=R-… */
    if (q.id && deepHandled !== location.hash) { deepHandled = location.hash; const r = D().reports.find(x => x.id === q.id); if (r) openReport(r, true); }
  }
});

A.searchProvider({id:'reports', label:'البلاغات', icon:'inbox', max:4, find:(qn) => D().reports.filter(r => A.norm(r.id + ' ' + r.subject + ' ' + fromOf(r).name).includes(qn)).slice(0, 4)
  .map(r => ({title:r.subject, sub:r.id + ' · ' + TYPES[r.type].label + ' · ' + ST[r.status][0], href:A.href('reports', {tab:TAB_OF[r.status], id:r.id}), icon:TYPES[r.type].icon}))});

/* ---------- drawer ---------- */
function openReport(r, deep){
  const d = U.drawer({title:r.subject, sub:'', wide:true,
    onClose:() => { if (deep && A.cur.q.id) { const nq = Object.assign({}, A.cur.q); delete nq.id; history.replaceState(null, '', A.href('reports', nq)); delete A.cur.q.id; deepHandled = null; } },
    bind:{
      start:() => setStatus(r, 'progress', refresh),
      close:() => closeReport(r, refresh),
      reopen:() => setStatus(r, 'progress', refresh, true),
      send:(l) => sendReply(r, l.el, refresh),
      qOk:() => questionVerdict(r, true, refresh),
      qNo:() => questionVerdict(r, false, refresh),
      rateOk:() => ratingVerdict(r, true, refresh),
      rateNo:() => ratingVerdict(r, false, refresh),
      restrict:() => { const m = A.member(r.related && r.related.id); if (m) restrict(m, r, refresh); },
      unrestrict:() => { const m = A.member(r.related && r.related.id); if (m) unrestrict(m, r, refresh); }
    }});
  function refresh(){ if (d.closed) return; draw(); }
  function draw(){
    const f = fromOf(r), m = f.m, s = m.id ? A.statusOf(m) : null;
    d.el.querySelector('#dt').textContent = r.subject;
    d.el.querySelector('.drawer-h p') ? d.el.querySelector('.drawer-h p').remove() : 0;
    d.el.querySelector('.drawer-h .tt').insertAdjacentHTML('beforeend', String(h`<p>${typeCell(r)}<span class="rp-dot"></span>${statusChip(r)}<span class="rp-dot rp-hp"></span><span class="rp-hp">${A.id(r.id)}</span></p>`));
    const rel = relatedBlock(r);
    const acts = quickActions(r);
    d.set(h`<div class="rp-d">
      <div class="rp-from">${U.avatar(f.name)}<div class="tt"><a href="${A.href('member', {id:m.id})}"><b>${f.name}</b></a>
        <small>${r.type === 'parent' ? h`${f.sub} · ` : ''}${m.code ? A.id(m.code) : ''}${m.plan ? h` · ${A.planOf(m.plan).name}` : ''}${s && s.key !== 'active' ? h` · ${s.label}` : ''}</small></div>
        <span class="rp-when">${A.when(r.at)}</span></div>
      <div class="rp-msg">${r.body}</div>
      ${rel}
      ${acts ? h`<div class="rp-acts">${acts}</div>` : ''}
      ${r.verdict ? h`<p class="rp-verdict">${I(r.verdict === 'rejected' ? 'x' : 'checkCircle', 's16')}<span>${verdictText(r)}</span></p>` : ''}
      <section class="rp-sec"><h3>الردود</h3>
        ${r.replies.length ? h`<ol class="rp-thread">${r.replies.map(x => h`<li><div class="rp-bub"><p>${x.text}</p><small>${x.by} · ${A.when(x.at)}</small></div></li>`)}</ol>` : h`<p class="mut rp-none">لم يُرد عليه بعد.</p>`}
        ${r.status === 'closed' ? h`<div class="rp-closed">${I('lock', 's16')}<span>أُغلق ${A.when(r.closedAt)}${r.closedBy ? ' · ' + r.closedBy : ''}${r.closeNote ? h`<br><b>ملاحظة الإغلاق:</b> ${r.closeNote}` : ''}</span></div>`
          : canEdit() ? h`<div class="rp-reply">${U.field({name:'reply', label:'ردّك على ' + f.name.split(' ')[0], type:'textarea', placeholder:'اكتب ردًّا قصيرًا وواضحًا'})}
            <div class="rp-reply-f"><span class="muted-note">${I('bell', 's16')}يصل إلى إشعاراته داخل المنصة</span>${U.btn({label:'أرسل الرد', icon:'mail', a:'send', sm:false})}</div></div>` : ''}
      </section></div>`);
    let foot = '';
    if (canEdit()) foot = r.status === 'new' ? h`${U.btn({label:'ابدأ المعالجة', tone:'primary', a:'start'})}${U.btn({label:'أغلق البلاغ', icon:'check', a:'close'})}`
      : r.status === 'progress' ? h`${U.btn({label:'أغلق البلاغ', icon:'check', tone:'primary', a:'close'})}` : h`${U.btn({label:'أعد فتح البلاغ', icon:'undo', a:'reopen'})}`;
    let ft = d.el.querySelector('.drawer-f');
    if (!ft) { ft = document.createElement('div'); ft.className = 'drawer-f'; d.el.append(ft); }
    ft.innerHTML = String(foot); ft.hidden = !foot;
  }
  draw();
  return d;
}

function relatedBlock(r){
  if (r.related && r.related.kind === 'question') {
    const q = qOf(r.related.id);
    return h`<section class="rp-sec"><h3>السؤال المرتبط</h3>${q ? h`<a class="rp-rel" href="${A.href('bank', {q:q.id})}"><span class="ri">${I('bank', 's16')}</span>
      <span class="tt"><b>${A.id(q.id)}</b><span class="q">${A.ar(excerpt(q.text, 110))}</span></span>${U.chip(q.status === 'published' ? 'منشور' : q.status === 'review' ? 'يحتاج مراجعة' : 'مسودة', q.status === 'review' ? 'warn' : q.status === 'published' ? 'ok' : '')}</a>` : h`<p class="mut">السؤال ${A.id(r.related.id)} غير موجود في البنك.</p>`}</section>`;
  }
  if (r.related && r.related.kind === 'member') {
    const m = A.member(r.related.id); if (!m) return '';
    const s = A.statusOf(m);
    return h`<section class="rp-sec"><h3>اللاعب المُبلَّغ عنه</h3><a class="rp-rel" href="${A.href('member', {id:m.id})}">${U.avatar(m.name)}
      <span class="tt"><b>${m.name}</b><small>${A.id(m.code)} · ${A.planOf(m.plan).name}${s.key === 'restricted' ? ' · مقيّد من ' + s.detail : ''}</small></span>${U.chip(s.label, s.tone)}</a></section>`;
  }
  return '';
}
function quickActions(r){
  const out = [];
  const closed = r.status === 'closed', ed = canEdit();
  if (r.type === 'question' && r.related) {
    out.push(U.btn({label:'افتح السؤال', icon:'external', href:A.href('bank', {q:r.related.id})}));
    if (!closed && !r.verdict) out.push(U.btn({label:'البلاغ صحيح', icon:'check', a:'qOk', disabled:!ed}), U.btn({label:'غير صحيح', icon:'x', tone:'ghost', a:'qNo', disabled:!ed}));
  } else if (r.type === 'player' && r.related) {
    const m = A.member(r.related.id), s = m ? A.statusOf(m) : null;
    out.push(U.btn({label:'افتح ملف اللاعب', icon:'user', href:A.href('member', {id:r.related.id})}));
    if (m && s.key === 'restricted') out.push(U.btn({label:'ارفع التقييد', icon:'undo', tone:'ghost', a:'unrestrict', disabled:!A.can('ban')}));
    if (m && s.key !== 'banned') out.push(U.btn({label:s.key === 'restricted' ? 'عدّل التقييد' : 'قيّد اللاعب', icon:'pause', a:'restrict', disabled:!A.can('ban'), title:A.can('ban') ? '' : 'تحتاج صلاحية الحظر والتقييد'}));
  } else if (r.type === 'rating') {
    if (!closed && !r.verdict) out.push(U.btn({label:'اقبل التقييم', icon:'check', a:'rateOk', disabled:!ed}), U.btn({label:'ارفض', icon:'x', tone:'ghost', a:'rateNo', disabled:!ed}));
    out.push(U.btn({label:'ملف المشترك', icon:'user', tone:'ghost', href:A.href('member', {id:r.from})}));
  } else {
    out.push(U.btn({label:r.type === 'parent' ? 'افتح ملف الابن' : 'افتح ملف المشترك', icon:'user', href:A.href('member', {id:r.from})}));
  }
  return out.length ? h`${out}` : '';
}
const verdictText = r => ({
  'question:accepted':'البلاغ صحيح — السؤال مُعلَّم «يحتاج مراجعة» حتى يُصلَح في بنك الأسئلة.',
  'question:rejected':'البلاغ غير صحيح — السؤال سليم.',
  'rating:accepted':'قُبل التقييم ويظهر في صفحة التقييمات.',
  'rating:rejected':'رُفض التقييم ولا يظهر للزوار.',
  'player:action':'قُيّد اللاعب بسبب هذا البلاغ.'
})[r.type + ':' + r.verdict] || '';

/* ---------- actions ---------- */
const memberOf = r => A.member(r.from) || {};
const logR = (r, e) => A.log(Object.assign({target:r.from, targetLabel:memberOf(r).name || '', report:r.id}, e));
const done = (text, refresh, undo) => { A.changed(); refresh(); U.toast(text, undo ? {undo} : {}); };

function setStatus(r, to, refresh, reopen){
  if (!canEdit()) return U.toast('لا تملك صلاحية تعديل البلاغات.', {tone:'no'});
  const before = r.status; const snap = {closedAt:r.closedAt, closeNote:r.closeNote, closedBy:r.closedBy};
  r.status = to; r.assignee = A.me().name; if (reopen) { delete r.closedAt; delete r.closeNote; delete r.closedBy; }
  logR(r, {action:reopen ? 'report.reopen' : 'report.start', summary:(reopen ? 'إعادة فتح البلاغ ' : 'بدء معالجة البلاغ ') + r.id + ': «' + r.subject + '»', before:{الحالة:ST[before][0]}, after:{الحالة:ST[to][0]}});
  done(reopen ? 'أُعيد فتح البلاغ.' : 'انتقل البلاغ إلى «قيد المعالجة».', refresh, () => { r.status = before; Object.assign(r, snap);
    logR(r, {action:'report.undo', summary:'تراجع عن تغيير حالة البلاغ ' + r.id, before:{الحالة:ST[to][0]}, after:{الحالة:ST[before][0]}}); done('تراجعنا.', refresh); });
}
function sendReply(r, root, refresh){
  if (!canEdit()) return;
  const ta = root.querySelector('textarea[name="reply"]'); const text = (ta.value || '').trim();
  const fld = ta.closest('.fld'); let er = fld.querySelector('.err');
  if (text.length < 2) { if (!er) { er = document.createElement('span'); er.className = 'err'; fld.append(er); } er.textContent = 'اكتب الرد أولًا.'; ta.classList.add('bad'); ta.focus(); return; }
  const m = memberOf(r), before = r.status;
  const rep = {by:A.me().name, at:A.iso(), text}; r.replies.push(rep);
  const note = {at:rep.at, title:'ردّ على بلاغك: «' + r.subject + '»', body:text, by:A.me().name, report:r.id};
  if (m.notifications) m.notifications.unshift(note);
  if (r.status === 'new') { r.status = 'progress'; r.assignee = A.me().name; }
  logR(r, {action:'report.reply', summary:'رد على البلاغ ' + r.id + ' (يصل إلى إشعاراته)', after:before !== r.status ? {الحالة:ST[r.status][0]} : null, before:before !== r.status ? {الحالة:ST[before][0]} : null});
  done('أُرسل الرد إلى إشعارات ' + (m.name || 'المشترك') + '.', refresh);
}
function closeReport(r, refresh){
  if (!canEdit()) return;
  U.confirm({title:'أغلق البلاغ', text:'«' + r.subject + '» — يبقى في «مغلق» مع ملاحظتك، ويمكن إعادة فتحه.', reason:false, confirmLabel:'أغلق البلاغ',
    fields:[{name:'note', type:'textarea', label:'ملاحظة الإغلاق', placeholder:'ماذا فعلنا؟ مثال: أُصلح السؤال في الإصدار ٢', required:true, requiredMsg:'اكتب ملاحظة قصيرة.'},
      {name:'notify', type:'toggle', label:'أرسل الملاحظة للمشترك في إشعاراته', value:r.type !== 'player'}]}).then(v => {
    if (!v) return; const before = r.status, m = memberOf(r);
    Object.assign(r, {status:'closed', closedAt:A.iso(), closeNote:v.note, closedBy:A.me().name});
    if (v.notify) { r.replies.push({by:A.me().name, at:A.iso(), text:v.note}); if (m.notifications) m.notifications.unshift({at:A.iso(), title:'أُغلق بلاغك: «' + r.subject + '»', body:v.note, by:A.me().name, report:r.id}); }
    logR(r, {action:'report.close', summary:'إغلاق البلاغ ' + r.id + ': «' + r.subject + '»', reason:v.note, before:{الحالة:ST[before][0]}, after:{الحالة:'مغلق'}});
    done('أُغلق البلاغ.', refresh, () => { r.status = before; delete r.closedAt; delete r.closeNote; delete r.closedBy; if (v.notify) r.replies.pop();
      logR(r, {action:'report.undo', summary:'تراجع عن إغلاق البلاغ ' + r.id, before:{الحالة:'مغلق'}, after:{الحالة:ST[before][0]}}); done('عاد البلاغ مفتوحًا.', refresh); });
  });
}
function questionVerdict(r, ok, refresh){
  const q = qOf(r.related.id); if (!q) return;
  const label = s => s === 'published' ? 'منشور' : s === 'review' ? 'يحتاج مراجعة' : 'مسودة';
  U.confirm(ok ? {title:'البلاغ صحيح', text:h`يُعلَّم السؤال ${A.id(q.id)} «يحتاج مراجعة» ويُخفى عن الطلاب حتى يُصلَح ويُنشر من بنك الأسئلة.`, confirmLabel:'علّم السؤال', reason:'optional'}
    : {title:'البلاغ غير صحيح', text:'يبقى السؤال كما هو ويُغلق البلاغ. يُستحسن أن ترد على المشترك بالتوضيح أولًا.', confirmLabel:'أغلق البلاغ', reasonPh:'لماذا السؤال سليم؟ مثال: الإجابة (ب) صحيحة لأن…'}).then(v => {
    if (!v) return; const before = {qs:q.status, rs:r.status};
    if (ok) { q.status = 'review'; r.verdict = 'accepted'; if (r.status === 'new') r.status = 'progress'; }
    else { r.verdict = 'rejected'; Object.assign(r, {status:'closed', closedAt:A.iso(), closeNote:v.reason, closedBy:A.me().name}); }
    logR(r, {action:ok ? 'report.accept' : 'report.reject', summary:(ok ? 'تأكيد بلاغ خطأ في السؤال ' : 'رفض بلاغ خطأ في السؤال ') + q.id, reason:v.reason,
      before:ok ? {'حالة السؤال':label(before.qs)} : {الحالة:ST[before.rs][0]}, after:ok ? {'حالة السؤال':'يحتاج مراجعة'} : {الحالة:'مغلق'}});
    done(ok ? 'عُلِّم السؤال «يحتاج مراجعة».' : 'أُغلق البلاغ والسؤال سليم.', refresh, () => { q.status = before.qs; r.status = before.rs; delete r.verdict; delete r.closedAt; delete r.closeNote; delete r.closedBy;
      logR(r, {action:'report.undo', summary:'تراجع عن الحكم على البلاغ ' + r.id}); done('تراجعنا.', refresh); });
  });
}
function ratingVerdict(r, ok, refresh){
  U.confirm(ok ? {title:'اقبل التقييم', text:'يظهر التقييم في صفحة التقييمات العامة ويُغلق البلاغ.', confirmLabel:'اقبل', reason:'optional'}
    : {title:'ارفض التقييم', text:'لا يظهر التقييم للزوار، ويبقى محفوظًا هنا.', confirmLabel:'ارفض', reasonPh:'مثال: يحتوي رقم جوال أو إساءة'}).then(v => {
    if (!v) return; const before = r.status;
    r.verdict = ok ? 'accepted' : 'rejected';
    Object.assign(r, {status:'closed', closedAt:A.iso(), closeNote:v.reason || (ok ? 'قُبل التقييم' : ''), closedBy:A.me().name});
    logR(r, {action:ok ? 'report.accept' : 'report.reject', summary:(ok ? 'قبول ' : 'رفض ') + 'تقييم: «' + r.subject + '»', reason:v.reason, before:{الحالة:ST[before][0]}, after:{الحالة:'مغلق', التقييم:ok ? 'ظاهر' : 'مخفي'}});
    done(ok ? 'قُبل التقييم.' : 'رُفض التقييم.', refresh, () => { r.status = before; delete r.verdict; delete r.closedAt; delete r.closeNote; delete r.closedBy;
      logR(r, {action:'report.undo', summary:'تراجع عن الحكم على التقييم ' + r.id}); done('تراجعنا.', refresh); });
  });
}

/* «قيّد اللاعب» — same flow, data and audit entry as the member profile (page-members.js restrict()) */
const durDays = v => ({d1:1, d3:3, w1:7, m1:30}[v]);
const durLabel = v => ({d1:'يوم', d3:'٣ أيام', w1:'أسبوع', m1:'شهر'}[v]);
function restrict(m, r, refresh){
  if (!A.can('ban')) return U.toast('تحتاج صلاحية الحظر والتقييد.', {tone:'no'});
  const cur = A.statusOf(m).active || [];
  U.confirm({title:'قيّد ' + m.name, text:'يبقى حسابه يعمل، وتُغلق عنه الأجزاء التي تختارها فقط حتى نهاية المدة.', secure:'تقييد مشترك', confirmLabel:'قيّد',
    fields:[{name:'features', type:'opts', multi:true, label:'ماذا تُغلق عنه؟', value:cur.length ? cur.map(x => x.feature) : ['lobby'], options:D().features.map(f => ({v:f.id, label:f.label}))},
      {name:'dur', type:'seg', label:'المدة', value:'d3', options:[{v:'d1', label:'يوم'}, {v:'d3', label:'٣ أيام'}, {v:'w1', label:'أسبوع'}, {v:'m1', label:'شهر'}]}],
    reasonPh:'السبب — مثال: ' + r.subject,
    validate:v => !v.features.length ? ['features', 'اختر جزءًا واحدًا على الأقل.'] : ''}).then(v => {
    if (!v) return; const before = (m.restrictions || []).slice(), was = A.statusOf(m).label, rb = {status:r.status, verdict:r.verdict};
    const until = A.addDays(null, durDays(v.dur));
    m.restrictions = v.features.map(f => ({feature:f, until, reason:v.reason, by:A.me().id, at:A.iso(), report:r.id}));
    const what = v.features.map(A.featureLabel).join('، ');
    A.log({action:'member.restrict', target:m.id, targetLabel:m.name, summary:'تقييد ' + what + ' — ' + durLabel(v.dur) + ' (بسبب البلاغ ' + r.id + ')', reason:v.reason, report:r.id, before:{الحالة:was}, after:{الحالة:'مقيّد', حتى:A.date(until)}});
    r.verdict = 'action'; if (r.status === 'new') r.status = 'progress';
    done('قُيّد ' + m.name + ' من ' + what + ' لمدة ' + durLabel(v.dur) + '.', refresh, () => { m.restrictions = before; Object.assign(r, rb); if (!rb.verdict) delete r.verdict;
      A.log({action:'member.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن التقييد', before:{الحالة:'مقيّد'}, after:{الحالة:A.statusOf(m).label}}); done('تراجعنا عن التقييد.', refresh); });
  });
}
function unrestrict(m, r, refresh){
  if (!A.can('ban')) return;
  U.confirm({title:'ارفع التقييد عن ' + m.name, text:'تُفتح له كل الأجزاء فورًا.', confirmLabel:'ارفع التقييد', reason:'optional'}).then(v => {
    if (!v) return; const before = m.restrictions.slice(); m.restrictions = [];
    A.log({action:'member.unrestrict', target:m.id, targetLabel:m.name, summary:'رفع التقييد', reason:v.reason, before:{الحالة:'مقيّد'}, after:{الحالة:A.statusOf(m).label}});
    done('رُفع التقييد عن ' + m.name + '.', refresh, () => { m.restrictions = before; A.log({action:'member.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن رفع التقييد'}); done('عاد التقييد.', refresh); });
  });
}
})();

</script>
<script data-part="page-settings.js">
/* الإعدادات (#/settings) — tabs: عام (platform name, support contacts) · الأرقام (platform numbers; each change = reason + step-up)
   · الأمان (owner password, 2FA, active sessions) · السجل (the audit log of everything A.log recorded; filters; export = step-up). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const canEdit = () => A.can('settings.edit');

/* numbers the brief asks for that data.js does not carry yet (added without clobbering) */
const ensure = () => {
  const st = D().settings; const nums = st.numbers;
  [{id:'dailyReward', label:'مكافأة تحدّي اليوم', value:50, unit:'عملة'}, {id:'inviteReward', label:'مكافأة دعوة صديق', value:500, unit:'عملة'}, {id:'streakReward', label:'مكافأة أسبوع ستريك', value:70, unit:'عملة'}]
    .forEach((n, i) => { if (!nums.some(x => x.id === n.id)) { const at = nums.findIndex(x => x.id === 'xpCorrect'); nums.splice(at < 0 ? nums.length : at + 1 + i, 0, n); } });
  st.security = st.security || {pwChangedAt:A.addDays(null, -64), twoFAAt:A.addDays(null, -400), backupLeft:8, require2FA:false};
};
const GROUP = {freeDaily:'الباقة المجانية', freeMistakes:'الباقة المجانية', refundHours:'المدفوعات', xpCorrect:'الخبرة', lessonQuiz:'دورة الفطن', inviteDiscount:'المدفوعات', gamesCoinsCap:'الألعاب'};
const groupOf = n => GROUP[n.id] || 'المكافآت';

const TABS = [{id:'general', label:'عام'}, {id:'numbers', label:'الأرقام'}, {id:'security', label:'الأمان'}, {id:'log', label:'السجل'}];
A.page('settings', {
  title:'الإعدادات',
  sub:'بيانات المنصة، والأرقام التي تتحكم في التجربة، والأمان، وسجل كل ما حدث.',
  tabs:TABS,
  primary:q => q.tab === 'log' ? {label:'صدّر السجل', icon:'download', tone:'secondary', disabled:!A.can('export'), run:() => exportLog()} : null,
  render(el, q, ctx){ ensure(); ({general, numbers, security, log})[ctx.tab](el); }
});

/* --- عام --- */
function general(el){
  const g = D().settings.general, dis = !canEdit();
  el.innerHTML = String(h`<section class="card st-form"><div class="card-h"><h2>بيانات المنصة</h2></div><div class="card-b">
    ${U.fields([{name:'name', label:'اسم المنصة', value:g.name, hint:'يظهر في التطبيق والإيميلات والفواتير.'},
      [{name:'whatsapp', type:'tel', label:'واتساب الدعم', value:g.whatsapp, placeholder:'05xxxxxxxx'}, {name:'supportEmail', type:'email', label:'بريد الدعم', value:g.supportEmail}],
      {name:'hours', label:'ساعات الدعم', value:g.hours, hint:'تظهر للطلاب بجانب زر التواصل.'}])}
    </div><div class="st-form-f">${dis ? h`<span class="muted-note">${I('lock', 's16')}للعرض فقط — تحتاج صلاحية تعديل الإدارة.</span>` : ''}<span class="sp"></span>${U.btn({label:'احفظ', tone:'primary', a:'save', disabled:dis})}</div></section>`);
  if (dis) el.querySelectorAll('.in').forEach(x => x.disabled = true);
  A.bind(el, {save:() => {
    const v = U.values(el), LB = {name:'اسم المنصة', whatsapp:'واتساب الدعم', supportEmail:'بريد الدعم', hours:'ساعات الدعم'};
    if (v.supportEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.supportEmail)) return U.toast('اكتب بريدًا صحيحًا.', {tone:'no'});
    const wa = A.normPhone(v.whatsapp); if (v.whatsapp && !/^05\d{8}$/.test(wa)) return U.toast('اكتب رقم جوال سعودي صحيح للواتساب.', {tone:'no'});
    v.whatsapp = wa || '';
    const ch = Object.keys(LB).filter(k => String(v[k] || '') !== String(g[k] || ''));
    if (!ch.length) return U.toast('لا تغييرات لحفظها.');
    const before = {}, after = {}; ch.forEach(k => { before[LB[k]] = g[k] || '—'; after[LB[k]] = v[k] || '—'; });
    const old = Object.assign({}, g); ch.forEach(k => { g[k] = v[k]; });
    A.log({action:'settings.general', summary:'تعديل بيانات المنصة: ' + ch.map(k => LB[k]).join('، '), before, after});
    A.changed(); U.toast('حُفظت بيانات المنصة.', {undo:() => { Object.assign(g, old); A.log({action:'settings.general', summary:'تراجع عن تعديل بيانات المنصة', before:after, after:before}); A.changed(); }});
  }});
}

/* --- الأرقام --- */
function lastChange(n){ return D().audit.find(e => e.action === 'settings.number' && (e.target === n.id || (!e.target && e.summary === n.label))); }
function numbers(el){
  el.innerHTML = '<section class="card st-nums"><div class="st-ntbl"></div></section>';
  U.table(el.querySelector('.st-ntbl'), {id:'st-numbers', rows:() => D().settings.numbers, pageSize:50, columns:[
    {key:'label', label:'الإعداد', render:n => h`<span class="nm"><b>${n.label}</b><small>${groupOf(n)}</small></span>`, sort:false},
    {key:'value', label:'القيمة', num:true, render:n => h`<b class="num st-v">${A.n(n.value)}</b> <span class="mut">${n.unit}</span>`, sort:false, width:'160px'},
    {key:'changed', label:'آخر تعديل', sort:false, render:n => { const e = lastChange(n); return e ? h`<span class="nw">${A.ago(e.at)}</span><span class="sub">${e.actorName}</span>` : h`<span class="mut">—</span>`; }, width:'160px'},
    {key:'act', label:'', sort:false, width:'1%', render:n => U.btn({label:'عدّل', icon:'edit', sm:true, tone:'ghost', disabled:!canEdit(), attrs:h`data-n="${n.id}"`})}],
    card:{title:n => n.label, sub:n => groupOf(n), side:n => h`<b class="num">${A.n(n.value)}</b> <small class="mut">${n.unit}</small>`, skip:['label', 'value']},
    empty:{icon:'gear', title:'لا أرقام', text:''}}).draw();
  el.onclick = e => { const b = e.target.closest('[data-n]'); if (b) editNumber(D().settings.numbers.find(n => n.id === b.dataset.n)); };
}
function editNumber(n){
  if (!n || !canEdit()) return;
  U.confirm({title:'عدّل «' + n.label + '»', text:'القيمة الآن ' + A.n(n.value) + ' ' + n.unit + '. يُطبَّق التغيير على كل الطلاب فورًا.', secure:'تعديل رقم في المنصة', confirmLabel:'احفظ',
    fields:[{name:'value', type:'number', label:'القيمة الجديدة (' + n.unit + ')', value:n.value, min:0, max:100000}],
    validate:v => !(Number.isInteger(v.value) && v.value >= 0 && v.value <= 100000) ? ['value', 'اكتب عددًا صحيحًا من ٠ إلى ١٠٠٬٠٠٠.'] : v.value === n.value ? ['value', 'هذه هي القيمة الحالية.'] : '',
    reasonPh:'لماذا؟ مثال: تجربة رفع الحد لأسبوع'}).then(v => {
    if (!v) return; const before = n.value; n.value = v.value;
    A.log({action:'settings.number', target:n.id, targetLabel:n.label, summary:n.label, reason:v.reason, before:{القيمة:before}, after:{القيمة:n.value}});
    A.changed(); U.toast('«' + n.label + '» صار ' + A.n(n.value) + ' ' + n.unit + '.', {undo:() => { const now = n.value; n.value = before;
      A.log({action:'settings.number', target:n.id, targetLabel:n.label, summary:n.label + ' (تراجع)', before:{القيمة:now}, after:{القيمة:before}}); A.changed(); }});
  });
}

/* --- الأمان --- */
function security(el){
  const me = A.me(), sec = D().settings.security;
  el.innerHTML = String(h`<div class="stack">
    <div class="grid2 even">
      ${U.card({title:'كلمة المرور', body:h`<div class="st-row"><span class="tt"><b>آخر تغيير ${A.ago(sec.pwChangedAt)}</b><small>${me.email}</small></span>${U.btn({label:'غيّر كلمة المرور', icon:'key', a:'pw'})}</div>`})}
      ${U.card({title:'التحقق الثنائي', body:h`<div class="st-row"><span class="tt"><b>${me.twoFA !== false ? h`<span class="st-ok">${I('checkCircle', 's16')}مفعّل عبر تطبيق المصادقة</span>` : 'غير مفعّل'}</b><small>${A.n(sec.backupLeft)} رموز احتياطية متبقية</small></span>${U.btn({label:'رموز احتياطية جديدة', a:'backup'})}</div>
        ${me.owner ? h`<div class="st-row st-req"><span class="tt"><b>اطلبه من كل الموظفين</b><small>${sec.require2FA ? 'لا يدخل موظف بلا تحقق ثنائي' : A.n(D().staff.filter(s => !s.twoFA && s.status === 'active').length) + ' موظف بلا تحقق ثنائي الآن'}</small></span>
          <button type="button" class="st-sw" role="switch" aria-checked="${!!sec.require2FA}" aria-label="اطلب التحقق الثنائي من كل الموظفين" data-a="req"><i></i></button></div>` : ''}`})}
    </div>
    ${U.card({title:'جلساتك المفتوحة', flush:true, body:h`<div class="st-sess"></div>`})}
    <p class="muted-note">${I('lock', 's16')}كل إجراء حساس يطلب كلمة المرور ورمز التحقق مرة كل ١٥ دقيقة، ويُكتب في السجل.</p>
  </div>`);
  U.table(el.querySelector('.st-sess'), {id:'st-sess', rows:() => me.sessions || [], pageSize:20, columns:[
    {key:'device', label:'الجهاز', render:x => h`<bdi class="ltr">${x.device}</bdi>`}, {key:'place', label:'المكان'},
