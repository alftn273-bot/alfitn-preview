      <div><h3 class="sb-dh">من استخدمه</h3><div class="sb-red"></div></div></div>`,
    foot:canPrice() ? (c.active ? U.btn({label:'أوقف الكود', icon:'pause', tone:'danger', a:'toggle'}) : U.btn({label:'فعّل الكود', icon:'check', tone:'primary', a:'toggle'})) : h`<span class="muted-note">${I('lock', 's16')}الإيقاف والتفعيل يحتاجان صلاحية «تعديل الأسعار».</span>`,
    bind:{toggle:l => { l.close(); toggleCode(c); }}});
  U.table(d.el.querySelector('.sb-red'), {id:'code-red', rows:c.redemptions, pageSize:8, sort:{key:'at', dir:'desc'}, columns:[
    {key:'member', label:'المشترك', render:r => U.who(A.member(r.memberId)), value:r => (A.member(r.memberId) || {}).name},
    {key:'at', label:'التاريخ', render:r => h`<span class="nw">${A.date(r.at)}</span>`},
    {key:'saved', label:'وفّر', num:true, render:r => h`<span class="nw">${A.money(r.saved)}</span>`}],
    card:{title:r => (A.member(r.memberId) || {}).name || '—', sub:r => A.date(r.at), side:r => A.money(r.saved), skip:['member', 'at', 'saved']},
    empty:{icon:'card', title:'لم يُستخدم بعد', text:''}}).draw();
}
function toggleCode(c){
  if (!canPrice()) return;
  const on = !c.active;
  U.confirm({title:(on ? 'فعّل' : 'أوقف') + ' الكود ' + c.code, text:on ? 'يستطيع المشتركون استخدامه من جديد.' : 'يتوقف فورًا. من استخدمه قبل ذلك يبقى خصمه.', tone:on ? '' : 'danger', reason:on ? 'optional' : true,
    secure:on ? 'تفعيل كود خصم' : false, confirmLabel:on ? 'فعّل' : 'أوقف'}).then(r => {
    if (!r) return; c.active = on;
    A.log({action:'coupon.' + (on ? 'on' : 'off'), target:c.id, targetLabel:c.code, summary:(on ? 'تفعيل' : 'إيقاف') + ' كود الخصم ' + c.code, reason:r.reason, before:{الحالة:on ? 'موقوف' : 'فعّال'}, after:{الحالة:on ? 'فعّال' : 'موقوف'}});
    done(on ? 'فُعّل الكود ' + c.code + '.' : 'أُوقف الكود ' + c.code + '.', () => { c.active = !on; done('تراجعنا.'); });
  });
}
function newCode(){
  if (!canPrice()) return U.toast('أكواد الخصم تحتاج صلاحية «تعديل الأسعار».', {tone:'no'});
  U.confirm({title:'أنشئ كود خصم', text:'يكتبه المشترك عند الدفع فيُخصم من سعر الباقة.', secure:'إنشاء كود خصم', confirmLabel:'أنشئ الكود', reasonPh:'مثال: عرض العودة للمدارس',
    fields:[[{name:'code', label:'الكود', placeholder:'BACK2SCHOOL', dir:'ltr', required:true, maxlength:16}, {name:'pct', type:'number', label:'الخصم ٪', value:15, min:1, max:90}],
      {name:'plans', type:'opts', multi:true, label:'يسري على', value:['pro', 'lux', 'course'], options:D().plans.filter(p => p.id !== 'free').map(p => ({v:p.id, label:p.name, sub:A.money(p.price)}))},
      [{name:'max', type:'number', label:'عدد مرات الاستخدام (اختياري)', placeholder:'بلا حد'}, {name:'expires', type:'date', label:'ينتهي (اختياري)'}]],
    validate:v => { const code = String(v.code || '').toUpperCase();
      return !/^[A-Z0-9]{4,16}$/.test(code) ? ['code', 'من ٤ إلى ١٦ حرفًا إنجليزيًا أو رقمًا، بلا مسافات.'] : D().coupons.some(c => c.code === code) ? ['code', 'هذا الكود موجود.']
        : !(v.pct >= 1 && v.pct <= 90) ? ['pct', 'الخصم من ١ إلى ٩٠٪.'] : !v.plans.length ? ['plans', 'اختر باقة واحدة على الأقل.']
        : v.max !== '' && !(v.max >= 1) ? ['max', 'اكتب عددًا أو اتركه فارغًا.'] : v.expires && v.expires <= A.iso().slice(0, 10) ? ['expires', 'اختر تاريخًا بعد اليوم.'] : ''; }}).then(r => {
    if (!r) return;
    const c = {id:'CP-' + (D().coupons.length + 1), code:r.code.toUpperCase(), pct:Math.round(r.pct), plans:r.plans, expires:r.expires ? new Date(r.expires + 'T23:59:00+03:00').toISOString() : null,
      max:r.max === '' ? null : Math.round(r.max), active:true, createdAt:A.iso(), by:A.me().name, redemptions:[]};
    D().coupons.unshift(c);
    A.log({action:'coupon.add', target:c.id, targetLabel:c.code, summary:'كود خصم ' + c.code + ' — ' + A.pct(c.pct) + ' على ' + plansOf(c), reason:r.reason, after:{الخصم:A.pct(c.pct), الاستخدام:c.max || 'بلا حد'}});
    done('أُنشئ الكود ' + c.code + '.', () => { D().coupons.splice(D().coupons.indexOf(c), 1); A.log({action:'coupon.undo', target:c.id, targetLabel:c.code, summary:'تراجع عن إنشاء ' + c.code}); done('حُذف الكود.'); });
  });
}

/* search: subscriptions are reached through members; plans by name */
A.searchProvider({id:'plans', label:'الباقات', icon:'repeat', max:3, find:qn => D().plans.filter(p => A.norm(p.name).includes(qn)).map(p => ({title:p.name, sub:p.price ? A.money(p.price) + ' ' + p.period : 'مجانًا', href:A.href('subscriptions', {tab:'plans'}), icon:'repeat'}))});
})();

</script>
<script data-part="page-updates.js">
/* التحديثات (#/updates) — how an update reaches students (5-step stepper), the release waiting for approval
   (اعتمد وانشر = reason optional + step-up; ارفض = reason), past releases with «ارجع لهذا الإصدار» (step-up + reason),
   and kill switches (turning off is instant with a reason; turning back on needs step-up). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const R = () => D().releases;
const live = () => R().find(r => r.status === 'live');
const pending = () => R().filter(r => r.status === 'pending');
const ver = v => A.id(v);
const canRelease = () => A.can('release');

const SW = [
  ['lobby', 'اللوبي', 'غرف الطلاب والمحادثة'],
  ['voice', 'الصوت', 'الغرف الصوتية'],
  ['games', 'الألعاب', 'التحديات والألعاب الجماعية'],
  ['store', 'المتجر', 'شراء العناصر بالعملات'],
  ['signup', 'التسجيل الجديد', 'إنشاء حسابات جديدة'],
  ['payments', 'المدفوعات', 'الاشتراك والدفع داخل المنصة']
];
const swLog = () => (D().switchLog = D().switchLog || {});

const STEPS = [
  ['تطلب التعديل', 'من Claude Code بكلامك'],
  ['يعدّل ويفحص', 'في فرع مستقل مع الفحوص الآلية'],
  ['تجرّب المعاينة', 'رابط خاص قبل أن يراه أحد'],
  ['تعتمد هنا', 'بكلمة المرور ورمز التحقق'],
  ['ينزل للطلاب', 'والرجوع بضغطة إن احتجت']
];

A.page('updates', {
  title:'التحديثات',
  sub:'اعتمد ما يصلك من تحسينات المنصة بعد أن تجرّبه، وارجع لأي إصدار سابق بضغطة.',
  render(el){
    const p = pending()[0], lv = live();
    const stage = p ? 3 : 5;   /* index of the current step (0-based); 5 = all done */
    el.innerHTML = String(h`<div class="stack">
      <section class="card up-how"><div class="card-h"><h2>كيف أنشر تحديثًا؟</h2></div>
        <div class="card-b"><ol class="up-steps">${STEPS.map(([t, s], i) => h`<li class="${i < stage ? 'done' : i === stage ? 'cur' : ''}"><span class="n">${i < stage ? I('check', 's16') : A.n(i + 1)}</span><b>${t}</b><small>${s}</small></li>`)}</ol>
        <p class="up-note">المحتوى (الأسئلة والدروس والأسعار) يُنشر من صفحته بزر «انشر»، بدون تحديث.</p></div></section>
      ${U.card({title:'بانتظار اعتمادك', cls:'up-pend', flush:true, body:p ? pendCard(p, lv) : h`<div class="card-b">${U.empty({icon:'rocket', title:'لا إصدار ينتظرك', text:h`يعمل الآن الإصدار ${lv ? ver(lv.version) : '—'}. عندما يجهّز Claude Code تحديثًا ويجتاز الفحوص يظهر هنا لتجرّبه وتعتمده.`})}</div>`})}
      <div class="grid2 up-grid">
        ${U.card({title:'السجل', flush:true, body:h`<div class="up-hist"></div>`})}
        ${U.card({title:'مفاتيح الإيقاف', cls:'up-sws', flush:true, body:switches()})}
      </div></div>`);
    U.table(el.querySelector('.up-hist'), {id:'releases', rows:() => R().filter(r => r.status !== 'pending'), pageSize:10, sort:{key:'at', dir:'desc'}, onRow:r => openRelease(r),
      columns:[
        {key:'version', label:'الإصدار', render:r => h`<b>${ver(r.version)}</b>`, width:'110px'},
        {key:'at', label:'التاريخ', render:r => h`<span class="nw">${A.date(r.liveAt || r.at)}</span>`, value:r => r.liveAt || r.at, width:'110px'},
        {key:'changes', label:'ما تغيّر', sort:false, render:r => h`<span class="up-ch">${r.changes[0]}${r.changes.length > 1 ? h`<small> و${A.n(r.changes.length - 1)} ${r.changes.length - 1 === 1 ? 'تغيير آخر' : 'تغييرات أخرى'}</small>` : ''}</span>`},
        {key:'status', label:'الحالة', sort:false, render:r => statusChip(r), width:'120px'},
        {key:'act', label:'', sort:false, width:'1%', render:r => r.status === 'old' && canRelease() ? U.btn({label:'ارجع لهذا الإصدار', icon:'undo', sm:true, tone:'ghost', attrs:h`data-rb="${r.id}"`}) : ''}],
      card:{title:r => h`الإصدار ${ver(r.version)}`, sub:r => A.date(r.liveAt || r.at) + ' · ' + r.changes[0], side:r => statusChip(r), skip:['version', 'at', 'changes', 'status']},
      empty:{icon:'rocket', title:'لا إصدارات سابقة', text:'كل إصدار تعتمده يبقى هنا لتعود إليه.'}}).draw();
    A.bind(el, {
      approve:() => approve(p), reject:() => reject(p),
      sw:b => toggle(b.dataset.k)
    });
    el.querySelector('.up-hist').addEventListener('click', e => { const b = e.target.closest('[data-rb]'); if (b) { e.stopPropagation(); rollback(R().find(r => r.id === b.dataset.rb)); } }, true);
  }
});

const statusChip = r => r.status === 'live' ? U.chip('يعمل الآن', 'ok') : r.status === 'rejected' ? U.chip('مرفوض', 'no') : r.status === 'pending' ? U.chip('بانتظارك', 'brand') : U.chip('سابق');

function pendCard(p, lv){
  return h`<div class="up-rel">
    <div class="up-rel-h"><div class="tt"><b>الإصدار ${ver(p.version)}</b><small>وصل ${A.ago(p.at)} من ${p.by}${lv ? h` · يحل محل ${ver(lv.version)}` : ''}</small></div>
      <span class="up-tests">${I('checkCircle', 's16')}<span>الفحوص: ${A.n(p.tests.passed)} من ${A.n(p.tests.total)}</span></span></div>
    <div class="up-rel-b">
      <div><h3>ما الذي تغيّر</h3><ul class="up-bul">${p.changes.map(c => h`<li>${c}</li>`)}</ul></div>
      <div class="up-side">
        <a class="up-prev" href="${p.preview}" target="_blank" rel="noopener">${I('external', 's16')}<span class="tt"><b>افتح رابط المعاينة</b><small>جرّبه بنفسك قبل الاعتماد</small></span></a>
        ${p.branch ? h`<p class="mut up-br">الفرع <bdi class="ltr">${p.branch}</bdi></p>` : ''}
      </div>
    </div>
    <div class="up-rel-f">${U.btn({label:'ارفض', icon:'x', tone:'ghost', a:'reject', disabled:!canRelease()})}${U.btn({label:'اعتمد وانشر', icon:'lock', tone:'primary', a:'approve', disabled:!canRelease(), title:canRelease() ? '' : 'تحتاج صلاحية اعتماد التحديثات'})}</div>
  </div>`;
}

function switches(){
  const L = swLog();
  return h`<ul class="up-swl">${SW.map(([k, l, sub]) => { const on = D().switches[k] !== false, lg = L[k];
    return h`<li class="${on ? '' : 'off'}"><span class="tt"><b>${l}</b><small>${on ? sub : h`موقوف ${lg ? A.ago(lg.at) : ''}${lg && lg.reason ? ' — ' + lg.reason : ''}`}</small></span>
      <button type="button" class="up-sw" role="switch" aria-checked="${on}" aria-label="${l}" data-a="sw" data-k="${k}"${A.can('updates.edit') ? '' : A.raw(' disabled')}><i></i></button></li>`; })}</ul>
    <p class="up-swn muted-note">${I('clock', 's16')}الإيقاف فوري بسبب مكتوب، والتشغيل من جديد يطلب تأكيد هويتك.</p>`;
}

/* ---------- actions ---------- */
function approve(p){
  if (!canRelease()) return U.toast('تحتاج صلاحية اعتماد التحديثات.', {tone:'no'});
  const lv = live();
  U.confirm({title:'اعتمد وانشر ' + p.version, text:'ينزل الإصدار لكل الطلاب خلال دقائق. تستطيع الرجوع للإصدار ' + (lv ? lv.version : 'السابق') + ' بضغطة من «السجل».',
    secure:'اعتماد ونشر تحديث', confirmLabel:'اعتمد وانشر', reason:'optional', reasonPh:'ملاحظة للسجل (اختياري)'}).then(v => {
    if (!v) return;
    if (lv) lv.status = 'old';
    Object.assign(p, {status:'live', approvedBy:A.me().name, liveAt:A.iso()});
    A.log({action:'release.approve', target:p.id, targetLabel:'الإصدار ' + p.version, summary:'اعتماد ونشر الإصدار ' + p.version, reason:v.reason, before:{الإصدار:lv ? lv.version : '—'}, after:{الإصدار:p.version}});
    A.changed(); U.toast('نُشر الإصدار ' + p.version + ' للطلاب.', {undo:() => { p.status = 'pending'; delete p.liveAt; if (lv) lv.status = 'live';
      A.log({action:'release.rollback', target:p.id, targetLabel:'الإصدار ' + p.version, summary:'تراجع فوري عن نشر ' + p.version, before:{الإصدار:p.version}, after:{الإصدار:lv ? lv.version : '—'}}); A.changed(); U.toast('رجعنا إلى ' + (lv ? lv.version : 'الإصدار السابق') + '.'); }});
  });
}
function reject(p){
  if (!canRelease()) return;
  U.confirm({title:'ارفض الإصدار ' + p.version, text:'لا ينزل للطلاب. يصل سبب الرفض إلى Claude Code ليعدّل ويرسل إصدارًا جديدًا.', tone:'danger', confirmLabel:'ارفض',
    reasonPh:'ماذا وجدت في المعاينة؟ مثال: التحدّي يغطي زر البدء على الجوال'}).then(v => {
    if (!v) return;
    Object.assign(p, {status:'rejected', rejectedBy:A.me().name, rejectedAt:A.iso(), rejectReason:v.reason});
    A.log({action:'release.reject', target:p.id, targetLabel:'الإصدار ' + p.version, summary:'رفض الإصدار ' + p.version, reason:v.reason, before:{الحالة:'بانتظار الاعتماد'}, after:{الحالة:'مرفوض'}});
    A.changed(); U.toast('رُفض الإصدار ' + p.version + ' وأُرسل السبب.');
  });
}
function rollback(r){
  if (!r || !canRelease()) return;
  const lv = live();
  U.confirm({title:'ارجع إلى الإصدار ' + r.version, text:'ينزل الإصدار ' + r.version + ' لكل الطلاب بدل ' + (lv ? lv.version : 'الحالي') + '. لا تتأثر بيانات الطلاب ولا المحتوى.', tone:'danger',
    secure:'الرجوع لإصدار سابق', confirmLabel:'ارجع لهذا الإصدار', reasonPh:'لماذا؟ مثال: خطأ في الدفع ظهر بعد النشر'}).then(v => {
    if (!v) return;
    if (lv) lv.status = 'old';
    Object.assign(r, {status:'live', liveAt:A.iso(), approvedBy:A.me().name});
    A.log({action:'release.rollback', target:r.id, targetLabel:'الإصدار ' + r.version, summary:'الرجوع إلى الإصدار ' + r.version, reason:v.reason, before:{الإصدار:lv ? lv.version : '—'}, after:{الإصدار:r.version}});
    A.changed(); U.toast('يعمل الآن الإصدار ' + r.version + '.');
  });
}
function toggle(k){
  if (!A.can('updates.edit')) return U.toast('لا تملك صلاحية تعديل التحديثات.', {tone:'no'});
  const [, l] = SW.find(x => x[0] === k), on = D().switches[k] !== false;
  if (on) {
    U.confirm({title:'أوقف ' + l + ' الآن', text:'يتوقف فورًا لكل الطلاب ويرون رسالة هادئة: «متوقف مؤقتًا للصيانة».', tone:'danger', confirmLabel:'أوقف الآن',
      reasonPh:'لماذا؟ مثال: إزعاج في الغرف الصوتية'}).then(v => {
      if (!v) return; D().switches[k] = false; swLog()[k] = {at:A.iso(), reason:v.reason, by:A.me().name};
      A.log({action:'switch.off', target:k, targetLabel:l, summary:'إيقاف ' + l, reason:v.reason, before:{الحالة:'يعمل'}, after:{الحالة:'موقوف'}});
      A.changed(); U.toast('أُوقف ' + l + '.');
    });
  } else {
    U.confirm({title:'شغّل ' + l + ' من جديد', text:'يعود متاحًا لكل الطلاب فورًا.', secure:'تشغيل ' + l, confirmLabel:'شغّل', reason:'optional'}).then(v => {
      if (!v) return; D().switches[k] = true; delete swLog()[k];
      A.log({action:'switch.on', target:k, targetLabel:l, summary:'تشغيل ' + l + ' من جديد', reason:v.reason, before:{الحالة:'موقوف'}, after:{الحالة:'يعمل'}});
      A.changed(); U.toast('عاد ' + l + ' يعمل.');
    });
  }
}
function openRelease(r){
  U.drawer({title:'الإصدار ' + r.version, sub:'',
    body:h`<div class="up-d">${statusChip(r)}
      ${U.kv([['التاريخ', A.date(r.liveAt || r.at, {year:true})], ['أعدّه', r.by], ['اعتمده', r.approvedBy || r.rejectedBy || '—'], ['الفحوص', h`${A.n(r.tests.passed)} من ${A.n(r.tests.total)} ${r.tests.passed === r.tests.total ? '✓' : ''}`],
        r.rejectReason ? ['سبب الرفض', r.rejectReason, true] : null])}
      <div><h3>ما الذي تغيّر</h3><ul class="up-bul">${r.changes.map(c => h`<li>${c}</li>`)}</ul></div></div>`,
    foot:r.status === 'old' && canRelease() ? U.btn({label:'ارجع لهذا الإصدار', icon:'undo', a:'rb'}) : '',
    bind:{rb:(l) => { l.close(); rollback(r); }}});
}
})();

</script>
<script>A.start();</script>
