    {key:'at', label:'آخر نشاط', render:x => h`<span class="nw">${A.ago(x.at)}</span>`},
    {key:'act', label:'', sort:false, width:'1%', render:x => x.current ? h`<span class="mut nw">هذه الجلسة</span>` : U.btn({label:'أنهِ الجلسة', sm:true, tone:'ghost', attrs:h`data-sid="${x.id}"`})}],
    card:{title:x => x.device, sub:x => x.place + ' · ' + A.ago(x.at), side:() => '', skip:['device', 'place', 'at']},
    empty:{icon:'lock', title:'لا جلسات أخرى', text:''}}).draw();
  A.bind(el, {
    pw:() => U.confirm({title:'غيّر كلمة المرور', text:'تُنهى جلساتك على الأجهزة الأخرى.', reason:false, secure:'تغيير كلمة المرور', confirmLabel:'غيّر',
      fields:[{name:'n1', type:'password', label:'كلمة المرور الجديدة', hint:'١٠ أحرف على الأقل.', auto:'new-password'}, {name:'n2', type:'password', label:'أعدها للتأكيد', auto:'new-password'}],
      validate:v => v.n1.length < 10 ? ['n1', '١٠ أحرف على الأقل.'] : v.n1 !== v.n2 ? ['n2', 'الكلمتان غير متطابقتين.'] : ''}).then(v => {
      if (!v) return; sec.pwChangedAt = A.iso(); const n = (me.sessions || []).filter(x => !x.current).length; me.sessions = (me.sessions || []).filter(x => x.current);
      A.log({action:'auth.password', target:me.id, targetLabel:me.name, summary:'تغيير كلمة المرور' + (n ? ' وإنهاء ' + (n === 1 ? 'جلسة أخرى' : n === 2 ? 'جلستين أخريين' : A.n(n) + ' جلسات أخرى') : '')});
      A.changed(); U.toast('تغيّرت كلمة المرور.'); }),
    backup:() => U.confirm({title:'أنشئ رموزًا احتياطية جديدة', text:'تتوقف الرموز القديمة فورًا. احفظ الجديدة في مكان آمن.', reason:false, secure:'رموز احتياطية جديدة', confirmLabel:'أنشئ'}).then(v => {
      if (!v) return; sec.backupLeft = 8;
      const codes = Array.from({length:8}, () => String(Math.floor(1e7 + Math.random() * 9e7)).replace(/(\d{4})(\d{4})/, '$1-$2'));
      A.log({action:'auth.backup', target:me.id, targetLabel:me.name, summary:'إنشاء رموز احتياطية جديدة'}); A.changed();
      U.modal({title:'رموزك الاحتياطية', text:'كل رمز يُستخدم مرة واحدة إن فقدت جوالك. لن تظهر مرة أخرى.', body:h`<ol class="st-codes">${codes.map(c => h`<li>${A.id(c)}</li>`)}</ol>`,
        foot:h`<span class="sp"></span>${U.btn({label:'حفظتها', tone:'primary', a:'ok'})}`, bind:{ok:l => l.close()}}); }),
    req:() => { const on = !sec.require2FA;
      U.confirm(on ? {title:'اطلب التحقق الثنائي من كل الموظفين', text:'من لم يفعّله يُطلب منه تفعيله عند دخوله القادم قبل أن يرى أي صفحة.', confirmLabel:'فعّل الشرط', reason:'optional'}
        : {title:'ألغِ شرط التحقق الثنائي', text:'يستطيع الموظفون الدخول بكلمة المرور وحدها. لا يُنصح بذلك.', tone:'danger', secure:'إلغاء شرط التحقق الثنائي', confirmLabel:'ألغِ الشرط'}).then(v => {
        if (!v) return; sec.require2FA = on;
        A.log({action:'settings.security', summary:(on ? 'فرض' : 'إلغاء فرض') + ' التحقق الثنائي على كل الموظفين', reason:v.reason, before:{الشرط:on ? 'مغلق' : 'مفعّل'}, after:{الشرط:on ? 'مفعّل' : 'مغلق'}});
        A.changed(); U.toast(on ? 'صار التحقق الثنائي إلزاميًا للموظفين.' : 'أُلغي الشرط.'); }); }
  });
  el.querySelector('.st-sess').addEventListener('click', e => { const b = e.target.closest('[data-sid]'); if (!b) return; const x = (me.sessions || []).find(y => y.id === b.dataset.sid); if (!x) return;
    U.confirm({title:'أنهِ هذه الجلسة', text:x.device + ' · ' + x.place, confirmLabel:'أنهِ الجلسة', reason:'optional'}).then(v => {
      if (!v) return; me.sessions = me.sessions.filter(y => y !== x);
      A.log({action:'auth.session.end', target:me.id, targetLabel:me.name, summary:'إنهاء جلسة على ' + x.device, reason:v.reason}); A.changed(); U.toast('أُنهيت الجلسة.'); }); });
}

/* --- السجل --- */
const CATS = [['member', 'المشتركون'], ['payment', 'المدفوعات'], ['sub', 'الاشتراكات'], ['store', 'المتجر'], ['report', 'البلاغات'], ['content', 'المحتوى'],
  ['notify', 'الإشعارات'], ['staff', 'الموظفون'], ['release', 'التحديثات'], ['settings', 'الإعدادات'], ['auth', 'الأمان'], ['export', 'التصدير'], ['other', 'أخرى']];
const catOf = a => { a = a || '';
  if (/export/.test(a)) return 'export';
  const p = a.split('.')[0];
  if (p === 'notify' || a === 'member.notify') return 'notify';
  if (p === 'member') return 'member'; if (p === 'coupon') return 'sub'; if (p === 'payment' || p === 'payments') return 'payment';
  if (/^(sub|subs|subscription|plan|plans|price|addon)/.test(p)) return 'sub'; if (/^(store|coins|item|coin)/.test(p)) return 'store';
  if (p === 'report') return 'report'; if (/^(batch|question|bank|figure|course|lesson|unit|book|daily|plan56|tree)/.test(p)) return 'content';
  if (p === 'staff') return 'staff'; if (p === 'release' || p === 'switch') return 'release'; if (p === 'settings') return 'settings'; if (p === 'auth') return 'auth';
  return 'other'; };
const PERIOD = {d1:1, d7:7, d30:30};
const actN = n => n === 1 ? 'إجراء واحد' : n === 2 ? 'إجراءان' : A.n(n) + (n <= 10 ? ' إجراءات' : ' إجراءً');
/* before → after: base formats every value with Arabic-Indic digits */
const fmtV = A.baVal;
const baText = U.auditBA;
function logRows(st){
  const qn = A.norm(st.s), now = A.now();
  return D().audit.filter(e => {
    if (st.who && e.actor !== st.who) return false;
    if (st.kind && catOf(e.action) !== st.kind) return false;
    if (st.when && now - Date.parse(e.at) > PERIOD[st.when] * 864e5) return false;
    return !qn || A.norm([e.summary, e.targetLabel, e.actorName, e.reason, e.target, baText(e)].join(' ')).includes(qn);
  });
}
const targetCell = e => { if (!e.targetLabel) return h`<span class="mut">—</span>`;
  if (/^M-\d+/.test(e.target || '')) return h`<a href="${A.href('member', {id:e.target})}">${e.targetLabel}</a>`;
  if (/^ST-\d+/.test(e.target || '')) return h`<a href="${A.href('staffer', {id:e.target})}">${e.targetLabel}</a>`;
  return e.targetLabel; };
function log(el){
  el.innerHTML = '<section class="card st-log"><div class="st-tb"></div><div class="st-tbl"></div></section>';
  const actors = [...new Map(D().audit.map(e => [e.actor, e.actorName])).entries()].filter(([k]) => k);
  const kinds = CATS.filter(([k]) => D().audit.some(e => catOf(e.action) === k));
  let tbl;
  const tb = U.toolbar(el.querySelector('.st-tb'), {id:'audit', unit:'إجراء', search:'ابحث في السجل: اسم، إجراء، سبب',
    selects:[{key:'who', label:'من', options:actors.map(([v, l]) => ({v, label:l}))}, {key:'kind', label:'النوع', options:kinds.map(([v, label]) => ({v, label}))},
      {key:'when', label:'المدة', options:[{v:'d1', label:'آخر ٢٤ ساعة'}, {v:'d7', label:'آخر ٧ أيام'}, {v:'d30', label:'آخر ٣٠ يومًا'}]}],
    onChange:() => { tbl.reset(); draw(); }});
  tbl = U.table(el.querySelector('.st-tbl'), {id:'audit', rows:() => logRows(tb.state), sort:{key:'at', dir:'desc'}, pageSize:25, onRow:e => openEntry(e), columns:[
    {key:'at', label:'الوقت', render:e => h`<span class="nw">${A.when(e.at)}</span>`, width:'150px'},
    {key:'actorName', label:'من', render:e => h`<span class="nw">${e.actorName}</span>`, width:'130px'},
    {key:'summary', label:'ماذا', render:e => h`<span class="st-cut st-what">${e.summary}</span>`},
    {key:'targetLabel', label:'الهدف', render:e => h`<span class="st-cut st-tg">${targetCell(e)}</span>`, width:'150px'},
    {key:'ba', label:'قبل ← بعد', sort:false, render:e => { const t = baText(e); return t ? h`<span class="st-cut st-ba">${t}</span>` : h`<span class="mut">—</span>`; }, width:'220px'},
    {key:'reason', label:'السبب', sort:false, render:e => e.reason ? h`<span class="st-cut st-why">${e.reason}</span>` : h`<span class="mut">—</span>`, width:'190px'}],
    card:{title:e => e.summary, sub:e => e.actorName + ' · ' + A.when(e.at), side:() => '', skip:['at', 'actorName', 'summary', 'ba']},
    empty:{icon:'file', title:'لا شيء في السجل بهذا البحث', text:'غيّر البحث أو امسح الفلاتر.'}});
  const draw = () => { tbl.draw(); tb.count(logRows(tb.state).length, D().audit.length); };
  draw();
}
function openEntry(e){
  const ba = e.before || e.after ? [...new Set(Object.keys(e.before || {}).concat(Object.keys(e.after || {})))] : [];
  U.drawer({title:e.summary, sub:'',
    body:h`<div class="st-d">${U.kv([['من', e.actorName + (e.viewAs ? ' (معاينة بصلاحيات ' + e.viewAs + ')' : '')], ['الوقت', A.date(e.at, {weekday:true, year:true}) + '، ' + A.time(e.at)],
      ['الهدف', e.targetLabel ? targetCell(e) : '—'], ['النوع', (CATS.find(c => c[0] === catOf(e.action)) || [, 'أخرى'])[1]], ['السبب', e.reason || '—', true], ['المعرّف', A.id(e.id + ' · ' + e.action), true]])}
      ${ba.length ? h`<div><h3>قبل ← بعد</h3><table class="st-ba-t"><thead><tr><th></th><th>قبل</th><th>بعد</th></tr></thead><tbody>${ba.map(k => h`<tr><th scope="row">${k}</th><td>${fmtV((e.before || {})[k])}</td><td>${fmtV((e.after || {})[k])}</td></tr>`)}</tbody></table></div>` : ''}</div>`});
}
function exportLog(){
  if (!A.can('export')) return U.toast('لا تملك صلاحية تصدير البيانات.', {tone:'no'});
  const rows = logRows(Object.assign({s:'', who:'', kind:'', when:''}, A.mem('tb:audit')));
  U.confirm({title:'صدّر السجل', text:'ملف CSV فيه ' + actN(rows.length) + (rows.length === D().audit.length ? '' : ' (حسب الفلاتر الحالية)') + '.', secure:'تصدير السجل', confirmLabel:'صدّر الملف', reasonPh:'لماذا تحتاج هذا الملف؟'}).then(v => {
    if (!v) return;
    const q = x => '"' + String(x === null || x === undefined ? '' : x).replace(/"/g, '""') + '"';
    const lines = [['الوقت', 'من', 'الإجراء', 'الملخص', 'الهدف', 'قبل ← بعد', 'السبب'].map(q).join(',')].concat(rows.map(e => [e.at, e.actorName, e.action, e.summary, e.targetLabel || '', U.auditBA(e), e.reason || ''].map(q).join(',')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'alfitn-audit-' + A.iso().slice(0, 10) + '.csv'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    A.log({action:'audit.export', summary:'تصدير السجل: ' + actN(rows.length) + ' (CSV)', reason:v.reason});
    A.changed(); U.toast('نُزّل الملف وسُجّل التصدير.');
  });
}
})();

</script>
<script data-part="page-staff.js">
/* الموظفون — staff table (#/staff) and a staff profile (#/staffer?id=ST-2).
   Permissions are plain toggles the owner switches freely: per menu section «عرض / تعديل» (عرض = <section>.view; تعديل grants
   <section>.full = every edit in that section, an existing <section>.edit is kept as is) + «صلاحيات حساسة»
   (gift, ban, refund, prices, release, export, staff — separate keys checked with A.can('<key>')).
   Saving = reason + step-up (A.secure) + audit entry with the full permission list before → after. The owner account is locked.
   «اعرض اللوحة بصلاحياته» = A.viewAs(id) in base (menu, top bar and buttons follow that person; a quiet bottom pill brings the owner
   back; anything done meanwhile is logged under the owner's name as a preview). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const S = () => D().staff;
const staffOf = id => S().find(s => s.id === id);

/* ---------- permission catalogue ---------- */
/* permissions are per PAGE (members.view, reports.edit …), grouped under the menu headings; old section keys (students.edit) still count */
const GROUPS = A.NAV.filter(s => s.label).map(s => ({key:s.key, label:s.label, pages:s.items.map(([id, t]) => ({id, label:t}))}));
const PAGES = GROUPS.flatMap(g => g.pages);
const SENS = [
  ['gift', 'الإهداء', 'باقات وعناصر وعملات للمشتركين'],
  ['ban', 'الحظر والتقييد', 'حظر المشتركين وتقييد اللوبي والصوت والألعاب والمتجر'],
  ['refund', 'الاسترداد', 'إرجاع مبالغ المدفوعات'],
  ['prices', 'تعديل الأسعار', 'أسعار الباقات والإضافات وباقات العملات'],
  ['release', 'اعتماد التحديثات', 'نشر الإصدارات للطلاب والرجوع عنها'],
  ['export', 'تصدير البيانات', 'تنزيل ملفات المشتركين والمدفوعات والسجل'],
  ['staff', 'إدارة الموظفين', 'دعوة الموظفين وتعديل صلاحياتهم وإيقافهم']
];
const SENS_KEYS = SENS.map(x => x[0]);
const LV = ['view', 'edit', 'full'];
const levelOf = (perms, id) => A.pageLevel(perms, id);
/* page keys only (section keys expanded), highest level per page, sensitive keys kept */
const norm = perms => PAGES.map(pg => levelOf(perms, pg.id) === 'none' ? null : pg.id + '.' + levelOf(perms, pg.id)).filter(Boolean).concat(perms.filter(k => SENS_KEYS.includes(k)));
const setLevel = (perms, id, lv) => norm(perms).filter(p => !p.startsWith(id + '.')).concat(lv === 'none' ? [] : [id + '.' + lv]);
const lvLabel = lv => lv === 'view' ? 'عرض' : lv === 'none' ? '' : 'عرض وتعديل';
const permList = perms => { const out = [];
  PAGES.forEach(s => { const lv = levelOf(perms, s.id); if (lv !== 'none') out.push(s.label + ' (' + lvLabel(lv) + ')'); });
  SENS.forEach(([k, l]) => { if (perms.includes(k)) out.push(l); });
  return out; };
const permText = perms => { const l = permList(perms); return l.length ? l.join('، ') : 'لا شيء'; };
const permSummary = s => { if (s.owner) return 'كل الصلاحيات';
  const secs = PAGES.filter(x => levelOf(s.perms, x.id) !== 'none').length, sens = SENS_KEYS.filter(k => s.perms.includes(k)).length;
  if (!secs && !sens) return 'بلا صلاحيات';
  return (secs ? (secs === 1 ? 'صفحة واحدة' : secs === 2 ? 'صفحتان' : A.n(secs) + (secs <= 10 ? ' صفحات' : ' صفحة')) : '') + (secs && sens ? ' · ' : '') + (sens ? A.n(sens) + ' حساسة' : ''); };
const ST = {active:['نشط', 'ok'], invited:['مدعو', 'info'], disabled:['موقوف', 'no']};
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const canManage = () => A.can('staff');
const sessN = n => n === 1 ? 'جلسة واحدة' : n === 2 ? 'جلستين' : A.n(n) + (n <= 10 ? ' جلسات' : ' جلسة');
const editable = s => canManage() && !s.owner && s.id !== A.me().id;

/* ---------- «view as» (base: A.viewAs) ---------- */
function startViewAs(s){
  if (!A.viewAs(s.id)) return;
  A.go('home');
  U.toast('تشاهد اللوحة كما يراها ' + s.name + '. ارجع لحسابك من الشريط السفلي.');
}

/* ---------- list ---------- */
const COLS = [
  {key:'name', label:'الاسم', render:s => h`<span class="nm"><b>${s.name}</b><small>${s.owner ? 'المالك' : s.role || '—'}</small></span>`, value:s => s.name},
  {key:'email', label:'البريد', render:s => h`<bdi class="ltr">${s.email}</bdi>`},
  {key:'lastSignIn', label:'آخر دخول', render:s => h`<span class="nw">${s.lastSignIn ? A.ago(s.lastSignIn) : 'لم يدخل بعد'}</span>`, value:s => s.lastSignIn || ''},
  {key:'twoFA', label:'التحقق الثنائي', render:s => s.twoFA ? h`<span class="sf-ok">${I('check', 's16')}<span>مفعّل</span></span>` : s.status === 'invited' ? h`<span class="mut">بعد القبول</span>` : U.chip('غير مفعّل', 'warn'), value:s => s.twoFA ? 1 : 0},
  {key:'perms', label:'الصلاحيات', render:s => h`<span class="nw">${permSummary(s)}</span>`, sort:false},
  {key:'status', label:'الحالة', render:s => U.chip(ST[s.status][0], ST[s.status][1]), value:s => ['active', 'invited', 'disabled'].indexOf(s.status)}
];
A.page('staff', {
  title:'الموظفون',
  sub:'من يعمل معك في اللوحة، وما يستطيع كل واحد أن يراه أو يعدّله.',
  primary:() => ({label:'أضف موظفًا', icon:'plus', disabled:!canManage(), run:() => invite()}),
  render(el){
    el.innerHTML = '<section class="card sf-list"><div class="sf-tbl"></div></section>';
    U.table(el.querySelector('.sf-tbl'), {id:'staff', columns:COLS, rows:() => S().slice().sort((a, b) => (b.owner ? 1 : 0) - (a.owner ? 1 : 0) || ['active', 'invited', 'disabled'].indexOf(a.status) - ['active', 'invited', 'disabled'].indexOf(b.status) || a.name.localeCompare(b.name, 'ar')), rowHref:s => A.href('staffer', {id:s.id}),
      card:{title:s => s.name, sub:s => s.owner ? 'المالك' : s.role || '', side:s => U.chip(ST[s.status][0], ST[s.status][1]), skip:['name', 'status', 'email']},
      empty:{icon:'shield', title:'لا موظفين بعد', text:'أضف أول موظف وحدّد ما يستطيع فعله.'}}).draw();
  }
});
A.searchProvider({id:'staff', label:'الموظفون', icon:'shield', max:3, find:qn => A.can('staff.view') ? S().filter(s => A.norm(s.name + ' ' + s.email + ' ' + (s.role || '')).includes(qn)).map(s => ({title:s.name, sub:(s.owner ? 'المالك' : s.role || '') + ' · ' + s.email, href:A.href('staffer', {id:s.id}), icon:'shield'})) : []});

function invite(){
  if (!canManage()) return U.toast('تحتاج صلاحية إدارة الموظفين.', {tone:'no'});
  U.confirm({title:'أضف موظفًا', text:'تصله دعوة على بريده ليضع كلمة مروره ويفعّل التحقق الثنائي. الدعوة صالحة ٧٢ ساعة.', reason:false, secure:'دعوة موظف', confirmLabel:'أرسل الدعوة',
    fields:[{name:'name', label:'الاسم', placeholder:'الاسم الكامل', required:true}, {name:'email', type:'email', label:'البريد', placeholder:'name@alfitn.example', required:true},
      {name:'role', label:'الدور (اختياري)', placeholder:'مثال: الدعم، محرر محتوى'},
      {name:'copy', type:'select', label:'ابدأ بصلاحيات', value:'', options:[{v:'', label:'بلا صلاحيات — أحددها بعد الإضافة'}].concat(S().filter(s => !s.owner && s.status !== 'disabled').map(s => ({v:s.id, label:'مثل ' + s.name + (s.role ? ' (' + s.role + ')' : '')})))}],
    validate:v => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email) ? ['email', 'اكتب بريدًا صحيحًا.'] : S().some(s => s.email.toLowerCase() === v.email.toLowerCase()) ? ['email', 'هذا البريد مضاف من قبل.'] : ''}).then(v => {
    if (!v) return;
    const src = staffOf(v.copy), n = Math.max(...S().map(s => +s.id.split('-')[1])) + 1;
    const s = {id:'ST-' + n, name:v.name, email:v.email, role:v.role || '', perms:src ? src.perms.slice() : [], twoFA:false, status:'invited', lastSignIn:null, createdAt:A.iso(), invitedAt:A.iso(), sessions:[]};
    S().push(s);
    A.log({action:'staff.invite', target:s.id, targetLabel:s.name, summary:'دعوة ' + s.name + ' (' + s.email + ')' + (src ? ' بصلاحيات مثل ' + src.name : ''), after:{الصلاحيات:permText(s.perms)}});
    A.go('staffer', {id:s.id}); A.changed(); U.toast('أُرسلت الدعوة إلى ' + s.email + '.');
  });
}

/* ---------- profile ---------- */
const drafts = {};
const TABS = [{id:'perms', label:'الصلاحيات'}, {id:'sessions', label:'الجلسات'}, {id:'log', label:'السجل'}];
A.page('staffer', {
  nav:'staff', bare:true,
  title:q => (staffOf(q.id) || {}).name || 'موظف',
  crumb:q => (staffOf(q.id) || {}).name || 'غير موجود',
  render(el, q){
    const s = staffOf(q.id);
    if (!s) { el.innerHTML = String(h`<a class="back" href="${A.href('staff')}">${I('chev')}الموظفون</a>${U.card({body:U.empty({icon:'shield', title:'لم نجد هذا الموظف', text:'ربما أُلغيت دعوته أو تغيّر الرابط.', action:h`<a class="btn secondary" href="${A.href('staff')}">كل الموظفين</a>`})})}`); return; }
    const tab = TABS.find(t => t.id === q.tab) ? q.tab : 'perms';
    const me = A.me();
    el.innerHTML = String(h`<a class="back" href="${A.href('staff')}">${I('chev')}الموظفون</a>
      <header class="sf-head">${U.avatar(s.name, 'lg')}
        <div class="sf-id"><h1>${s.name}</h1>
          <div class="sf-meta"><bdi class="ltr">${s.email}</bdi><span class="sep"></span>${s.owner ? U.chip('المالك', 'brand') : s.role ? U.chip(s.role, 'line') : ''}${U.chip(ST[s.status][0], ST[s.status][1])}
            ${s.status !== 'invited' ? (s.twoFA ? U.chip('التحقق الثنائي مفعّل', 'ok') : U.chip('التحقق الثنائي غير مفعّل', 'warn')) : h`<span class="mut">دُعي ${A.ago(s.invitedAt || s.createdAt)}</span>`}</div></div>
        <div class="sf-acts">
          ${!s.owner && me.owner && s.status === 'active' ? U.btn({label:'اعرض اللوحة بصلاحياته', icon:'eye', a:'viewas'}) : ''}
          ${editable(s) ? U.btn({icon:'more', a:'more', aria:'إجراءات أخرى', attrs:'aria-haspopup="menu"'}) : ''}
        </div></header>
      ${s.owner ? h`<p class="sf-lock">${I('lock', 's16')}<span>حساب المالك مقفل: كل الصلاحيات مفتوحة له دائمًا، ولا يستطيع أي موظف تعديله أو إيقافه.</span></p>`
        : s.id === me.id ? h`<p class="sf-lock">${I('lock', 's16')}<span>هذا حسابك: لا تستطيع تعديل صلاحياتك بنفسك.</span></p>` : ''}
      <nav class="pg-tabs sf-tabs" role="tablist" aria-label="ملف الموظف">${TABS.map(t => h`<a class="pg-tab" role="tab" href="${A.href('staffer', {id:s.id, tab:t.id === 'perms' ? undefined : t.id})}" aria-selected="${t.id === tab}">${t.label}${t.id === 'sessions' ? h`<span class="ct">${A.n(s.sessions.length)}</span>` : ''}</a>`)}</nav>
      <div class="sf-body"></div>`);
    ({perms, sessions, log})[tab](el.querySelector('.sf-body'), s);
    A.bind(el.querySelector('.sf-head'), {
      viewas:() => startViewAs(s),
      more:b => U.menu(b, [
        {label:'انسخ صلاحيات من…', sub:'تُنسخ للمسودة لتراجعها ثم تحفظ', icon:'repeat', run:() => copyFrom(s, el)},
        {label:'عدّل الاسم والدور', icon:'edit', run:() => editInfo(s)},
        s.status === 'invited' ? {label:'أعد إرسال الدعوة', icon:'mail', run:() => resend(s)} : {label:'أنهِ كل الجلسات', sub:'يُطلب منه تسجيل الدخول من جديد', icon:'logout', run:() => endAll(s), disabled:!s.sessions.length},
        '-',
        s.status === 'invited' ? {label:'ألغِ الدعوة', icon:'trash', tone:'danger', run:() => cancelInvite(s)}
          : s.status === 'disabled' ? {label:'أعد تفعيل الحساب', icon:'undo', run:() => reactivate(s)} : {label:'أوقف الحساب', sub:'لا يستطيع الدخول، وتبقى بياناته وسجله', icon:'ban', tone:'danger', run:() => deactivate(s)}
      ], {head:{title:s.name, sub:s.email}})
    });
  }
});

/* --- tab: الصلاحيات --- */
function perms(el, s){
  const ed = editable(s);
  const cur = () => s.owner ? ['content.full', 'sales.full', 'students.full', 'admin.full'].concat(SENS_KEYS) : (drafts[s.id] || s.perms);
  const draw = () => {
    const p = cur(), dirty = !!drafts[s.id] && !sameSet(drafts[s.id], s.perms);
    const dis = ed ? '' : A.raw(' disabled');
    el.innerHTML = String(h`<div class="grid2 even sf-grid">
      <section class="card"><div class="card-h"><h2>الصفحات</h2></div>
        <div class="sf-ph"><span>الصفحة</span><span>عرض</span><span>تعديل</span></div>
        <ul class="sf-perms">${GROUPS.map(g => h`<li class="sf-gh" aria-hidden="true">${g.label}</li>${g.pages.map(x => { const lv = levelOf(p, x.id);
          return h`<li><span class="tt"><b>${x.label}</b></span>
            <label class="sw"><input type="checkbox" data-pg="${x.id}" data-lv="view"${lv !== 'none' ? A.raw(' checked') : ''}${dis}><i></i><span class="sr">${x.label}: عرض</span></label>
            <label class="sw"><input type="checkbox" data-pg="${x.id}" data-lv="edit"${lv === 'edit' || lv === 'full' ? A.raw(' checked') : ''}${dis}><i></i><span class="sr">${x.label}: تعديل</span></label></li>`; })}`)}</ul>
        <p class="sf-foot muted-note">«تعديل» يشمل العرض. ما لا يُفتح له لا يظهر في قائمته. الرئيسية متاحة للجميع.</p></section>
      <section class="card"><div class="card-h"><h2>صلاحيات حساسة</h2></div>
        <ul class="sf-perms sens">${SENS.map(([k, l, sub]) => h`<li><span class="tt"><b>${l}</b><small>${sub}</small></span>
          <label class="sw"><input type="checkbox" data-sens="${k}"${p.includes(k) ? A.raw(' checked') : ''}${dis}><i></i><span class="sr">${l}</span></label></li>`)}</ul>
        <p class="sf-foot muted-note">${I('lock', 's16')}كل إجراء حساس يطلب كلمة المرور ورمز التحقق، ويُسجَّل باسم من فعله.</p></section>
    </div>
    ${dirty ? h`<div class="sf-save" role="region" aria-label="تغييرات غير محفوظة"><span class="tt"><b>${A.n(diff(s.perms, p).length)} ${diff(s.perms, p).length === 1 ? 'تغيير' : 'تغييرات'} لم تُحفظ</b><small>${diff(s.perms, p).map(d => (d.on ? 'فتح ' : 'إغلاق ') + d.label).join('، ')}</small></span>
      ${U.btn({label:'تراجع', tone:'ghost', a:'discard'})}${U.btn({label:'احفظ الصلاحيات', icon:'lock', tone:'primary', a:'save'})}</div>` : ''}`);
  };
  draw();
  el.onchange = e => { const x = e.target; if (!ed || x.type !== 'checkbox') return;
    let p = (drafts[s.id] || s.perms).slice();
    if (x.dataset.sens) p = x.checked ? p.concat(x.dataset.sens) : p.filter(k => k !== x.dataset.sens);
    else { const pg = x.dataset.pg, lv = levelOf(p, pg), orig = levelOf(s.perms, pg);
      const nl = x.dataset.lv === 'view' ? (x.checked ? 'view' : 'none') : (x.checked ? (orig === 'edit' ? 'edit' : 'full') : (lv === 'none' ? 'none' : 'view'));
      p = setLevel(p, pg, nl); }
    drafts[s.id] = p; const y = window.scrollY; draw(); window.scrollTo(0, y);
    const f = el.querySelector(x.dataset.sens ? `[data-sens="${x.dataset.sens}"]` : `[data-pg="${x.dataset.pg}"][data-lv="${x.dataset.lv}"]`); if (f) f.focus(); };
  el.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'discard') { delete drafts[s.id]; draw(); }
    if (b.dataset.a === 'save') save(s); };
}
function diff(a, b){ const out = [];
  PAGES.forEach(x => { const la = levelOf(a, x.id), lb = levelOf(b, x.id); if (la === lb || (la === 'full' && lb === 'edit') || (la === 'edit' && lb === 'full')) return;
    const rank = l => l === 'none' ? 0 : l === 'view' ? 1 : 2;
    out.push({on:rank(lb) > rank(la), label:x.label + ': ' + (rank(lb) > rank(la) ? (lb === 'view' ? 'العرض' : 'التعديل') : (lb === 'none' ? 'العرض' : 'التعديل'))}); });
  SENS.forEach(([k, l]) => { if (a.includes(k) !== b.includes(k)) out.push({on:b.includes(k), label:l}); });
  return out; }
function save(s){
  const p = drafts[s.id]; if (!p || !editable(s)) return;
  const d = diff(s.perms, p);
  U.confirm({title:'احفظ صلاحيات ' + s.name, text:'تُطبَّق فورًا على جلساته المفتوحة.', secure:'تعديل صلاحيات موظف', confirmLabel:'احفظ',
    body:h`<ul class="sf-diff">${d.map(x => h`<li class="${x.on ? 'on' : 'off'}">${I(x.on ? 'check' : 'x', 's16')}<span>${x.on ? 'فتح' : 'إغلاق'} ${x.label}</span></li>`)}</ul>`,
    reasonPh:'لماذا؟ مثال: تحتاج الإهداء لتعويض المشتركين'}).then(v => {
    if (!v) return; const before = s.perms.slice();
    s.perms = p.slice(); delete drafts[s.id];
    A.log({action:'staff.perms', target:s.id, targetLabel:s.name, summary:'تعديل صلاحيات ' + s.name + ': ' + d.map(x => (x.on ? 'فتح ' : 'إغلاق ') + x.label).join('، '), reason:v.reason,
      before:{الصلاحيات:permText(before)}, after:{الصلاحيات:permText(s.perms)}});
    A.changed(); U.toast('حُفظت صلاحيات ' + s.name + '.', {undo:() => { const now = s.perms.slice(); s.perms = before;
      A.log({action:'staff.perms', target:s.id, targetLabel:s.name, summary:'تراجع عن تعديل صلاحيات ' + s.name, before:{الصلاحيات:permText(now)}, after:{الصلاحيات:permText(before)}}); A.changed(); U.toast('عادت الصلاحيات كما كانت.'); }});
  });
}
function copyFrom(s, root){
  const others = S().filter(x => x.id !== s.id && !x.owner);
  U.confirm({title:'انسخ صلاحيات من…', text:'تحل محل صلاحيات ' + s.name + ' في المسودة فقط. راجعها ثم اضغط «احفظ الصلاحيات».', reason:false, confirmLabel:'انسخ',
    fields:[{name:'from', type:'opts', label:'من', value:others[0] && others[0].id, options:others.map(x => ({v:x.id, label:x.name, sub:permSummary(x) + (x.role ? ' · ' + x.role : '')}))}]}).then(v => {
    if (!v || !v.from) return; const src = staffOf(v.from);
    drafts[s.id] = src.perms.slice();
    if (A.cur.id === 'staffer' && (A.cur.q.tab || 'perms') === 'perms') A.changed(); else A.go('staffer', {id:s.id});
    U.toast('نُسخت صلاحيات ' + src.name + ' — راجعها ثم احفظ.');
  });
}
function editInfo(s){
  U.confirm({title:'عدّل بيانات ' + s.name, reason:false, confirmLabel:'احفظ', fields:[{name:'name', label:'الاسم', value:s.name, required:true}, {name:'role', label:'الدور', value:s.role || ''}]}).then(v => {
    if (!v) return; const before = {الاسم:s.name, الدور:s.role || '—'}; s.name = v.name; s.role = v.role;
    A.log({action:'staff.edit', target:s.id, targetLabel:s.name, summary:'تعديل بيانات ' + s.name, before, after:{الاسم:s.name, الدور:s.role || '—'}});
    A.changed(); U.toast('حُفظت البيانات.');
  });
}
function resend(s){ s.invitedAt = A.iso(); A.log({action:'staff.invite', target:s.id, targetLabel:s.name, summary:'إعادة إرسال الدعوة إلى ' + s.email}); A.changed(); U.toast('أُعيد إرسال الدعوة إلى ' + s.email + '.'); }
function cancelInvite(s){
  U.confirm({title:'ألغِ دعوة ' + s.name, text:'يتوقف رابط الدعوة فورًا.', tone:'danger', confirmLabel:'ألغِ الدعوة', reason:'optional'}).then(v => {
    if (!v) return; S().splice(S().indexOf(s), 1);
    A.log({action:'staff.uninvite', target:s.id, targetLabel:s.name, summary:'إلغاء دعوة ' + s.name + ' (' + s.email + ')', reason:v.reason});
    A.go('staff'); U.toast('أُلغيت الدعوة.');
  });
}
function deactivate(s){
  U.confirm({title:'أوقف حساب ' + s.name, text:'لا يستطيع الدخول، وتُنهى جلساته المفتوحة الآن. تبقى صلاحياته محفوظة وسجله كما هو، ويمكنك إعادة تفعيله.', tone:'danger', secure:'إيقاف حساب موظف', confirmLabel:'أوقف الحساب'}).then(v => {
    if (!v) return; const n = s.sessions.length; s.status = 'disabled'; s.sessions = [];
    A.log({action:'staff.disable', target:s.id, targetLabel:s.name, summary:'إيقاف حساب ' + s.name + (n ? ' وإنهاء ' + sessN(n) : ''), reason:v.reason, before:{الحالة:'نشط'}, after:{الحالة:'موقوف'}});
    A.changed(); U.toast('أُوقف حساب ' + s.name + '.');
  });
}
function reactivate(s){
  U.confirm({title:'أعد تفعيل ' + s.name, text:'يستطيع الدخول بصلاحياته المحفوظة: ' + permText(s.perms) + '.', secure:'تفعيل حساب موظف', confirmLabel:'فعّل الحساب'}).then(v => {
    if (!v) return; s.status = 'active';
    A.log({action:'staff.enable', target:s.id, targetLabel:s.name, summary:'إعادة تفعيل حساب ' + s.name, reason:v.reason, before:{الحالة:'موقوف'}, after:{الحالة:'نشط'}});
    A.changed(); U.toast('عاد حساب ' + s.name + ' فعّالًا.');
  });
}
function endAll(s){
  U.confirm({title:'أنهِ كل جلسات ' + s.name, text:'يُطلب منه تسجيل الدخول من جديد على كل أجهزته.', confirmLabel:'أنهِ الجلسات', reason:'optional'}).then(v => {
    if (!v) return; const n = s.sessions.filter(x => !(x.current && s.id === A.me().id)).length; s.sessions = s.sessions.filter(x => x.current && s.id === A.me().id);
    A.log({action:'staff.session.end', target:s.id, targetLabel:s.name, summary:'إنهاء ' + sessN(n) + ' لـ' + s.name, reason:v.reason});
    A.changed(); U.toast('أُنهيت الجلسات.');
  });
}

/* --- tab: الجلسات --- */
function endOne(s, x){
  U.confirm({title:'أنهِ هذه الجلسة', text:x.device + ' · ' + x.place + ' — يُطلب منه الدخول من جديد على هذا الجهاز.', confirmLabel:'أنهِ الجلسة', reason:'optional'}).then(v => {
    if (!v) return; s.sessions = s.sessions.filter(y => y !== x);
    A.log({action:'staff.session.end', target:s.id, targetLabel:s.name, summary:'إنهاء جلسة ' + s.name + ' على ' + x.device, reason:v.reason});
    A.changed(); U.toast('أُنهيت الجلسة.');
  });
}
function sessions(el, s){
  el.innerHTML = String(U.card({title:'الأجهزة المسجّل منها الآن', flush:true, body:h`<div class="sf-t1"></div>`}));
  const mine = s.id === A.me().id, can = canManage() || mine;
  U.table(el.querySelector('.sf-t1'), {id:'staff-sess', rows:s.sessions, pageSize:20, columns:[
    {key:'device', label:'الجهاز', render:x => h`<span class="sf-dev">${I(/iPhone|Galaxy|تطبيق/.test(x.device) ? 'phone' : 'eye', 's16')}<bdi class="ltr">${x.device}</bdi></span>`},
    {key:'place', label:'المكان'}, {key:'at', label:'آخر نشاط', render:x => h`<span class="nw">${A.ago(x.at)}</span>`},
    {key:'act', label:'', sort:false, render:x => x.current && mine ? h`<span class="mut nw">هذه الجلسة</span>` : can && !s.owner || mine ? U.btn({label:'أنهِ الجلسة', sm:true, tone:'ghost', a:'end', attrs:h`data-sid="${x.id}"`}) : ''}],
    card:{title:x => x.device, sub:x => x.place + ' · ' + A.ago(x.at), side:() => '', skip:['device', 'place', 'at']},
    empty:{icon:'lock', title:'لا جلسات مفتوحة', text:s.status === 'invited' ? 'لم يقبل الدعوة بعد.' : 'لم يسجّل الدخول من أي جهاز الآن.'}}).draw();
  el.onclick = e => { const b = e.target.closest('[data-a="end"]'); if (!b) return; const x = s.sessions.find(y => y.id === b.dataset.sid); if (x) endOne(s, x); };
}

/* --- tab: السجل --- */
function log(el, s){
  const list = D().audit.filter(e => !e.quiet && (e.actor === s.id || e.target === s.id)).slice(0, 60);
  el.innerHTML = String(U.card({title:'ما فعله وما فُعل على حسابه', body:U.timeline(list.map(e => ({at:e.at, who:e.actorName, text:e.summary, reason:e.reason, ba:U.auditBA(e),
    icon:/perms/.test(e.action) ? 'key' : /session/.test(e.action) ? 'logout' : /gift/.test(e.action) ? 'gift' : /ban|restrict/.test(e.action) ? 'ban' : /release/.test(e.action) ? 'rocket' : 'edit'})))}));
}
})();

</script>
<script data-part="page-store.js">
/* المتجر والعملات (#/store) — tabs: العناصر (calm grid + add/edit drawer + «أهدِ لمشترك») · العملات (earning rules, top-up packs) · المبيعات
   · الألعاب (lobby games: show / hide / order; the global kill switch lives in «التحديثات»).
   Gifts from here change the member in A.D (owned items / coins + ledger), so the member profile shows them at once.
   Sensitive: gift (secured, reason), price change of an item or a coin rule (secured, reason). Everything is logged. */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const done = (text, undo) => { A.changed(); U.toast(text, undo ? {undo} : {}); };
const item = id => D().storeItems.find(x => x.id === id);
const CATS = () => { const o = {}; D().storeItems.forEach(x => { if (!o[x.cat]) o[x.cat] = x.catLabel; }); return o; };
const CAT_ORDER = ['look', 'head', 'acc', 'hair', 'base', 'cel', 'extra'];
const GENDER = {'':'للجميع', b:'للبنين', g:'للبنات'};
const owners = it => D().members.filter(m => !m.deleted && m.owned.includes(it.id)).length;

/* ---------- placeholder art: a simple silhouette per item type ---------- */
const BUST = '<circle class="b" cx="32" cy="24" r="10"/><path class="b" d="M13 57c0-11 8.5-17 19-17s19 6 19 17z"/>';
const ART = {
  look:'<circle class="b" cx="32" cy="24" r="10"/><path class="a" d="M13 57c0-11 8.5-17 19-17s19 6 19 17z"/><path class="w" d="M27 41l5 7 5-7"/>',
  head:BUST + '<path class="a" d="M21 20a11 11 0 0 1 22 0z"/><rect class="a" x="17" y="18" width="30" height="4" rx="2"/>',
  crown:BUST + '<path class="a" d="M21 19l2-10 5 5 4-7 4 7 5-5 2 10z"/>',
  face:BUST + '<circle class="s" cx="27" cy="24" r="4"/><circle class="s" cx="37" cy="24" r="4"/><path class="s" d="M31 24h2"/>',
  neck:BUST + '<path class="s" d="M24 41q8 9 16 0"/><circle class="a" cx="32" cy="50" r="3.5"/>',
  wings:'<path class="a" d="M30 40C20 27 9 29 5 40c8-3 14-1 25 6z"/><path class="a" d="M34 40c10-13 21-11 25 0-8-3-14-1-25 6z"/>' + BUST,
  halo:'<ellipse class="s" cx="32" cy="9" rx="9" ry="3"/>' + BUST,
  fx:'<path class="a" d="M20 14l2.5 7.5L30 24l-7.5 2.5L20 34l-2.5-7.5L10 24l7.5-2.5z"/><path class="a" d="M44 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path class="a" d="M38 8l1.5 3.5L43 13l-3.5 1.5L38 18l-1.5-3.5L33 13l3.5-1.5z"/><circle class="a" cx="24" cy="48" r="3"/><circle class="a" cx="48" cy="52" r="2"/>',
  hair:BUST + '<path class="a" d="M21 25c0-9 5-13 11-13s11 4 11 13c-3-4-7-6-11-6s-8 2-11 6z"/>',
  hairlong:BUST + '<path class="a" d="M21 25c0-9 5-13 11-13s11 4 11 13v13c-2 1-4 1-5 0V22c-2-1-4-2-6-2s-4 1-6 2v16c-1 1-3 1-5 0z"/>',
  base:'<circle class="a" cx="32" cy="24" r="10"/><path class="a" d="M13 57c0-11 8.5-17 19-17s19 6 19 17z"/><circle class="w" cx="28.5" cy="23" r="1.5"/><circle class="w" cx="35.5" cy="23" r="1.5"/>',
  cel:'<circle class="b" cx="32" cy="14" r="7"/><path class="s" d="M32 23v17M32 40l-8 14M32 40l8 14M32 28l-11-10M32 28l11-10"/>',
  extra:'<path class="s" d="M32 10v44M13 21l38 22M51 21L13 43"/><path class="s" d="M27 13l5 5 5-5M27 51l5-5 5 5"/>',
  scarf:BUST + '<path class="a" d="M22 40c6 4 14 4 20 0l2 5c-7 4-17 4-24 0z"/><path class="a" d="M36 44l3 10 4-2-3-9z"/>'
};
const artKey = it => {
  const k = it.key;
  if (k === 'rk-crown') return 'crown'; if (k === 'rk-halo' || k === 'halo') return 'halo'; if (k === 'rk-scarf') return 'scarf';
  if (/^fx-/.test(k)) return 'fx'; if (/wings$/.test(k)) return 'wings';
  if (['sunglasses', 'heartglasses', 'mask', 'monocle'].includes(k)) return 'face';
  if (['tie', 'necklace', 'medal', 'goldchain'].includes(k)) return 'neck';
  if (k === 'long' || k === 'pony') return 'hairlong';
  return ART[it.cat] ? it.cat : 'look';
};
const art = it => A.raw(`<svg class="st-svg" viewBox="0 0 64 64" aria-hidden="true">${ART[artKey(it)]}</svg>`);

/* ---------- page ---------- */
A.page('store', {
  title:'المتجر والعملات',
  sub:'ما يُشترى بالعملات، وكيف يكسبها المشترك.',
  primary:q => !q.tab || q.tab === 'items' ? {label:'أضف عنصرًا', icon:'plus', run:() => editItem(null), disabled:!A.can('store.edit')}
    : q.tab === 'coins' ? {label:'أهدِ عملات', icon:'coins', tone:'secondary', run:() => giftCoins(), disabled:!A.can('gift')} : null,
  tabs:[{id:'items', label:'العناصر'}, {id:'coins', label:'العملات'}, {id:'sales', label:'المبيعات'}, {id:'games', label:'الألعاب'}],
  render(el, q, ctx){ ({items, coins, sales, games})[ctx.tab](el); }
});

/* --- tab: العناصر --- */
function filterItems(st){
  return D().storeItems.filter(x => {
    if (st.cat && x.cat !== st.cat) return false;
    if (st.vis === 'on' && !x.visible) return false; if (st.vis === 'off' && x.visible) return false; if (st.vis === 'ex' && !x.exclusive) return false;
    return A.match(x.name + ' ' + x.catLabel + ' ' + x.id, st.s);
  }).sort((a, b) => (CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat)) || (a.exclusive - b.exclusive) || ((a.price || 0) - (b.price || 0)));
}
function items(el){
  el.innerHTML = '<section class="card"><div class="st-tb"></div><div class="st-grid-h"></div></section>';
  const host = el.querySelector('.st-grid-h');
  const tb = U.toolbar(el.querySelector('.st-tb'), {id:'store-items', unit:'عنصر', search:'ابحث باسم العنصر',
    selects:[{key:'cat', label:'النوع', options:CAT_ORDER.filter(c => CATS()[c]).map(c => ({v:c, label:CATS()[c]}))},
      {key:'vis', label:'الظهور', options:[{v:'on', label:'ظاهر'}, {v:'off', label:'مخفي'}, {v:'ex', label:'حصري'}]}],
    onChange:() => draw()});
  const draw = () => {
    const list = filterItems(tb.state);
    host.innerHTML = String(list.length ? h`<div class="st-grid">${list.map(x => h`<article class="st-it${x.visible ? '' : ' off'}">
        <button type="button" class="st-open" data-a="edit" data-id="${x.id}" aria-label="${'عدّل ' + x.name}">
          <span class="st-art">${art(x)}</span>
          <b>${x.name}</b><small>${x.catLabel}${x.gender ? ' · ' + GENDER[x.gender] : ''}</small></button>
        <div class="st-f">${x.exclusive ? h`<span class="chip brand">حصري</span>` : h`<span class="st-pr num">${A.coins(x.price)}</span>`}
          <label class="sw st-sw" title="${x.visible ? 'ظاهر في المتجر' : 'مخفي من المتجر'}"><input type="checkbox" data-vis="${x.id}"${x.visible ? A.raw(' checked') : ''}${A.can('store.edit') ? '' : A.raw(' disabled')}><i></i><span class="sr">ظاهر في المتجر: ${x.name}</span></label></div>
      </article>`)}</div>`
      : h`<div class="tbl-empty">${U.empty({icon:'bag', title:'لا عنصر بهذا البحث', text:'جرّب اسمًا آخر أو امسح الفلاتر.'})}</div>`);
    tb.count(list.length, D().storeItems.length);
  };
  draw();
  A.bind(host, {edit:b => editItem(item(b.dataset.id))});
  host.addEventListener('change', e => { const x = e.target.closest('[data-vis]'); if (x) setVisible(item(x.dataset.vis), x.checked); });
}

function setVisible(it, on){
  if (!it || it.visible === on) return;
  it.visible = on;
  A.log({action:'store.visible', target:it.id, targetLabel:it.name, summary:(on ? 'إظهار' : 'إخفاء') + ' «' + it.name + '» في المتجر', before:{الظهور:on ? 'مخفي' : 'ظاهر'}, after:{الظهور:on ? 'ظاهر' : 'مخفي'}});
  done(on ? 'ظهر «' + it.name + '» في المتجر.' : 'أُخفي «' + it.name + '» من المتجر. من يملكه يبقى معه.', () => { it.visible = !on;
    A.log({action:'store.undo', target:it.id, targetLabel:it.name, summary:'تراجع عن ' + (on ? 'إظهار' : 'إخفاء') + ' «' + it.name + '»'}); done('تراجعنا.'); });
}

/* add / edit drawer */
const setErr = (root, name, msg) => { const f = root.querySelector(`[data-fld="${name}"]`); if (!f) return; let e = f.querySelector('.err');
  if (!msg) { if (e) e.remove(); return; } if (!e) { e = document.createElement('span'); e.className = 'err'; f.append(e); } e.textContent = msg; };
function editItem(it){
  const isNew = !it, v = it || {name:'', cat:'look', gender:'', price:300, exclusive:false, how:'', visible:true};
  const cats = CATS();
  const d = U.drawer({title:isNew ? 'عنصر جديد' : v.name, sub:isNew ? 'يظهر في متجر المشتركين بعد الحفظ' : h`${A.id(v.id)} · ${v.catLabel}`,
    body:h`<div class="stack">
      ${isNew ? '' : h`<div class="st-dh"><span class="st-art lg">${art(v)}</span>${U.kv([['بيع', A.n(v.sales || 0) + ' مرة'], ['يملكه', A.n(owners(v)) + ' مشترك']], {one:true})}</div>`}
      ${U.fields([{name:'name', label:'الاسم', value:v.name, placeholder:'مثال: قبعة الصيف'},
        [{name:'cat', type:'select', label:'النوع', value:v.cat, options:CAT_ORDER.filter(c => cats[c]).map(c => ({v:c, label:cats[c]}))},
         {name:'gender', type:'select', label:'لمن', value:v.gender, options:Object.entries(GENDER).map(([k, l]) => ({v:k, label:l}))}],
        {name:'exclusive', type:'toggle', label:'حصري — لا يُشترى، يُكسب بإنجاز', value:v.exclusive},
        {name:'price', type:'number', label:'السعر (عملة)', value:v.price || '', min:1, max:20000},
        {name:'how', label:'كيف يُكسب؟', value:v.how || '', placeholder:'مثال: رتبة «متفوّق»'},
        {name:'visible', type:'toggle', label:'ظاهر في المتجر', value:v.visible}])}
    </div>`,
    foot:h`${U.btn({label:isNew ? 'أضف العنصر' : 'احفظ', tone:'primary', a:'save', disabled:!A.can('store.edit')})}${isNew ? '' : U.btn({label:'أهدِ لمشترك', icon:'gift', a:'gift', disabled:!A.can('gift')})}`,
    bind:{save:l => save(l), gift:l => { l.close(); giftItem(it); }}});
  const sync = () => { const ex = d.el.querySelector('input[name=exclusive]').checked;
    d.el.querySelector('[data-fld="price"]').style.display = ex ? 'none' : ''; d.el.querySelector('[data-fld="how"]').style.display = ex ? '' : 'none'; };
  d.el.querySelector('input[name=exclusive]').addEventListener('change', sync); sync();
  function save(l){
    const f = U.values(l.el); let bad = false;
    ['name', 'price', 'how'].forEach(n => setErr(l.el, n, ''));
    if (f.name.length < 2) { setErr(l.el, 'name', 'اكتب اسم العنصر.'); bad = true; }
    if (!f.exclusive && !(f.price >= 1 && f.price <= 20000)) { setErr(l.el, 'price', 'السعر من ١ إلى ٢٠٬٠٠٠ عملة.'); bad = true; }
    if (f.exclusive && f.how.length < 3) { setErr(l.el, 'how', 'اكتب كيف يُكسب.'); bad = true; }
    if (bad) return;
    const next = {name:f.name, cat:f.cat, catLabel:cats[f.cat], gender:f.gender, exclusive:f.exclusive, price:f.exclusive ? null : Math.round(f.price), how:f.exclusive ? f.how : '', visible:f.visible};
    if (isNew) {
      const ids = D().storeItems.map(x => +x.id.slice(3)); const x = Object.assign({id:'IT-' + (Math.max(...ids) + 1), key:'new-' + Date.now(), isNew:true, sales:0}, next);
      D().storeItems.push(x); l.close();
      A.log({action:'store.add', target:x.id, targetLabel:x.name, summary:'إضافة «' + x.name + '» إلى المتجر' + (x.exclusive ? ' (حصري)' : ' بسعر ' + A.coins(x.price)), after:{الظهور:x.visible ? 'ظاهر' : 'مخفي'}});
      return done('أُضيف «' + x.name + '» إلى المتجر.', () => { D().storeItems.splice(D().storeItems.indexOf(x), 1); A.log({action:'store.undo', target:x.id, targetLabel:x.name, summary:'تراجع عن إضافة «' + x.name + '»'}); done('حُذف العنصر.'); });
    }
    const before = {name:it.name, cat:it.cat, catLabel:it.catLabel, gender:it.gender, exclusive:it.exclusive, price:it.price, how:it.how, visible:it.visible};
    const changed = Object.keys(next).filter(k => k !== 'catLabel' && (next[k] || '') !== (before[k] || ''));
    if (!changed.length) { l.close(); return; }
    const priceChange = changed.includes('price') && before.price && next.price;
    const apply = reason => { Object.assign(it, next); l.close();
      const LBL = {name:'الاسم', cat:'النوع', gender:'لمن', exclusive:'حصري', price:'السعر', how:'طريقة الكسب', visible:'الظهور'};
      const show = (k, o) => k === 'price' ? (o.price ? A.coins(o.price) : '—') : k === 'exclusive' || k === 'visible' ? (o[k] ? 'نعم' : 'لا') : k === 'cat' ? o.catLabel : k === 'gender' ? GENDER[o.gender] : o[k] || '—';
      A.log({action:priceChange ? 'store.price' : 'store.edit', target:it.id, targetLabel:it.name, summary:'تعديل «' + it.name + '»: ' + changed.map(k => LBL[k]).join('، '), reason,
        before:Object.fromEntries(changed.map(k => [LBL[k], show(k, before)])), after:Object.fromEntries(changed.map(k => [LBL[k], show(k, it)]))});
      done('حُفظ «' + it.name + '».', () => { Object.assign(it, before); A.log({action:'store.undo', target:it.id, targetLabel:it.name, summary:'تراجع عن تعديل «' + it.name + '»'}); done('عاد العنصر كما كان.'); }); };
    if (!priceChange) return apply();
    if (!A.can('prices')) { setErr(l.el, 'price', 'تعديل الأسعار يحتاج صلاحية «تعديل الأسعار».'); return; }
    U.confirm({title:'تعديل سعر «' + before.name + '»', text:'من ' + A.coins(before.price) + ' إلى ' + A.coins(next.price) + '. من اشتراه قبل ذلك لا يتأثر.', secure:'تعديل سعر', confirmLabel:'احفظ السعر', reasonPh:'مثال: عرض نهاية الأسبوع'})
      .then(r => { if (r) apply(r.reason); });
  }
}

/* member picker inside a confirm modal */
function pickerBody(){ return h`<div class="fld st-pick" data-fld="member"><span class="lb">المشترك</span><label class="tb-s">${I('search', 's16')}<span class="sr">ابحث عن المشترك</span><input type="search" class="st-q" placeholder="الاسم أو الكود أو الجوال" autocomplete="off"></label><div class="st-res" role="radiogroup" aria-label="المشترك"></div></div>`; }
function wirePicker(mel, o = {}){
  let picked = '';
  const inp = mel.querySelector('.st-q'), res = mel.querySelector('.st-res');
  const live = () => D().members.filter(m => !m.deleted && A.statusOf(m).key !== 'banned');
  const draw = () => { const raw = inp.value.trim(), qn = A.norm(raw), digits = qn.replace(/\D/g, ''), qp = A.normPhone(raw);
    const list = !qn ? live().sort((a, b) => b.lastSeen.localeCompare(a.lastSeen)).slice(0, 4)
      : live().filter(m => A.norm(m.name + ' ' + m.code + ' ' + m.email).includes(qn) || (digits.length >= 3 && (m.phone.includes(qp || digits) || m.code.includes(digits)))).slice(0, 6);
    res.innerHTML = String(list.length ? h`${!qn ? h`<span class="st-res-h">نشطون الآن — أو ابحث عن غيرهم</span>` : ''}${list.map(m => { const off = o.off && o.off(m);
      return h`<label class="opt${off ? ' st-dis' : ''}"><input type="radio" name="member" value="${m.id}"${m.id === picked ? A.raw(' checked') : ''}${off ? A.raw(' disabled') : ''}><span><b>${m.name}</b><small>${A.id(m.code)} · ${off || A.coins(m.coins)}</small></span></label>`; })}`
      : h`<p class="st-res-none">لا مشترك بهذا البحث.</p>`);
    res.querySelectorAll('input[name=member]').forEach(x => x.onchange = () => { picked = x.value; const e = mel.querySelector('[data-fld="member"] > .err'); if (e) e.remove(); }); };
  inp.addEventListener('input', draw); draw();
  return () => picked;
}

function giftItem(it){
  if (!it) return; if (!A.can('gift')) return U.toast('تحتاج صلاحية الإهداء.', {tone:'no'});
  let getPick;
  U.confirm({title:'أهدِ «' + it.name + '»', text:'يُضاف لخزانة المشترك فورًا دون أن تُخصم عملاته، ويظهر في ملفه.', secure:'إهداء عنصر من المتجر', confirmLabel:'أهدِ العنصر',
    body:pickerBody(), onOpen:mel => { getPick = wirePicker(mel, {off:m => m.owned.includes(it.id) ? 'يملكه بالفعل' : ''}); },
    validate:() => getPick && getPick() ? '' : ['member', 'اختر المشترك أولًا.'], reasonPh:'مثال: فائز مسابقة الأسبوع'}).then(r => {
    if (!r) return; const m = A.member(r.member); if (!m || m.owned.includes(it.id)) return;
    const undo = A.grant.item(m, it, r.reason);
    done('أُضيف «' + it.name + '» لخزانة ' + m.name + '.', () => { undo(); done('تراجعنا عن الهدية.'); });
  });
}
function giftCoins(){
  if (!A.can('gift')) return U.toast('تحتاج صلاحية الإهداء.', {tone:'no'});
  let getPick;
  U.confirm({title:'أهدِ عملات لمشترك', text:'تُضاف لرصيده فورًا وتظهر في حركة عملاته.', secure:'إهداء عملات', confirmLabel:'أهدِ العملات',
    body:pickerBody(), fields:[{name:'amount', type:'number', label:'عدد العملات', value:200, min:1, max:10000, hint:'من ١ إلى ١٠٬٠٠٠ عملة.'}],
    onOpen:mel => { getPick = wirePicker(mel); },
    validate:v => !(getPick && getPick()) ? ['member', 'اختر المشترك أولًا.'] : !(v.amount >= 1 && v.amount <= 10000) ? ['amount', 'اكتب عددًا من ١ إلى ١٠٬٠٠٠.'] : '',
    reasonPh:'مثال: تعويض عن مشكلة في الدفع'}).then(r => {
    if (!r) return; const m = A.member(r.member); if (!m) return;
    const amt = Math.round(r.amount);
    const undo = A.grant.coins(m, amt, r.reason);
    done('أُضيفت ' + A.coins(amt) + ' لرصيد ' + m.name + '.', () => { undo(); done('تراجعنا عن الهدية.'); });
  });
}

/* --- tab: العملات --- */
function coins(el){
  const ms = Date.parse(A.iso().slice(0, 8) + '01T00:00:00+03:00');
  const soldMonth = id => D().payments.filter(p => p.kind === 'coins' && p.addon === id && p.status === 'paid' && Date.parse(p.at) >= ms).length;
  el.innerHTML = String(h`<div class="grid2 even">

      <b class="num st-plus nw"><bdi class="ltr">+${A.n(r.amount)}</bdi></b>${U.btn({label:'عدّل', sm:true, tone:'ghost', a:'rule', attrs:h`data-id="${r.id}"`, disabled:!A.can('store.full')})}</li>`)}</ul>`})}
    ${U.card({title:'باقات الشحن', link:{label:'عدّل الأسعار', href:A.href('subscriptions', {tab:'plans'})}, flush:true, body:h`<ul class="st-rows">${D().addons.map(x => h`<li><span class="tt"><b>${A.coins(x.coins)}</b><small>${A.n(soldMonth(x.id))} عملية هذا الشهر</small></span>
      <b class="num nw">${A.money(x.price)}</b></li>`)}</ul>`})}
  </div>`);
  A.bind(el, {rule:b => editRule(D().coinRules.find(r => r.id === b.dataset.id))});
}
function editRule(r){
  if (!r) return;
  U.confirm({title:'عدّل مكافأة «' + r.label + '»', text:'المكافأة الحالية ' + A.coins(r.amount) + '. تُطبَّق على ما يحدث من الآن، ولا تتغير أرصدة سابقة.', secure:'تعديل مكافأة العملات', confirmLabel:'احفظ',
    fields:[{name:'amount', type:'number', label:'عدد العملات', value:r.amount, min:1, max:5000}],
    validate:v => !(v.amount >= 1 && v.amount <= 5000) ? ['amount', 'اكتب عددًا من ١ إلى ٥٬٠٠٠.'] : v.amount === r.amount ? ['amount', 'هذه هي القيمة الحالية.'] : '',
    reasonPh:'مثال: تشجيع حل تحدّي اليوم'}).then(x => {
    if (!x) return; const before = r.amount; r.amount = Math.round(x.amount);
    A.log({action:'coins.rule', target:r.id, targetLabel:r.label, summary:'مكافأة «' + r.label + '» ' + A.coins(r.amount), reason:x.reason, before:{المكافأة:A.n(before)}, after:{المكافأة:A.n(r.amount)}});
    done('صارت مكافأة «' + r.label + '» ' + A.coins(r.amount) + '.', () => { const now = r.amount; r.amount = before;
      A.log({action:'coins.undo', target:r.id, targetLabel:r.label, summary:'تراجع عن تعديل مكافأة «' + r.label + '»', before:{المكافأة:A.n(now)}, after:{المكافأة:A.n(before)}}); done('عادت المكافأة كما كانت.'); });
  });
}

/* --- tab: المبيعات --- */
function sales(el){
  el.innerHTML = '<section class="card st-list"><div class="st-tb"></div><div class="st-tbl"></div></section>';
  const rows = st => D().purchases.filter(p => { const it = item(p.item), m = A.member(p.memberId);
    if (st.cat && (!it || it.cat !== st.cat)) return false;
    return A.match((it ? it.name : '') + ' ' + (m ? m.name + ' ' + m.code : ''), st.s); });
  let tbl;
  const tb = U.toolbar(el.querySelector('.st-tb'), {id:'store-sales', unit:'عملية شراء', search:'ابحث بالعنصر أو اسم المشترك',

  tbl = U.table(el.querySelector('.st-tbl'), {id:'store-sales', rows:() => rows(tb.state), sort:{key:'at', dir:'desc'}, onRow:p => { const it = item(p.item); if (it) editItem(it); }, columns:[
    {key:'item', label:'العنصر', value:p => (item(p.item) || {}).name, render:p => { const it = item(p.item) || {name:'—', catLabel:''};
      return h`<span class="st-cell"><span class="st-art xs">${it.id ? art(it) : ''}</span><span class="nm"><b>${it.name}</b><small>${it.catLabel}</small></span></span>`; }},
    {key:'member', label:'المشترك', value:p => (A.member(p.memberId) || {}).name, render:p => { const m = A.member(p.memberId);
      return m && !m.deleted ? U.who(m, {tab:'coins'}) : h`<span class="mut">حساب محذوف</span>`; }},
    {key:'price', label:'السعر', num:true, render:p => p.gift ? U.chip('هدية', 'brand') : h`<span class="nw">${A.coins(p.price)}</span>`},
    {key:'at', label:'التاريخ', render:p => h`<span class="nw">${A.when(p.at)}</span>`}],
    card:{title:p => (item(p.item) || {}).name || '—', sub:p => ((A.member(p.memberId) || {}).name || '—') + ' · ' + A.date(p.at), side:p => p.gift ? U.chip('هدية', 'brand') : h`<span class="num nw">${A.coins(p.price)}</span>`, skip:['item', 'member', 'price', 'at']},
    empty:{icon:'bag', title:'لا مبيعات بهذا البحث', text:'كل شراء بالعملات يظهر هنا.'}});
  const draw = () => { tbl.draw(); tb.count(rows(tb.state).length, D().purchases.length); };
  draw();
}

/* --- tab: الألعاب --- */
function games(el){
  const G = () => D().games.slice().sort((a, b) => a.order - b.order), can = A.can('store.edit'), off = D().switches && D().switches.games === false;
  el.innerHTML = String(h`<section class="card st-games"><ul class="st-gl">${G().map((g, i, arr) => h`<li class="${g.visible ? '' : 'off'}">
      <span class="st-go num">${A.n(i + 1)}</span>
      <span class="tt"><b>${g.name}</b><small>${g.cat} · ${g.players}${g.bank ? ' · ' + g.bank : ''} · ${A.n(g.plays7)} جولة هذا الأسبوع</small></span>
      <span class="st-ga">${U.btn({icon:'up', sm:true, tone:'ghost', aria:'انقل لأعلى: ' + g.name, disabled:!can || i === 0, attrs:h`data-mv="${g.id}" data-d="-1"`})}${U.btn({icon:'down', sm:true, tone:'ghost', aria:'انقل لأسفل: ' + g.name, disabled:!can || i === arr.length - 1, attrs:h`data-mv="${g.id}" data-d="1"`})}</span>
      <label class="sw" title="${g.visible ? 'ظاهرة في اللوبي' : 'مخفية من اللوبي'}"><input type="checkbox" data-gv="${g.id}"${g.visible ? A.raw(' checked') : ''}${can ? '' : A.raw(' disabled')}><i></i><span class="sr">ظاهرة في اللوبي: ${g.name}</span></label></li>`)}</ul>
    <p class="st-gn muted-note">${I(off ? 'pause' : 'clock', 's16')}<span>${off ? 'الألعاب كلها موقوفة الآن من ' : 'لإيقاف الألعاب كلها فورًا استخدم مفتاح الإيقاف في '}<a href="${A.href('updates')}">التحديثات</a>.</span></p></section>`);
  el.onclick = e => { const b = e.target.closest('[data-mv]'); if (!b || b.disabled) return; moveGame(b.dataset.mv, +b.dataset.d); };
  el.onchange = e => { const x = e.target.closest('[data-gv]'); if (x) showGame(x.dataset.gv, x.checked); };
}
function moveGame(id, d){
  const list = D().games.slice().sort((a, b) => a.order - b.order), i = list.findIndex(g => g.id === id), j = i + d; if (j < 0 || j >= list.length) return;
  const a = list[i], b = list[j]; [a.order, b.order] = [b.order, a.order];
  A.log({action:'store.game', target:a.id, targetLabel:a.name, summary:'ترتيب «' + a.name + '» في اللوبي: ' + A.n(j + 1), before:{الترتيب:i + 1}, after:{الترتيب:j + 1}});
  A.changed(); requestAnimationFrame(() => { const f = document.querySelector(`[data-mv="${id}"][data-d="${d}"]:not([disabled])`) || document.querySelector(`[data-mv="${id}"]:not([disabled])`); if (f) f.focus(); });
}
function showGame(id, on){
  const g = D().games.find(x => x.id === id); if (!g || g.visible === on) return; g.visible = on;
  A.log({action:'store.game', target:g.id, targetLabel:g.name, summary:(on ? 'إظهار' : 'إخفاء') + ' «' + g.name + '» في اللوبي', before:{الظهور:on ? 'مخفية' : 'ظاهرة'}, after:{الظهور:on ? 'ظاهرة' : 'مخفية'}});
  done(on ? 'ظهرت «' + g.name + '» في اللوبي.' : 'أُخفيت «' + g.name + '» من اللوبي. الجولات الجارية تكمل.', () => { g.visible = !on; A.log({action:'store.undo', target:g.id, targetLabel:g.name, summary:'تراجع عن ' + (on ? 'إظهار' : 'إخفاء') + ' «' + g.name + '»'}); done('تراجعنا.'); });
}

A.searchProvider({id:'store', label:'المتجر', icon:'bag', max:3, find:qn => D().storeItems.filter(x => A.norm(x.name).includes(qn)).slice(0, 3)
  .map(x => ({title:x.name, sub:x.catLabel + ' · ' + (x.exclusive ? 'حصري' : A.coins(x.price)), href:A.href('store'), icon:'bag'}))});
})();

</script>
<script data-part="page-subscriptions.js">
/* الاشتراكات والباقات (#/subscriptions) — tabs: الاشتراكات · تنتهي قريبًا · الباقات والأسعار · أكواد الخصم.
   Prices and discount codes need A.can('prices') as well as the page permission.
   Row → drawer: details + «مدّد» (secured, reason) + «ألغِ الاشتراك» (secured, now / at period end).
   Plans & prices: calm cards per plan, add-on and coin pack; «عدّل السعر» = secured + reason + effective date.
   A new price only applies to purchases from its date on — past payments keep their amount (they store it). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const planName = id => A.planOf(id).name;
const canPrice = () => A.can('subscriptions.full') && A.can('prices');
const SOON = 7;                                      /* «ينتهي قريبًا» = within 7 days (same as الرئيسية) */

/* ---- extra demo data (only if the shared data does not already carry it) ---- */
D().extras = D().extras || [{id:'course-ext', name:'تمديد الدورة ٣٠ يومًا', price:39, product:'course-ext',
  includes:['يمدّد «الدورة + البنك» شهرًا بعد موعد الاختبار', 'لمن تأجّل اختباره']}];
D().addons.forEach(x => { if (!x.product) x.product = x.id; if (!x.includes) x.includes = [A.coins(x.coins) + ' تُضاف لرصيده فورًا']; });
const DW = {free:'', pro:'DW-2041', lux:'DW-2042', course:'DW-2040', 'course-ext':'DW-2043', 'coins-500':'DW-3101', 'coins-1200':'DW-3102', 'coins-3000':'DW-3103'};
D().plans.concat(D().addons, D().extras).forEach(p => { if (p.dwId === undefined) p.dwId = DW[p.id] || ''; });

/* scheduled price changes become the price once their date arrives */
function applyDue(){ D().plans.concat(D().addons, D().extras).forEach(p => {
  if (p.nextPrice && Date.parse(p.nextPrice.from) <= A.now()) { p.price = p.nextPrice.price; p.nextPrice = null; } }); }

/* ---------- status ---------- */
const stOf = s => {
  if (s.status === 'cancelled') return {key:'cancelled', label:'ملغى', tone:'no'};
  if (s.status === 'replaced') return {key:'replaced', label:'استُبدل', tone:''};
  if (s.status === 'ended' || Date.parse(s.end) <= A.now()) return {key:'ended', label:'منتهٍ', tone:''};
  if (A.left(s.end) <= SOON) return {key:'soon', label:'ينتهي قريبًا', tone:'warn'};
  return {key:'active', label:'فعّال', tone:'ok'};
};
const isLive = s => ['active', 'soon'].includes(stOf(s).key);
const srcCell = s => s.source === 'gift' ? U.chip('هدية', 'brand') : h`<span class="mut">شراء</span>`;
const memberCell = s => { const m = A.member(s.memberId);
  return !m ? h`<span class="mut">—</span>` : m.deleted ? h`<span class="nm"><b class="mut">حساب محذوف</b></span>`
    : U.who(m); };
const nameOf = s => (A.member(s.memberId) || {}).name || '—';

function filterRows(st, base){
  const qn = A.norm(st.s), digits = qn.replace(/\D/g, ''), qp = A.normPhone(st.s);
  return base.filter(s => {
    if (st.plan && s.plan !== st.plan) return false;
    if (st.status && stOf(s).key !== st.status) return false;
    if (st.source && (s.source === 'gift' ? 'gift' : 'payment') !== st.source) return false;
    if (!qn) return true;
    const m = A.member(s.memberId); if (!m) return false;
    if (A.norm(m.name + ' ' + m.code + ' ' + s.id).includes(qn)) return true;
    return digits.length >= 3 && (m.phone.includes(qp || digits) || m.code.includes(digits));
  });
}

A.page('subscriptions', {
  title:'الاشتراكات والباقات',
  sub:'من اشترك في ماذا، ومتى ينتهي، وبكم تُباع كل باقة.',
  tabs:() => { const soon = D().subscriptions.filter(s => stOf(s).key === 'soon').length;
    return [{id:'all', label:'الاشتراكات'}, {id:'soon', label:'تنتهي قريبًا', count:soon || null}, {id:'plans', label:'الباقات والأسعار'}, {id:'codes', label:'أكواد الخصم'}]; },
  primary:q => q.tab === 'codes' ? {label:'أنشئ كودًا', icon:'plus', disabled:!canPrice(), run:() => newCode()} : null,
  render(el, q, ctx){ applyDue(); ({all:listAll, soon:listSoon, plans, codes})[ctx.tab](el); }
});

/* --- tab: الاشتراكات --- */
function listAll(el){
  el.innerHTML = '<section class="card sb-list"><div class="sb-tb"></div><div class="sb-tbl"></div></section>';
  let tbl;
  const all = () => D().subscriptions;
  const tb = U.toolbar(el.querySelector('.sb-tb'), {id:'subs', unit:'اشتراك', search:'ابحث باسم المشترك أو الكود أو الجوال',
    selects:[{key:'plan', label:'الباقة', options:D().plans.filter(p => p.id !== 'free').map(p => ({v:p.id, label:p.name}))},

/* ---------- drawer ---------- */
function openSub(s){

    body:h`<div class="stack">

        ['البداية', A.date(s.start, {year:true})], ['النهاية', h`${A.date(s.end, {year:true})}${live ? h` <span class="mut">· متبقٍ ${A.days(left)}</span>` : ''}`],

        ['الدفعة', pay ? h`${A.id(pay.id)} <span class="mut">· ${A.money(pay.amount)}</span>` : '—'],
        ['المشترك', m && !m.deleted ? h`<a href="${A.href('member', {id:m.id, tab:'sub'})}">${m.name}</a> <span class="mut">${A.id(m.code)}</span>` : 'حساب محذوف']])}
      ${s.cancelledAt ? h`<p class="sb-note">${I('alert', 's16')}<span>أُلغي ${A.when(s.cancelledAt)}${s.cancelReason ? ' — ' + s.cancelReason : ''}</span></p>` : ''}
    </div>`,
    foot:h`${live ? h`${U.btn({label:'مدّد', icon:'calendar', tone:'primary', a:'extend', disabled:!A.can('gift')})}${U.btn({label:'ألغِ الاشتراك', icon:'x', tone:'danger', a:'cancel', disabled:!A.can('subscriptions.edit')})}` : ''}
      ${m && !m.deleted ? U.btn({label:'ملف المشترك', tone:'ghost', href:A.href('member', {id:m.id, tab:'sub'})}) : ''}`,
    bind:{extend:l => { l.close(); extend(s); }, cancel:l => { l.close(); cancel(s); }}});
}

const DUR = {w1:7, m1:30, m3:90};
const DURL = {w1:'أسبوع', m1:'شهر', m3:'٣ أشهر', exam:'حتى موعد اختباره'};
const done = (text, undo) => { A.changed(); U.toast(text, undo ? {undo} : {}); };
const isCurrent = (m, s) => m && m.plan === s.plan && m.planEnd === s.end;

function extend(s){
  const m = A.member(s.memberId); if (!m) return;
  U.confirm({title:'مدّد اشتراك ' + m.name, text:'«' + planName(s.plan) + '» ينتهي الآن ' + A.date(s.end) + '. تُضاف المدة من تاريخ الانتهاء ولا يُطلب منه دفع.',
    secure:'تمديد اشتراك', confirmLabel:'مدّد',
    fields:[{name:'dur', type:'seg', label:'المدة', value:'m1', options:[{v:'w1', label:'أسبوع'}, {v:'m1', label:'شهر'}, {v:'m3', label:'٣ أشهر'}, {v:'exam', label:'حتى موعد اختباره'}]}],
    validate:v => v.dur === 'exam' && Date.parse(m.examDate + 'T20:59:00Z') <= Date.parse(s.end) ? ['dur', 'موعد اختباره قبل نهاية الاشتراك الحالية.'] : '',
    reasonPh:'مثال: تعويض عن توقف الخدمة يومين'}).then(r => {
    if (!r) return;
    const before = {end:s.end, planEnd:m.planEnd}, cur = isCurrent(m, s);
    s.end = r.dur === 'exam' ? new Date(m.examDate + 'T20:59:00Z').toISOString() : A.addDays(s.end, DUR[r.dur]);
    if (cur) m.planEnd = s.end;
    A.log({action:'subscription.extend', target:m.id, targetLabel:m.name, summary:'تمديد «' + planName(s.plan) + '» — ' + DURL[r.dur], reason:r.reason,
      before:{النهاية:A.date(before.end)}, after:{النهاية:A.date(s.end)}});
    done('مُدّد اشتراك ' + m.name + ' حتى ' + A.date(s.end) + '.', () => { s.end = before.end; if (cur) m.planEnd = before.planEnd;
      A.log({action:'subscription.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن تمديد «' + planName(s.plan) + '»', before:{النهاية:A.date(s.end)}, after:{النهاية:A.date(before.end)}}); done('تراجعنا عن التمديد.'); });
  });
}

function cancel(s){
  const m = A.member(s.memberId); if (!m) return;
  U.confirm({title:'ألغِ اشتراك ' + m.name, text:'لا يُسترد المبلغ تلقائيًا؛ الاسترداد من «المدفوعات».', tone:'danger', secure:'إلغاء اشتراك', confirmLabel:'ألغِ الاشتراك',
    fields:[{name:'when', type:'opts', label:'متى يتوقف؟', value:'end', options:[
      {v:'end', label:'بنهاية المدة', sub:'يبقى وصوله حتى ' + A.date(s.end) + ' ولا يتجدد'}, {v:'now', label:'الآن', sub:'يعود إلى الباقة المجانية فورًا'}]}],
    reasonPh:'مثال: طلب المشترك عبر الدعم'}).then(r => {
    if (!r) return;
    const snap = {s:Object.assign({}, s), m:{plan:m.plan, planStart:m.planStart, planEnd:m.planEnd, autoRenew:m.autoRenew}}, cur = isCurrent(m, s);
    if (r.when === 'now') {
      Object.assign(s, {status:'cancelled', end:A.iso(), cancelledAt:A.iso(), cancelReason:r.reason, renew:false});
      if (cur) Object.assign(m, {plan:'free', planStart:null, planEnd:null, autoRenew:false});
    } else { Object.assign(s, {renew:false, cancelAtEnd:true}); if (cur) m.autoRenew = false; }
    A.log({action:'subscription.cancel', target:m.id, targetLabel:m.name, summary:'إلغاء «' + planName(s.plan) + '» ' + (r.when === 'now' ? 'فورًا' : 'بنهاية المدة'), reason:r.reason,
      before:{الباقة:planName(snap.m.plan)}, after:{الباقة:r.when === 'now' && cur ? 'مجاني' : planName(snap.m.plan) + ' حتى ' + A.date(s.end)}});
    done(r.when === 'now' ? 'أُلغي الاشتراك وعاد ' + m.name + ' إلى المجانية.' : 'لن يتجدد اشتراك ' + m.name + '، وينتهي ' + A.date(s.end) + '.', () => {
      Object.keys(s).forEach(k => delete s[k]); Object.assign(s, snap.s); Object.assign(m, snap.m);
      A.log({action:'subscription.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن إلغاء «' + planName(s.plan) + '»'}); done('تراجعنا عن الإلغاء.'); });
  });
}

/* --- tab: الباقات والأسعار --- */
function plans(el){
  const now = A.now();
  const subsOn = id => D().members.filter(m => !m.deleted && m.plan === id && (id === 'free' || (m.planEnd && Date.parse(m.planEnd) > now))).length;
  const priceLine = p => p.price ? h`<div class="sb-price"><b class="num">${A.n(p.price)}</b><span>ر.س${p.period ? ' · ' + p.period : ''}</span></div>` : h`<div class="sb-price"><b>مجانًا</b><span>دائمًا</span></div>`;
  const next = p => p.nextPrice ? h`<p class="sb-next">${I('clock', 's16')}<span>يصبح ${A.money(p.nextPrice.price)} من ${A.date(p.nextPrice.from)}</span><button type="button" class="sb-lnk" data-a="unsched" data-id="${p.id}">ألغِ</button></p>` : '';
  const foot = (p, kind) => h`<div class="sb-pf"><span class="sb-prod">${p.dwId ? h`منتج «دورة» ${A.id(p.dwId)}` : 'بلا منتج في «دورة»'}</span>
    ${p.price !== 0 || kind !== 'plan' ? U.btn({label:'عدّل السعر', sm:true, a:'price', attrs:h`data-id="${p.id}"`, disabled:!canPrice(), title:canPrice() ? '' : 'تحتاج صلاحية «تعديل الأسعار»'}) : ''}</div>`;
  const plansHtml = D().plans.map(p => h`<article class="card sb-plan${p.id === 'course' ? ' feat' : ''}">
    <div class="sb-ph"><h3>${p.name}</h3><span class="mut nw">${A.n(subsOn(p.id))} مشترك</span></div>
    ${priceLine(p)}${next(p)}
    <ul class="sb-feat">${p.features.map(f => h`<li>${I('check', 's16')}<span>${f}</span></li>`)}</ul>
    ${foot(p, 'plan')}</article>`);
  const small = D().extras.map(x => ({x, kind:'extra'})).concat(D().addons.map(x => ({x, kind:'coins'})));
  const smallHtml = small.map(({x, kind}) => h`<article class="card sb-add">
    <div class="sb-ph"><h3>${x.name}</h3><span class="mut nw">${kind === 'coins' ? 'شحن عملات' : 'إضافة'}</span></div>
    <div class="sb-price sm"><b class="num">${A.n(x.price)}</b><span>ر.س · مرة واحدة</span></div>${next(x)}
    <p class="sb-inc">${x.includes.join(' · ')}</p>
    ${foot(x, kind)}</article>`);
  el.innerHTML = String(h`<div class="sb-plans">${plansHtml}</div>
    <h2 class="sb-h">الإضافات وشحن العملات</h2>
    <div class="sb-adds">${smallHtml}</div>`);
  A.bind(el, {price:b => editPrice(b.dataset.id), unsched:b => unschedule(b.dataset.id)});
}
const findPriced = id => D().plans.concat(D().addons, D().extras).find(p => p.id === id);
const labelOf = p => p.coins ? 'شحن ' + p.name : p.name;

function editPrice(id){
  const p = findPriced(id); if (!p) return;
  if (!canPrice()) return U.toast('تعديل الأسعار يحتاج صلاحية «تعديل الأسعار».', {tone:'no'});
  const tomorrow = new Date(A.addDays(null, 1)).toISOString().slice(0, 10);
  U.confirm({title:'عدّل سعر «' + labelOf(p) + '»', text:'السعر الحالي ' + A.money(p.price) + '. السعر الجديد للمشتريات القادمة فقط؛ من اشترى قبل ذلك يبقى على ما دفعه.',
    secure:'تعديل سعر', confirmLabel:'احفظ السعر',
    fields:[{name:'price', type:'number', label:'السعر الجديد (ر.س)', value:p.nextPrice ? p.nextPrice.price : p.price, min:1, max:2000},
      {name:'when', type:'seg', label:'يبدأ', value:'now', options:[{v:'now', label:'من الآن'}, {v:'date', label:'من تاريخ'}]},
      {name:'from', type:'date', label:'تاريخ البدء', value:p.nextPrice ? p.nextPrice.from.slice(0, 10) : tomorrow}],
    onOpen:mel => { const f = mel.querySelector('[data-fld="from"]'), sync = () => { const v = mel.querySelector('input[name=when]:checked'); f.style.display = v && v.value === 'date' ? '' : 'none'; };
      mel.querySelectorAll('input[name=when]').forEach(x => x.addEventListener('change', sync)); sync(); },
    validate:v => !(v.price >= 1 && v.price <= 2000) ? ['price', 'اكتب سعرًا من ١ إلى ٢٬٠٠٠ ر.س.']
      : v.when === 'now' && v.price === p.price ? ['price', 'هذا هو السعر الحالي.']
      : v.when === 'date' && !(v.from && v.from >= tomorrow) ? ['from', 'اختر تاريخًا من الغد فصاعدًا.'] : '',
    reasonPh:'مثال: عرض العودة للمدارس'}).then(r => {
    if (!r) return;
    const price = Math.round(r.price * 100) / 100, before = {price:p.price, nextPrice:p.nextPrice};
    if (r.when === 'now') { p.price = price; p.nextPrice = null; }
    else p.nextPrice = {price, from:new Date(r.from + 'T00:00:00+03:00').toISOString(), by:A.me().id, reason:r.reason};
    (p.priceHistory = p.priceHistory || []).unshift({at:A.iso(), from:before.price, to:price, effective:r.when === 'now' ? A.iso() : p.nextPrice.from, by:A.me().name, reason:r.reason});
    A.log({action:'price.change', target:p.id, targetLabel:labelOf(p), summary:'سعر «' + labelOf(p) + '» ' + A.money(price) + (r.when === 'now' ? ' من الآن' : ' من ' + A.date(p.nextPrice.from)), reason:r.reason,
      before:{السعر:A.money(before.price)}, after:{السعر:A.money(price)}});
    done(r.when === 'now' ? 'صار سعر «' + labelOf(p) + '» ' + A.money(price) + ' للمشتريات الجديدة.' : 'سيصبح سعر «' + labelOf(p) + '» ' + A.money(price) + ' من ' + A.date(p.nextPrice.from) + '.', () => {
      p.price = before.price; p.nextPrice = before.nextPrice; p.priceHistory.shift();
      A.log({action:'price.undo', target:p.id, targetLabel:labelOf(p), summary:'تراجع عن تعديل سعر «' + labelOf(p) + '»', before:{السعر:A.money(price)}, after:{السعر:A.money(before.price)}}); done('عاد السعر كما كان.'); });
  });
}
function unschedule(id){
  const p = findPriced(id); if (!p || !p.nextPrice) return;
  U.confirm({title:'ألغِ تغيير السعر المجدول', text:'يبقى سعر «' + labelOf(p) + '» ' + A.money(p.price) + ' ولا يتغير في ' + A.date(p.nextPrice.from) + '.', reason:'optional', confirmLabel:'ألغِ التغيير'}).then(r => {
    if (!r) return; const was = p.nextPrice; p.nextPrice = null;
    A.log({action:'price.unschedule', target:p.id, targetLabel:labelOf(p), summary:'إلغاء تغيير سعر «' + labelOf(p) + '» المجدول', reason:r.reason, before:{السعر_القادم:A.money(was.price)}, after:{السعر_القادم:'—'}});
    done('أُلغي التغيير المجدول.', () => { p.nextPrice = was; done('عاد التغيير المجدول.'); });
  });
}
