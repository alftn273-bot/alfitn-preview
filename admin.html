const fieldErr = (el, name, msg) => { const f = el.querySelector(`[data-fld="${name}"]`) || el.querySelector(`[name="${name}"]`)?.closest('.fld'); if (!f) return;
  let e = f.querySelector('.err'); if (!msg) { if (e) e.remove(); const i = f.querySelector('.in'); if (i) i.classList.remove('bad'); return; }
  if (!e) { e = document.createElement('span'); e.className = 'err'; f.append(e); } e.textContent = msg; const i = f.querySelector('.in'); if (i) i.classList.add('bad'); };

/* modal */
ui.modal = o => {
  const l = layer('modal' + (o.size === 'lg' ? ' lg' : ''), h`<div class="modal-h"><div class="tt"><h2 id="mt">${o.title}</h2>${o.text ? h`<p>${o.text}</p>` : ''}</div><button class="x-btn" data-close aria-label="إغلاق">${I('x')}</button></div>
    ${o.body ? h`<div class="modal-b">${o.body}</div>` : ''}${o.foot ? h`<div class="modal-f">${o.foot}</div>` : ''}`, {sticky:o.sticky, onClose:o.onClose});
  l.el.setAttribute('aria-labelledby', 'mt');
  if (o.bind) A.bind(l.el, Object.fromEntries(Object.entries(o.bind).map(([k, fn]) => [k, (el, e) => fn(l, el, e)])));
  setTimeout(() => { const f = l.el.querySelector('.modal-b input:not([type=radio]):not([type=checkbox]),.modal-b textarea,.modal-b select') || l.el.querySelector('.modal-f .btn.primary,.modal-f .btn.dangerf') || l.el.querySelector('.x-btn'); if (f) f.focus(); }, 30);
  return l;
};
/* drawer (opens from the left) */
ui.drawer = o => {
  const l = layer('drawer' + (o.wide ? ' wide' : ''), h`<div class="drawer-h"><div class="tt"><h2 id="dt">${o.title}</h2>${o.sub ? h`<p>${o.sub}</p>` : ''}</div><button class="x-btn" data-close aria-label="إغلاق">${I('x')}</button></div>
    <div class="drawer-b"></div>${o.foot ? h`<div class="drawer-f">${o.foot}</div>` : ''}`, {onClose:o.onClose});
  l.el.setAttribute('aria-labelledby', 'dt');
  const body = l.el.querySelector('.drawer-b');
  l.set = html => { body.innerHTML = String(html); };
  if (typeof o.body === 'function') o.body(body, l); else l.set(o.body || '');
  if (o.bind) A.bind(l.el, Object.fromEntries(Object.entries(o.bind).map(([k, fn]) => [k, (el, e) => fn(l, el, e)])));
  setTimeout(() => l.el.querySelector('.x-btn').focus(), 30);
  return l;
};
/* popover menu */
ui.menu = (anchor, items, o = {}) => {
  closePops();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = String(h`${o.head ? h`<div class="menu-h"><b>${o.head.title}</b>${o.head.sub ? h`<small>${o.head.sub}</small>` : ''}</div>` : ''}${items.map((it, i) => it === '-' ? h`<div class="menu-sep"></div>`
    : h`<button class="menu-i ${it.tone || ''}" role="menuitem" data-i="${i}"${it.disabled ? A.raw(' disabled') : ''}>${it.icon ? I(it.icon) : ''}<span>${it.label}${it.sub ? h`<small>${it.sub}</small>` : ''}</span></button>`)}`);
  document.body.append(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = r.left; if (left + mw > innerWidth - 8) left = Math.max(8, r.right - mw); if (left < 8) left = 8;
  let top = r.bottom + 8; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 8);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  const close = () => { m.remove(); pops.delete(close); document.removeEventListener('mousedown', out, true); anchor.setAttribute('aria-expanded', 'false'); };
  const out = e => { if (!m.contains(e.target) && !anchor.contains(e.target)) close(); };
  setTimeout(() => document.addEventListener('mousedown', out, true));
  pops.add(close); anchor.setAttribute('aria-expanded', 'true');
  m.addEventListener('click', e => { const b = e.target.closest('.menu-i'); if (!b) return; close(); const it = items[+b.dataset.i]; if (it && it.run) it.run(); anchor.focus(); });
  m.addEventListener('keydown', e => { const bs = [...m.querySelectorAll('.menu-i:not([disabled])')]; const i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    if (e.key === 'Escape') { close(); anchor.focus(); } });
  const f = m.querySelector('.menu-i:not([disabled])'); if (f) f.focus();
  return {el:m, close};
};
/* toast */
ui.toast = (text, o = {}) => {
  const host = document.querySelector('.toasts'); if (!host) return;
  placeToasts();
  const t = document.createElement('div'); t.className = 'toast ' + (o.tone || 'ok'); t.setAttribute('role', 'status');
  t.innerHTML = String(h`${I(o.tone === 'no' ? 'alert' : 'checkCircle')}<span class="tt">${text}</span>${o.undo ? h`<button type="button">تراجع</button>` : ''}`);
  [...host.children].slice(0, -1).forEach(x => x.remove());   /* calm: at most two toasts at a time */
  host.append(t); requestAnimationFrame(() => t.classList.add('in'));
  const kill = () => { t.classList.remove('in'); setTimeout(() => t.remove(), 220); };
  const timer = setTimeout(kill, o.undo ? 8000 : 4000);
  if (o.undo) t.querySelector('button').onclick = () => { clearTimeout(timer); kill(); o.undo(); };
};

/* step-up: password + 6-digit code once, then trusted for 15 minutes */
const GRACE = 15 * 60e3; let stepAt = -Infinity;
A.secureFresh = () => A.now() - stepAt < GRACE;
A.secure = label => new Promise(res => {
  if (A.secureFresh()) return res(true);
  let done = false;
  const m = ui.modal({title:'تأكيد هويتك', text:(label ? '«' + label + '» إجراء حساس. ' : '') + 'أدخل كلمة المرور ورمز التحقق من تطبيق المصادقة. لن نسألك مرة أخرى لمدة ١٥ دقيقة.',
    body:ui.fields([{name:'pw', label:'كلمة المرور', type:'password', auto:'current-password'}, {name:'code', label:'رمز التحقق (٦ أرقام)', type:'code'}]),
    foot:h`<span class="sec-note">${I('lock', 's16')}نموذج للعرض: أي كلمة مرور وأي ٦ أرقام.</span><span class="sp"></span>${ui.btn({label:'إلغاء', tone:'ghost', a:'no'})}${ui.btn({label:'تأكيد', tone:'primary', a:'ok'})}`,
    onClose:() => { if (!done) res(false); },
    bind:{no:l => l.close(), ok:l => submit(l)}});
  const submit = l => { const v = ui.values(l.el); const code = A.norm(v.code).replace(/\D/g, '');
    fieldErr(l.el, 'pw', v.pw.length < 4 ? 'اكتب كلمة المرور.' : ''); fieldErr(l.el, 'code', code.length !== 6 ? 'الرمز ٦ أرقام.' : '');
    if (v.pw.length < 4 || code.length !== 6) return;
    stepAt = A.now(); done = true; A.log({action:'auth.stepup', summary:'تأكيد الهوية' + (label ? ' قبل «' + label + '»' : ''), quiet:true}); l.close(); res(true); };
  m.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(m); } });
});

/* confirm with reason (+ optional fields, typed word, step-up) */
ui.confirm = o => new Promise(res => {
  let done = false;
  const reason = o.reason === undefined ? true : o.reason;
  const fl = (o.fields || []).slice();
  if (o.typed) fl.push({name:'__typed', label:h`للتأكيد اكتب «${o.typed}»`});
  if (reason) fl.push({name:'reason', label:reason === 'optional' ? 'السبب (اختياري)' : 'السبب', type:'textarea', placeholder:o.reasonPh || 'يُكتب في السجل مع اسمك والوقت'});
  const m = ui.modal({title:o.title, text:o.text, size:o.size, body:fl.length || o.body ? h`${o.body || ''}${fl.length ? ui.fields(fl) : ''}` : null,
    foot:h`${o.secure ? h`<span class="sec-note">${I('lock', 's16')}يتطلّب تأكيد الهوية ويُسجَّل</span>` : reason ? h`<span class="sec-note">${I('file', 's16')}يُسجَّل في السجل</span>` : ''}<span class="sp"></span>${ui.btn({label:'إلغاء', tone:'ghost', a:'no'})}${ui.btn({label:o.confirmLabel || 'تأكيد', tone:o.tone === 'danger' ? 'dangerf' : 'primary', a:'ok'})}`,
    onClose:() => { if (!done) res(null); },
    bind:{no:l => l.close(), ok:l => {
      const v = ui.values(l.el); let bad = false;
      l.el.querySelectorAll('.modal-b .err').forEach(x => x.remove()); l.el.querySelectorAll('.modal-b .in.bad').forEach(x => x.classList.remove('bad'));
      if (reason === true && (v.reason || '').length < 3) { fieldErr(l.el, 'reason', 'اكتب السبب (٣ أحرف على الأقل).'); bad = true; }
      if (o.typed && A.norm(v.__typed) !== A.norm(o.typed)) { fieldErr(l.el, '__typed', 'اكتب الكلمة كما هي.'); bad = true; }
      fl.filter(f => f.required).forEach(f => { const x = v[f.name]; if (x === '' || x === undefined || (Array.isArray(x) && !x.length)) { fieldErr(l.el, f.name, f.requiredMsg || 'هذا الحقل مطلوب.'); bad = true; } });
      const err = o.validate ? o.validate(v) : ''; if (err) { const [name, msg] = Array.isArray(err) ? err : [fl[0] && fl[0].name, err]; fieldErr(l.el, name, msg); bad = true; }
      if (bad) return;
      delete v.__typed;
      const finish = () => { done = true; l.close(); res(v); };
      if (o.secure) A.secure(o.secure).then(ok => ok && finish()); else finish();
    }}});
  if (o.onOpen) o.onOpen(m.el);
});

/* toolbar: search + selects (state kept in memory per id) */
ui.toolbar = (host, o) => {
  const st = A.mem('tb:' + o.id, Object.fromEntries([['s', '']].concat((o.selects || []).map(s => [s.key, '']))));
  const active = () => (o.selects || []).some(s => st[s.key]) || st.s;
  const draw = () => {
    host.innerHTML = String(h`<div class="tb">
      ${o.search ? h`<label class="tb-s">${I('search', 's16')}<span class="sr">${o.search}</span><input type="search" value="${st.s}" placeholder="${o.search}" data-tb="s"></label>` : ''}
      ${(o.selects || []).map(s => h`<label class="sel${st[s.key] ? ' on' : ''}"><span class="sr">${s.label}</span><select data-tb="${s.key}"><option value="">${s.label}: الكل</option>${s.options.map(x => h`<option value="${x.v}"${String(x.v) === String(st[s.key]) ? A.raw(' selected') : ''}>${x.label}</option>`)}</select>${I('chevDown', 's16')}</label>`)}
      <div class="tb-r"><span class="tb-count"></span>${active() ? h`<button type="button" data-tb-clear>مسح الفلاتر</button>` : ''}${(o.actions || []).map((x, i) => ui.btn({label:x.label, icon:x.icon, sm:true, tone:x.tone || 'ghost', disabled:x.disabled, title:x.title, attrs:h`data-tb-act="${i}"`}))}</div></div>`);
    host.querySelectorAll('[data-tb-act]').forEach(b => b.onclick = () => o.actions[+b.dataset.tbAct].run());
    host.querySelectorAll('select[data-tb]').forEach(x => x.onchange = () => { st[x.dataset.tb] = x.value; draw(); o.onChange(st); });
    const s = host.querySelector('input[data-tb="s"]'); if (s) s.oninput = () => { st.s = s.value; const had = !!host.querySelector('[data-tb-clear]'); if (had !== !!active()) { const pos = s.selectionStart; draw(); const n = host.querySelector('input[data-tb="s"]'); n.focus(); n.setSelectionRange(pos, pos); } o.onChange(st); };
    const c = host.querySelector('[data-tb-clear]'); if (c) c.onclick = () => { Object.keys(st).forEach(k => st[k] = ''); draw(); o.onChange(st); };
  };
  draw();
  return {state:st, count:(shown, total) => { const c = host.querySelector('.tb-count'); if (c) c.textContent = shown === total ? A.n(total) + ' ' + (o.unit || 'نتيجة') : A.n(shown) + ' من ' + A.n(total); }};
};

/* table: sticky header, sorting, paging; phones get simple cards */
ui.table = (host, o) => {
  const st = A.mem('tbl:' + (o.id || 'x'), {key:o.sort ? o.sort.key : null, dir:o.sort ? o.sort.dir : 'asc', page:0});
  const cols = o.columns, size = o.pageSize || 25;
  const valOf = (c, r) => c.value ? c.value(r) : r[c.key];
  const draw = () => {
    let rows = (typeof o.rows === 'function' ? o.rows() : o.rows).slice();
    if (st.key) { const c = cols.find(x => x.key === st.key); if (c) { const d = st.dir === 'desc' ? -1 : 1;
      rows.sort((a, b) => { const x = valOf(c, a), y = valOf(c, b); if (x === y) return 0; if (x === null || x === undefined || x === '') return 1; if (y === null || y === undefined || y === '') return -1;
        return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'ar')) * d; }); } }
    const pages = Math.max(1, Math.ceil(rows.length / size)); if (st.page >= pages) st.page = pages - 1;
    const slice = rows.slice(st.page * size, st.page * size + size);
    const cell = (c, r) => c.render ? c.render(r) : (c.num ? A.n(valOf(c, r)) : valOf(c, r));
    let body;
    if (!rows.length) body = h`<div class="tbl-empty">${ui.empty(Object.assign({icon:'search', title:'لا نتائج', text:'غيّر البحث أو امسح الفلاتر.'}, o.empty || {}))}</div>`;
    else if (A.isPhone()) {
      /* card = {title(r), sub(r), side(r), skip:[keys]} or column flags phone:'title|sub|side|hide' */
      const cd = o.card, tc = cd ? null : (cols.find(c => c.phone === 'title') || cols[0]), sc = cd ? null : cols.find(c => c.phone === 'sub'), side = cd ? null : cols.find(c => c.phone === 'side');
      const T = r => cd ? cd.title(r) : cell(tc, r), S = r => cd ? (cd.sub ? cd.sub(r) : '') : (sc ? cell(sc, r) : ''), SD = r => cd ? (cd.side ? cd.side(r) : '') : (side ? cell(side, r) : '');
      const rest = cols.filter(c => c !== tc && c !== sc && c !== side && c.phone !== 'hide' && !(cd && (cd.skip || []).includes(c.key)));
      body = h`<div class="cards">${slice.map((r, i) => { const href = o.rowHref ? o.rowHref(r) : null; const tag = href ? 'a' : 'div';
        return h`<${A.raw(tag)} class="crd${o.onRow ? ' click' : ''}"${href ? h` href="${href}"` : ''} data-ri="${i}"${o.onRow ? A.raw(' tabindex="0" role="button"') : ''}>
          <div class="crd-h"><div class="tt"><b>${T(r)}</b>${S(r) ? h`<small>${S(r)}</small>` : ''}</div>${SD(r) ? h`<div class="crd-side">${SD(r)}</div>` : ''}</div>
          ${rest.length ? h`<div class="crd-kv">${rest.map(c => h`<div><span>${c.label}</span><em>${cell(c, r)}</em></div>`)}</div>` : ''}</${A.raw(tag)}>`; })}</div>`;
    } else {
      body = h`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => { const s = st.key === c.key; const sortable = c.sort !== false && (c.value || c.key);
        return h`<th scope="col" class="${c.num ? 'n' : ''}"${c.width ? h` style="width:${c.width}"` : ''}${s ? h` aria-sort="${st.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>${sortable ? h`<button type="button" data-sort="${c.key}">${c.label}${I(s ? (st.dir === 'asc' ? 'up' : 'down') : 'sort')}</button>` : c.label}</th>`; })}</tr></thead>
        <tbody>${slice.map((r, i) => h`<tr data-ri="${i}"${o.onRow || o.rowHref ? A.raw(' class="click"') : ''}${o.onRow ? A.raw(' tabindex="0"') : ''}>${cols.map((c, ci) => h`<td class="${c.num ? 'n' : ''}${c.nowrap ? ' nw' : ''}">${ci === 0 && o.rowHref ? h`<a href="${o.rowHref(r)}" class="row-lnk" tabindex="0" style="color:inherit">${cell(c, r)}</a>` : cell(c, r)}</td>`)}</tr>`)}</tbody></table></div>`;
    }
    host.innerHTML = String(h`${body}${rows.length > size ? h`<div class="tbl-pg"><span class="num">${A.n(st.page * size + 1)}–${A.n(Math.min(rows.length, st.page * size + size))} من ${A.n(rows.length)}</span>
      <span class="pgb">${ui.btn({icon:'chev', sm:true, tone:'secondary', a:'pgPrev', disabled:st.page === 0, aria:'السابق', attrs:'style="transform:scaleX(-1)"'})}${ui.btn({icon:'chev', sm:true, tone:'secondary', a:'pgNext', disabled:st.page >= pages - 1, aria:'التالي'})}</span></div>` : ''}`);
    host.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort; if (st.key === k) st.dir = st.dir === 'asc' ? 'desc' : 'asc'; else { st.key = k; st.dir = cols.find(c => c.key === k).num ? 'desc' : 'asc'; } st.page = 0; draw(); });
    const pp = host.querySelector('[data-a="pgPrev"]'), pn = host.querySelector('[data-a="pgNext"]');
    if (pp) pp.onclick = () => { st.page--; draw(); host.scrollIntoView({block:'start', behavior:'smooth'}); };
    if (pn) pn.onclick = () => { st.page++; draw(); host.scrollIntoView({block:'start', behavior:'smooth'}); };
    if (o.onRow || o.rowHref) host.querySelectorAll('[data-ri]').forEach(tr => {
      const r = slice[+tr.dataset.ri];
      tr.addEventListener('click', e => { if (e.target.closest('a,button,input,select')) return; if (o.onRow) o.onRow(r); else location.hash = o.rowHref(r); });
      if (o.onRow) tr.addEventListener('keydown', e => { if (e.target !== tr) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o.onRow(r); } });
    });
    if (o.after) o.after(host, slice);
    return rows.length;
  };
  return {draw, state:st, reset(){ st.page = 0; }};
};

/* ---------------- gifts: one place, so the profile, subscriptions, store sales and coin ledger all reflect them ---------------- */
const tell = (m, title, body) => { const n = {at:A.iso(), title, body, by:A.me().name, kind:'gift'}; (m.notifications = m.notifications || []).unshift(n); return n; };
const drop = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); };
A.grant = {
  /* plan for a duration (end = ISO); returns undo() */
  plan(m, planId, end, reason, label){
    const D = A.D, before = {plan:m.plan, planStart:m.planStart, planEnd:m.planEnd, autoRenew:m.autoRenew}, was = A.planOf(m.plan).name, name = A.planOf(planId).name;
    const prev = D.subscriptions.find(s => s.memberId === m.id && s.status === 'active');
    if (prev) prev.status = 'replaced';
    const sub = {id:'SUB-' + (9001 + D.subscriptions.length), memberId:m.id, plan:planId, start:A.iso(), end, status:'active', renew:false, source:'gift', reason, by:A.me().name};
    D.subscriptions.push(sub);
    Object.assign(m, {plan:planId, planStart:sub.start, planEnd:end, autoRenew:false});
    const n = tell(m, 'وصلتك هدية: ' + name, 'فُتحت لك «' + name + '» حتى ' + A.date(end) + '.');
    A.log({action:'member.gift.plan', target:m.id, targetLabel:m.name, summary:'إهداء «' + name + '»' + (label ? ' — ' + label : ''), reason, before:{الباقة:was}, after:{الباقة:name, حتى:A.date(end)}});
    return () => { Object.assign(m, before); drop(D.subscriptions, sub); if (prev) prev.status = 'active'; drop(m.notifications, n);
      A.log({action:'member.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن إهداء «' + name + '»', before:{الباقة:name}, after:{الباقة:was}}); };
  },
  /* store item: owned + a «هدية» row in the store sales; returns undo() */
  item(m, it, reason){
    const D = A.D; m.owned.push(it.id);
    const pu = {id:'PU-G' + (D.purchases.length + 1), memberId:m.id, item:it.id, price:0, at:A.iso(), gift:true, by:A.me().name, reason}; D.purchases.push(pu);
    const n = tell(m, 'وصلتك هدية: ' + it.name, 'أُضيف «' + it.name + '» إلى خزانتك.');
    A.log({action:'member.gift.item', target:m.id, targetLabel:m.name, summary:'إهداء «' + it.name + '» من المتجر', reason, after:{العنصر:it.name}});
    return () => { drop(m.owned, it.id); drop(D.purchases, pu); drop(m.notifications, n);
      A.log({action:'member.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن إهداء «' + it.name + '»'}); };
  },
  /* coins: balance + a ledger row «هدية من الإدارة»; returns undo() */
  coins(m, amount, reason){
    const amt = Math.round(amount), before = m.coins; m.coins += amt;
    const e = {id:'L-G' + (m.ledger.length + 1) + '-' + m.id, at:A.iso(), amount:amt, why:'هدية من الإدارة', balance:m.coins, by:A.me().name}; m.ledger.unshift(e);
    const n = tell(m, 'وصلتك هدية: ' + A.coins(amt), 'أُضيفت لرصيدك.');
    A.log({action:'member.gift.coins', target:m.id, targetLabel:m.name, summary:'إهداء ' + A.coins(amt), reason, before:{العملات:before}, after:{العملات:m.coins}});
    return () => { m.coins -= amt; drop(m.ledger, e); drop(m.notifications, n);
      A.log({action:'member.undo', target:m.id, targetLabel:m.name, summary:'تراجع عن إهداء ' + A.coins(amt), before:{العملات:m.coins + amt}, after:{العملات:m.coins}}); };
  }
};

/* ---------------- start ---------------- */
A.start = () => {
  root = document.getElementById('root');
  /* default search groups: pages + members (pages may add more with A.searchProvider) */
  A.searchProvider({id:'pages', label:'الصفحات', icon:'chev', max:4, find:qn => Object.values(NAV_ITEM).filter(it => A.can(it.id + '.view') && A.norm(it.title + ' ' + it.sectionLabel).includes(qn)).map(it => ({title:it.title, sub:it.sectionLabel, href:A.href(it.id), icon:it.icon}))});
  renderShell();
  started = true;
  window.addEventListener('hashchange', () => route());
  let ph = A.isPhone(); window.addEventListener('resize', () => { const p = A.isPhone(); if (p !== ph) { ph = p; route(true); } placeToasts(); });
  route();
};
})();

</script>

 [30, 'ST-1', 'staff.perms', null, 'تعديل صلاحيات سارة القحطاني', 'تحتاج الإهداء لتعويض المشتركين', {الإهداء:'مغلق'}, {الإهداء:'مفتوح'}],
 [50, 'ST-1', 'release.approve', null, 'اعتماد ونشر الإصدار 2.3.1', 'إصلاح الستريك', {الإصدار:'2.3.0'}, {الإصدار:'2.3.1'}],
 [80, 'ST-3', 'batch.import', null, 'اعتماد واستيراد الدفعة B-0008 (١٠٠ سؤال)', 'روجعت الاستثناءات كلها', null, null],
 [100, 'ST-1', 'settings.number', null, 'أسئلة مجانية يوميًا', 'تجربة رفع الحد', {القيمة:25}, {القيمة:30}],
 [130, 'ST-4', 'member.reset', mA(44), 'إعادة ضبط الدخول', 'لا يصله رمز الاستعادة', null, null]
].forEach(([h, actor, action, m, summary, reason, before, after], k) => {
  const s = staff.find(x => x.id === actor);
  audit.push({id:'AU-' + (8200 + k), at:ago(h), actor, actorName:s.name, action, target:m ? m.id : '', targetLabel:m ? m.name : '', summary, reason, before, after});
});
audit.sort((a, b) => b.at.localeCompare(a.at));

/* ---------- install ---------- */
A.D = {plans, addons, features, members, subscriptions, payments, purchases, reports, batches, questions, tree, units, lessons, books, studyPlan, daily,
  storeItems, coinRules, coupons, games, broadcasts:[], staff, meId:'ST-1', releases, switches, settings, audit};

/* ---------- helpers ---------- */
A.planOf = id => plans.find(p => p.id === id) || plans[0];
A.member = id => A.D.members.find(m => m.id === id);
A.featureLabel = id => (features.find(f => f.id === id) || {label:id}).label;
A.levelOf = xp => { const n = Math.floor(Math.sqrt(Math.max(0, xp) / 40)) + 1; const from = 40 * (n - 1) * (n - 1), to = 40 * n * n;
  const rank = LEVELS.filter(([l]) => n >= l).pop()[1]; return {n, rank, from, to, pct:Math.round((xp - from) / (to - from) * 100)}; };
/* status: banned > restricted > active (expired bans/restrictions are ignored) */
A.statusOf = m => {
  const now = A.now();
  if (m.ban && (m.ban.until === null || Date.parse(m.ban.until) > now)) { const left = m.ban.until === null ? null : A.left(m.ban.until);
    return {key:'banned', label:'محظور', tone:'no', detail:left === null ? 'نهائيًا' : 'متبقٍ ' + A.days(left), left}; }
  const act = (m.restrictions || []).filter(r => Date.parse(r.until) > now);
  if (act.length) { const left = Math.max(...act.map(r => A.left(r.until)));
    return {key:'restricted', label:'مقيّد', tone:'warn', detail:act.map(r => A.featureLabel(r.feature)).join('، '), left, active:act}; }
  return {key:'active', label:'نشط', tone:'ok', detail:''};
};
/* course progress per unit (lessons are completed in order) */
A.courseOf = m => {
  const owns = m.plan === 'course';
  let left = m.lessonsDone; let current = null;
  const per = units.map(u => { const ls = lessons.filter(l => l.unit === u.n); const done = Math.max(0, Math.min(ls.length, left)); left -= done;
    if (!current && done < ls.length && owns) current = ls[done]; return {unit:u, total:ls.length, done, pct:Math.round(done / ls.length * 100), current:done < ls.length && done > 0 ? ls[done] : null}; });
  return {owns, done:m.lessonsDone, total:lessons.length, pct:Math.round(m.lessonsDone / lessons.length * 100), units:per, current};
};
})();

</script>
<script data-part="page-bank.js">
/* بنك الأسئلة (#/bank) — tabs: الأسئلة · الدفعات · التصنيف. Question drawer: #/bank?q=<id> (any page can link to a question).
   Batch review page: #/batch?id=B-0009 — validation summary + the exceptions one by one (اقبل / صحّح / ارفض بسبب) → «اعتماد واستيراد» (secured).
   Import never publishes: imported questions arrive as مسودات. Publishing a question is its own secured action.
   Every change: permission → (reason) → A.secure where sensitive → change A.D → A.log → A.changed() → toast (undo where sensible). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const AD = '٠١٢٣٤٥٦٧٨٩';

/* ---------- math (v1.2/v1.3 subset) → Tahoma, LTR-isolated; digits Arabic-Indic for display only ---------- */
const SYM = {'\\times':'×', '\\div':'÷', '\\pi':'π', '\\cdot':'·', '\\le':'≤', '\\ge':'≥', '\\neq':'≠', '\\circ':'°', '\\%':'٪', '\\left':'', '\\right':'', '\\,':' ', '\\degree':'°'};
const atom = c => /[0-9]/.test(c) ? AD[c] : c === '-' ? '−' : c === '%' ? '٪' : A.esc(c);
function tex(s){
  let i = 0, out = '';
  const grp = () => { while (s[i] === ' ') i++;
    if (s[i] !== '{') return one();
    let d = 0, j = i; for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}' && --d === 0) break; }
    const x = s.slice(i + 1, j); i = j + 1; return tex(x); };
  const one = () => { if (s[i] === '\\') { const m = /^\\([a-zA-Z]+|.)/.exec(s.slice(i)) || ['\\']; i += m[0].length; return word(m[0]); } return atom(s[i++] || ''); };
  const word = w => {
    if (w === '\\frac') { const a = grp(), b = grp(); return `<span class="bk-fr"><span>${a}</span><span>${b}</span></span>`; }
    if (w === '\\sqrt') { const a = grp(); return `<span class="bk-sq">√<span>${a}</span></span>`; }
    return SYM[w] !== undefined ? SYM[w] : A.esc(w.slice(1)); };
  while (i < s.length) { const c = s[i];
    if (c === '^') { i++; out += `<sup>${grp()}</sup>`; } else if (c === '{') out += grp(); else out += one(); }
  return out;
}
const txt = s => A.esc(s).replace(/[0-9]/g, d => AD[d]).replace(/%/g, '٪');
const qh = s => A.raw(String(s == null ? '' : s).split(/\$([^$]*)\$/).map((x, k) => k % 2 ? `<span class="bk-m">${tex(x)}</span>` : txt(x)).join(''));
const plain = s => A.ar(String(s || '').replace(/\$([^$]*)\$/g, (m, x) => x.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '$1/$2')
  .replace(/\\sqrt\{([^}]*)\}/g, '√$1').replace(/\^\{([^}]*)\}/g, '^$1').replace(/\\times/g, '×').replace(/\\div/g, '÷').replace(/\\pi/g, 'π').replace(/[{}\\]/g, ''))).replace(/%/g, '٪');
const HINDI = /[٠-٩۰-۹]/;
const LETTERS = ['أ', 'ب', 'ج', 'د'];

/* ---------- taxonomy lookups ---------- */
let SK = null;
const skills = () => { if (SK) return SK; SK = {};
  D().tree.forEach(u => u.lessons.forEach(l => l.skills.forEach(s => { SK[s.id] = {skill:s, lesson:l, unit:u}; }))); return SK; };
const skillName = id => (skills()[id] || {skill:{name:id}}).skill.name;
const skillPath = id => { const x = skills()[id]; return x ? x.unit.name + ' › ' + x.lesson.name : ''; };
const skillOptions = () => Object.values(skills()).map(x => ({v:x.skill.id, label:x.lesson.name + ' — ' + x.skill.name}));

/* ---------- statuses ---------- */
const QS = {published:['منشور', 'ok'], review:['قيد المراجعة', 'info'], draft:['مسودة', '']};
const qChip = q => U.chip(QS[q.status][0], QS[q.status][1]);
const BS = {review:['بانتظار مراجعتك', 'warn'], preparing:['يُحضَّر', 'info'], imported:['استُوردت', 'ok']};
const KIND = {media:'شكل', answer:'مفتاح الإجابة', class:'تصنيف', math:'صيغة رياضية', dup:'تكرار محتمل'};
const DEC = {accept:['قُبل', 'ok'], fix:['صُحّح', 'info'], reject:['رُفض', 'no']};

/* ---------- extra demo data (added, never clobbered) ---------- */
(function seed(){
  const B = D().batches;
  if (!B.some(b => b.id === 'B-0007')) B.push(
    {id:'B-0007', name:'كتاب الفطن — النسبة والتناسب', receivedAt:A.addDays(null, -24), questions:100, exceptions:4, status:'imported', importedAt:A.addDays(null, -22), importedBy:'خالد العمري'},
    {id:'B-0006', name:'كتاب الفطن — المهارات الأساسية', receivedAt:A.addDays(null, -41), questions:100, exceptions:2, status:'imported', importedAt:A.addDays(null, -40), importedBy:'فهد الفطن'});
  /* the exceptions of B-0009 get their options, the answer key and the proposal that «اقبل» applies */
  const PROP = {
    7:{skill:'U5L03S01', options:['30 سم²', '60 سم²', '32.5 سم²', '65 سم²'], answer:0, figure:true, why:'الضلع الثالث 12 (مثلث 5–12–13)، والمساحة = $\\frac{1}{2}$ × 5 × 12 = 30', proposal:'يُستورد بعلامة «يحتاج شكلًا» ويظهر في محرر الأشكال.'},
    18:{skill:'U5L02S02', options:['44 سم', '22 سم', '154 سم', '14 سم'], answer:null, propAnswer:0, why:'المحيط = 2 × $\\frac{22}{7}$ × 7 = 44', proposal:'نعتمد الإجابة المحسوبة من المهارة: (أ) 44 سم.'},
    33:{skill:'U5L07S01', alt:'U5L02S01', options:['13.76 سم²', '50.24 سم²', '64 سم²', '36.48 سم²'], answer:0, figure:true, why:'غير المظلل = 64 − $\\frac{1}{4}$ × 3.14 × 64 = 13.76', proposal:'نعتمد التصنيف الأقرب: «المساحات المظللة».'},
    41:{skill:'U2L03S10', options:['7', '49', '24.5', '14'], answer:0, fixText:'إذا كان $س^{2}$ = 49 فما قيمة س الموجبة؟', why:'س = $\\sqrt{49}$ = 7', proposal:'نقرؤها أسًّا: $س^{2}$ = 49 (لا تُفسَّر تلقائيًا — قرارك).'},
    56:{skill:'U5L11S03', options:['120 سم³', '16 سم³', '240 سم³', '80 سم³'], answer:0, why:'الحجم = 8 × 5 × 3', proposal:'ليس مكررًا: يُستورد سؤالًا مستقلًا.'},
    88:{skill:'U5L09S01', options:['65°', '115°', '25°', '135°'], answer:1, figure:true, why:'الزاويتان متحالفتان: 180 − 65 = 115', proposal:'يُستورد بعلامة «يحتاج شكلًا» ويظهر في محرر الأشكال.'}
  };
  const b9 = B.find(b => b.id === 'B-0009');
  if (b9 && b9.items) b9.items.forEach(it => { if (it.options) return; Object.assign(it, PROP[it.n] || {options:['', '', '', ''], answer:null, proposal:'يُستورد كما هو.'});
    if (it.kind === 'dup') { const same = D().questions.find(q => A.norm(q.text) === A.norm(it.text)); if (same) { it.similar = same.id; it.issue = 'مكرر محتمل مع ' + same.id; } } });
})();

/* ---------- query-param drawer (#/bank?q=<id>): opens from links, closes back to the clean URL ---------- */
const quietQ = patch => { const nq = Object.assign({}, A.cur.q, patch); Object.keys(nq).forEach(k => (nq[k] === undefined || nq[k] === '') && delete nq[k]);
  history.replaceState(null, '', A.href(A.cur.id, nq)); A.cur.q = nq; };
let qd = null;   /* {id, l} — the open question drawer */
function syncDrawer(q){
  if (!q.q) { if (qd && !qd.l.closed) qd.l.close(); qd = null; return; }
  const item = D().questions.find(x => x.id === q.q);
  if (!item) { quietQ({q:undefined}); U.toast('لم نجد السؤال ' + q.q + '.', {tone:'no'}); return; }
  if (qd && qd.id === q.q && !qd.l.closed) { fillDrawer(qd.l, item); return; }
  if (qd && !qd.l.closed) qd.l.close();
  qd = {id:item.id, l:openDrawer(item)};
}
const showQ = item => { quietQ({q:item.id}); syncDrawer(A.cur.q); };

/* ---------- الأسئلة ---------- */
function filterQ(st){
  const n = A.norm(st.s);
  return D().questions.filter(q => (!st.status || q.status === st.status) && (!st.diff || q.difficulty === st.diff) && (!st.unit || q.unit === st.unit)
    && (!n || A.norm(q.id + ' ' + plain(q.text) + ' ' + q.text + ' ' + q.skill + ' ' + skillName(q.skill) + ' ' + q.batch).includes(n)));
}
const QCOLS = [
  {key:'id', label:'الرقم', render:q => h`<span class="bk-id">${A.id(q.id)}</span>`, width:'128px'},
  {key:'text', label:'السؤال', render:q => h`<span class="bk-ex q" title="${plain(q.text)}">${qh(q.text)}</span>`, value:q => plain(q.text)},
  {key:'skill', label:'المهارة', render:q => h`<span class="bk-sk">${skillName(q.skill)}</span>`, value:q => q.skill, width:'240px'},
  {key:'difficulty', label:'الصعوبة', value:q => ['سهل', 'متوسط', 'صعب'].indexOf(q.difficulty), render:q => h`<span class="nw">${q.difficulty}</span>`, width:'96px'},
  {key:'status', label:'الحالة', render:qChip, value:q => ['draft', 'review', 'published'].indexOf(q.status), width:'136px'},
  {key:'figure', label:'شكل', render:q => q.figure ? h`<span class="bk-fig" title="فيه شكل">${I('check', 's16')}<span class="sr">فيه شكل</span></span>` : h`<span class="mut">—</span>`, value:q => q.figure ? 1 : 0, width:'72px', phone:'hide'}
];
function questionsTab(el, q){
  el.innerHTML = '<section class="card bk-list"><div class="bk-tb"></div><div class="bk-tbl"></div></section>';
  let tbl;
  const tb = U.toolbar(el.querySelector('.bk-tb'), {id:'bank-q', unit:'سؤال', search:'ابحث برقم السؤال أو نصه أو المهارة أو الدفعة',
    selects:[{key:'status', label:'الحالة', options:Object.entries(QS).map(([v, [label]]) => ({v, label}))},
      {key:'diff', label:'الصعوبة', options:['سهل', 'متوسط', 'صعب'].map(v => ({v, label:v}))},
      {key:'unit', label:'الوحدة', options:D().tree.map(u => ({v:u.id, label:u.name}))}],
    onChange:() => { tbl.reset(); draw(); }});
  tbl = U.table(el.querySelector('.bk-tbl'), {id:'bank-q', columns:QCOLS, rows:() => filterQ(tb.state), onRow:showQ, sort:{key:'id', dir:'asc'},
    card:{title:r => h`<span class="q">${qh(r.text)}</span>`, sub:r => h`${A.id(r.id)} · ${skillName(r.skill)}${r.figure ? ' · فيه شكل' : ''}`, side:r => qChip(r), skip:['id', 'text', 'skill', 'status']},
    empty:{title:'لا يوجد سؤال بهذا البحث', text:'جرّب رقم السؤال (مثل 612) أو كلمة من نصه، أو امسح الفلاتر.'}});
  const draw = () => { tbl.draw(); tb.count(filterQ(tb.state).length, D().questions.length); };
  draw();
}

/* question drawer */
function openDrawer(item){
  return U.drawer({title:'السؤال ' + item.id, sub:skillPath(item.skill) || ' ', body:(body, l) => fillDrawer(l, item),
    onClose:() => { if (A.cur.q && A.cur.q.q === item.id) { quietQ({q:undefined}); A.changed(); } },
    bind:{edit:() => editQuestion(qById(item.id)), publish:() => setStatus(qById(item.id), 'published'), review:() => setStatus(qById(item.id), 'review'),
      draft:() => setStatus(qById(item.id), 'draft'), unpublish:() => setStatus(qById(item.id), 'draft', true)}});
}
const qById = id => D().questions.find(x => x.id === id);
function fillDrawer(l, item){
  const x = qById(item.id) || item;
  const p = l.el.querySelector('.drawer-h p'); if (p) p.innerHTML = String(h`${qChip(x)}<span>${skillPath(x.skill)}</span>`);
  const rate = x.attempts ? A.pct(x.correct) : '—';
  l.set(h`<div class="bk-q">
      <p class="bk-qt q">${qh(x.text)}</p>
      ${x.figure ? h`<div class="bk-figbox">${I('shapes')}<span>هذا السؤال فيه شكل.</span><a href="${A.href('figures', {q:x.id})}">افتحه في محرر الأشكال</a></div>` : ''}
      <ol class="bk-opts">${x.options.map((o, i) => h`<li class="${i === x.answer ? 'ok' : ''}"><span class="lt">${LETTERS[i]}</span><span class="ot q">${qh(o)}</span>${i === x.answer ? h`<span class="ck">${I('check', 's16')}الإجابة الصحيحة</span>` : ''}</li>`)}</ol>
      ${x.why ? h`<div class="bk-why"><span class="lb">الشرح</span><p class="q">${qh(x.why)}</p></div>` : ''}
    </div>
    ${U.kv([['المهارة', skillName(x.skill)], ['الصعوبة', x.difficulty], ['الدفعة', A.id(x.batch || '—')], ['الإصدار', A.n(x.version)],
      ['المحاولات', A.n(x.attempts)], ['نسبة الإجابة الصحيحة', rate], ['آخر تعديل', A.ago(x.updatedAt)]])}`);
  let f = l.el.querySelector('.drawer-f');
  if (!f) { f = document.createElement('div'); f.className = 'drawer-f'; l.el.append(f); }
  const can = A.can('bank.edit'), full = A.can('bank.full');
  f.innerHTML = String(h`${U.btn({label:'عدّل', icon:'edit', a:'edit', disabled:!can})}<span class="bk-sp"></span>
    ${x.status === 'draft' ? h`${U.btn({label:'أرسل للمراجعة', tone:'ghost', a:'review', disabled:!can})}${U.btn({label:'انشر', icon:'rocket', tone:'primary', a:'publish', disabled:!full})}` : ''}
    ${x.status === 'review' ? h`${U.btn({label:'أعده مسودة', tone:'ghost', a:'draft', disabled:!can})}${U.btn({label:'انشر', icon:'rocket', tone:'primary', a:'publish', disabled:!full})}` : ''}
    ${x.status === 'published' ? U.btn({label:'أوقف النشر', icon:'pause', tone:'danger', a:'unpublish', disabled:!full}) : ''}`);
}

function setStatus(x, to, unpublish){
  const from = x.status, label = QS[to][0];
  const apply = r => { x.status = to; x.updatedAt = A.iso();
    A.log({action:'question.status', target:x.id, targetLabel:x.id, summary:(to === 'published' ? 'نشر السؤال ' : unpublish ? 'إيقاف نشر السؤال ' : 'تغيير حالة السؤال ') + x.id,
      before:{الحالة:QS[from][0]}, after:{الحالة:label}, reason:r && r.reason});
    A.changed();
    U.toast(to === 'published' ? 'نُشر السؤال ويظهر للطلاب الآن.' : unpublish ? 'أُوقف نشر السؤال وعاد مسودة.' : 'صار السؤال «' + label + '».',
      {undo:() => { x.status = from; A.log({action:'question.status', target:x.id, targetLabel:x.id, summary:'تراجع عن تغيير حالة السؤال ' + x.id, before:{الحالة:label}, after:{الحالة:QS[from][0]}}); A.changed(); }}); };
  if (to === 'published') return U.confirm({title:'نشر السؤال ' + x.id, text:'سيظهر في البنك للطلاب فورًا.', reason:'optional', secure:'نشر سؤال', confirmLabel:'انشر'}).then(r => r && apply(r));
  if (unpublish) return U.confirm({title:'إيقاف نشر السؤال ' + x.id, text:'يختفي من البنك ويعود مسودة. محاولات الطلاب السابقة تبقى.', secure:'إيقاف نشر سؤال', confirmLabel:'أوقف النشر', tone:'danger'}).then(r => r && apply(r));
  apply(null);
}

/* edit / add a question (modal) */
function editQuestion(x){
  const isNew = !x;
  const v = x || {text:'', options:['', '', '', ''], answer:0, why:'', difficulty:'متوسط', skill:'U1L01S01', figure:false};
  const m = U.modal({title:isNew ? 'سؤال جديد' : 'تعديل السؤال ' + x.id, text:isNew ? 'يُحفظ مسودة؛ تنشره متى شئت.' : 'يُحفظ إصدارًا جديدًا (' + A.n(v.version + 1) + ').', size:'lg',
    body:h`${U.fields([{name:'text', label:'نص السؤال', type:'textarea', value:v.text, hint:h`الأرقام 0-9، والرياضيات بين $…$ مثل <bdi class="ltr">$\\frac{3}{4}$</bdi>`},
      [{name:'o0', label:'الخيار أ', value:v.options[0]}, {name:'o1', label:'الخيار ب', value:v.options[1]}],
      [{name:'o2', label:'الخيار ج', value:v.options[2]}, {name:'o3', label:'الخيار د', value:v.options[3]}],
      {name:'answer', label:'الإجابة الصحيحة', type:'seg', value:String(v.answer), options:LETTERS.map((t, i) => ({v:String(i), label:t}))},
      {name:'why', label:'الشرح', type:'textarea', value:v.why},
      [{name:'skill', label:'المهارة', type:'select', value:v.skill, options:skillOptions()}, {name:'difficulty', label:'الصعوبة', type:'seg', value:v.difficulty, options:['سهل', 'متوسط', 'صعب'].map(t => ({v:t, label:t}))}],
      {name:'figure', label:'فيه شكل (يُرسم في محرر الأشكال)', type:'toggle', value:v.figure}])}`,
    foot:h`<span class="sp"></span>${U.btn({label:'إلغاء', tone:'ghost', a:'no'})}${U.btn({label:isNew ? 'احفظ مسودة' : 'احفظ', tone:'primary', a:'ok'})}`,
    bind:{no:l => l.close(), ok:l => {
      const f = U.values(l.el); const opts = [f.o0, f.o1, f.o2, f.o3];
      const bad = (name, msg) => { const fl = l.el.querySelector(`[data-fld="${name}"]`); if (!fl) return; let e = fl.querySelector('.err'); if (!e) { e = document.createElement('span'); e.className = 'err'; fl.append(e); } e.textContent = msg; };
      l.el.querySelectorAll('.err').forEach(e => e.remove());
      let err = false;
      if (f.text.length < 5) { bad('text', 'اكتب نص السؤال.'); err = true; }
      else if (HINDI.test(f.text)) { bad('text', 'الأرقام في البيانات غربية (0-9)؛ التحويل يحدث عند العرض.'); err = true; }
      opts.forEach((o, i) => { if (!o) { bad('o' + i, 'اكتب الخيار.'); err = true; } else if (HINDI.test(o)) { bad('o' + i, 'استخدم 0-9.'); err = true; } });
      if (err) return;
      if (isNew) {
        const nq = {id:nextId(), skill:f.skill, unit:f.skill.slice(0, 2), lesson:f.skill.slice(0, 5), text:f.text, options:opts, answer:+f.answer, why:f.why, difficulty:f.difficulty,
          status:'draft', figure:f.figure, batch:'', attempts:0, correct:0, version:1, updatedAt:A.iso()};
        D().questions.push(nq);
        A.log({action:'question.create', target:nq.id, targetLabel:nq.id, summary:'إضافة سؤال جديد ' + nq.id + ' (مسودة)'});
        l.close(); A.changed();
        U.toast('أُضيف السؤال ' + nq.id + ' مسودة.', {undo:() => { D().questions.splice(D().questions.indexOf(nq), 1); A.log({action:'question.delete', target:nq.id, summary:'تراجع عن إضافة ' + nq.id}); A.changed(); }});
        return;
      }
      const before = JSON.parse(JSON.stringify(x));
      const diff = {}; const b = {}, a = {};
      if (before.text !== f.text) { b.النص = plain(before.text).slice(0, 40); a.النص = plain(f.text).slice(0, 40); }
      if (before.answer !== +f.answer) { b.الإجابة = LETTERS[before.answer]; a.الإجابة = LETTERS[+f.answer]; }
      if (before.skill !== f.skill) { b.المهارة = skillName(before.skill); a.المهارة = skillName(f.skill); }
      if (before.difficulty !== f.difficulty) { b.الصعوبة = before.difficulty; a.الصعوبة = f.difficulty; }
      if (before.options.join('|') !== opts.join('|')) { b.الخيارات = 'قبل'; a.الخيارات = 'بعد'; }
      Object.assign(diff, b);
      if (!Object.keys(diff).length && before.why === f.why && before.figure === f.figure) { l.close(); return U.toast('لا تغيير.'); }
      Object.assign(x, {text:f.text, options:opts, answer:+f.answer, why:f.why, skill:f.skill, unit:f.skill.slice(0, 2), lesson:f.skill.slice(0, 5), difficulty:f.difficulty, figure:f.figure, version:x.version + 1, updatedAt:A.iso()});
      A.log({action:'question.edit', target:x.id, targetLabel:x.id, summary:'تعديل السؤال ' + x.id + ' (الإصدار ' + A.n(x.version) + ')', before:b, after:a});
      l.close(); A.changed();
      U.toast('حُفظ السؤال ' + x.id + '.', {undo:() => { Object.assign(x, before); A.log({action:'question.edit', target:x.id, summary:'تراجع عن تعديل ' + x.id}); A.changed(); }});
    }}});
  return m;
}

/* synthetic drafts for the questions that passed every check (geometry, unit 5) */
function drafts(b){
  let seed = 9001; const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; const ri = (a, z) => a + Math.floor(r() * (z - a + 1));
  const T = [
    () => { const a = ri(3, 15); return ['U5L01S01', `مربع طول ضلعه ${a} سم، فما مساحته؟`, a * a, [4 * a, 2 * a, a * a + a], 'سم²', `المساحة = ${a} × ${a}`]; },
    () => { const a = ri(6, 20), w = ri(2, a - 1); return ['U5L01S06', `مستطيل طوله ${a} سم وعرضه ${w} سم، فما محيطه؟`, 2 * (a + w), [a * w, a + w, 4 * a], 'سم', `المحيط = 2 × (${a} + ${w})`]; },
    () => { const a = ri(4, 18), w = ri(2, 9); return ['U5L01S05', `مستطيل طوله ${a} سم وعرضه ${w} سم، فما مساحته؟`, a * w, [2 * (a + w), a + w, a * w * 2], 'سم²', `المساحة = ${a} × ${w}`]; },
    () => { const k = ri(1, 3), rr = 7 * k; return ['U5L02S01', `دائرة نصف قطرها ${rr} سم، فما مساحتها؟ (ط = $\\frac{22}{7}$)`, 22 * 7 * k * k, [44 * k, 22 * k, 11 * 7 * k * k], 'سم²', `المساحة = $\\frac{22}{7}$ × ${rr} × ${rr}`]; },
    () => { const a = 2 * ri(2, 9), hh = ri(3, 12); return ['U5L03S01', `مثلث طول قاعدته ${a} سم وارتفاعه ${hh} سم، فما مساحته؟`, a * hh / 2, [a * hh, a + hh, a * hh / 2 + hh], 'سم²', `المساحة = $\\frac{1}{2}$ × ${a} × ${hh}`]; },
    () => { const a = ri(30, 80), c = ri(20, 70); return ['U5L08S03', `في مثلث، قياس زاويتين منه ${a}° و${c}°، فما قياس الزاوية الثالثة؟`, 180 - a - c, [180 - a, 90 - c > 0 ? 90 - c + a : a + c, 360 - a - c], '°', `180 − ${a} − ${c}`]; },
    () => { const a = ri(2, 9); return ['U5L11S01', `مكعب طول حرفه ${a} سم، فما حجمه؟`, a * a * a, [3 * a, a * a, 6 * a * a], 'سم³', `الحجم = ${a} × ${a} × ${a}`]; }
  ];
  const skip = new Set(b.items.map(it => it.n)); const out = [];
  for (let n = 1; n <= b.questions; n++) { if (skip.has(n)) continue;
    const [skill, text, ans, wrong, unit, why] = T[n % T.length]();
    const opts = [ans].concat([...new Set(wrong.filter(w => w !== ans))]); while (opts.length < 4) opts.push(ans + opts.length * 3);
    const order = [0, 1, 2, 3].sort(() => r() - .5); const options = order.map(i => opts[i] + (unit === '°' ? '°' : ' ' + unit));
    out.push({skill, text, options, answer:order.indexOf(0), why, figure:false}); }
  b.items.filter(it => it.decision !== 'reject').forEach(it => { const v = it.decision === 'fix' ? it.fixed : {text:it.fixText || it.text, options:it.options, answer:it.answer === null ? it.propAnswer : it.answer, skill:it.skill, figure:!!it.figure};
    out.push({skill:v.skill, text:v.text, options:v.options, answer:v.answer, why:it.why || '', figure:!!v.figure}); });
  return out;
}
function importBatch(b){
  if (pending(b)) return U.toast('راجع كل الاستثناءات أولًا.', {tone:'no'});
  const list = drafts(b), rejected = b.items.filter(it => it.decision === 'reject').length;
  U.confirm({title:'اعتماد واستيراد ' + b.id, text:'سيدخل ' + A.n(list.length) + ' سؤالًا البنك مسودات' + (rejected ? ' (ورُفض ' + A.n(rejected) + ')' : '') + '. الاستيراد لا ينشر شيئًا؛ تنشر الأسئلة بنفسك من البنك.',
    secure:'اعتماد واستيراد دفعة', confirmLabel:'اعتمد واستورد', reasonPh:'مثلًا: روجعت الاستثناءات كلها'}).then(r => {
    if (!r) return;
    const base = Math.max(600, ...D().questions.map(q => +q.id.slice(2)));
    const added = list.map((x, k) => ({id:'Q-' + String(base + k + 1).padStart(6, '0'), skill:x.skill, unit:x.skill.slice(0, 2), lesson:x.skill.slice(0, 5), text:x.text, options:x.options.map(String),
      answer:x.answer, why:x.why, difficulty:['سهل', 'متوسط', 'صعب'][k % 3], status:'draft', figure:x.figure, batch:b.id, attempts:0, correct:0, version:1, updatedAt:A.iso()}));
    D().questions.push(...added);
    Object.assign(b, {status:'imported', importedAt:A.iso(), importedBy:A.me().name, imported:added.length});
    A.log({action:'batch.import', target:b.id, targetLabel:b.id, summary:'اعتماد واستيراد الدفعة ' + b.id + ' (' + A.n(added.length) + ' سؤال مسودة)', before:{الحالة:'بانتظار المراجعة'}, after:{الحالة:'استُوردت'}, reason:r.reason});
    A.changed();
    U.toast('دخل ' + A.n(added.length) + ' سؤالًا البنك مسودات.', {undo:() => {
      added.forEach(q => { const i = D().questions.indexOf(q); if (i >= 0) D().questions.splice(i, 1); });
      b.status = 'review'; delete b.importedAt; delete b.importedBy; delete b.imported;
      A.log({action:'batch.import', target:b.id, targetLabel:b.id, summary:'تراجع عن استيراد الدفعة ' + b.id, before:{الحالة:'استُوردت'}, after:{الحالة:'بانتظار المراجعة'}}); A.changed(); }});
  });
}

/* ---------- global search: questions by number or text ---------- */
A.searchProvider({id:'questions', label:'الأسئلة', icon:'bank', max:4, find:(qn, raw) => { const d = qn.replace(/\D/g, '');
  return D().questions.filter(q => (d.length >= 3 && q.id.includes(d)) || (qn.length >= 3 && A.norm(plain(q.text)).includes(qn))).slice(0, 4)
    .map(q => ({title:plain(q.text).slice(0, 60), sub:q.id + ' · ' + skillName(q.skill), href:A.href('bank', {q:q.id}), icon:'bank'})); }});
})();

</script>
<script data-part="page-course.js">
/* دورة الفطن (#/course) — tabs: الوحدات والدروس · الكتب · الخطة · تحدّي اليوم.
   Every edit goes to a DRAFT copy of the course; a quiet bar «تغييرات غير منشورة (N)» offers «تجاهل» and «انشر» (secured, logged).
   Lesson drawer: #/course?lesson=<id> (title, kind, visibility, clips: title, «دورة» video link, minutes, PDF, order, visibility, add/delete).
   Students see nothing until «انشر»; publishing writes A.D.units/lessons/books/studyPlan/daily in place (A.courseOf stays in sync). */
(function(){
'use strict';
const h = A.h, I = A.icon, U = A.ui, D = () => A.D;
const AD = '٠١٢٣٤٥٦٧٨٩';

/* ---------- question text (math → Tahoma, LTR-isolated) ---------- */
const SYM = {'\\times':'×', '\\div':'÷', '\\pi':'π', '\\cdot':'·', '\\circ':'°', '\\%':'٪', '\\left':'', '\\right':'', '\\,':' '};
const atom = c => /[0-9]/.test(c) ? AD[c] : c === '-' ? '−' : c === '%' ? '٪' : A.esc(c);
function tex(s){
  let i = 0, out = '';
  const grp = () => { while (s[i] === ' ') i++; if (s[i] !== '{') return one();
    let d = 0, j = i; for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}' && --d === 0) break; }
    const x = s.slice(i + 1, j); i = j + 1; return tex(x); };
  const one = () => { if (s[i] === '\\') { const m = /^\\([a-zA-Z]+|.)/.exec(s.slice(i)) || ['\\']; i += m[0].length; return word(m[0]); } return atom(s[i++] || ''); };
  const word = w => { if (w === '\\frac') { const a = grp(), b = grp(); return `<span class="cr-fr"><span>${a}</span><span>${b}</span></span>`; }
    if (w === '\\sqrt') { const a = grp(); return `<span class="cr-sq">√<span>${a}</span></span>`; }
    return SYM[w] !== undefined ? SYM[w] : A.esc(w.slice(1)); };
  while (i < s.length) { const c = s[i]; if (c === '^') { i++; out += `<sup>${grp()}</sup>`; } else if (c === '{') out += grp(); else out += one(); }
  return out;
}
const qh = s => A.raw(String(s == null ? '' : s).split(/\$([^$]*)\$/).map((x, k) => k % 2 ? `<span class="cr-m">${tex(x)}</span>` : A.esc(x).replace(/[0-9]/g, d => AD[d]).replace(/%/g, '٪')).join(''));
const plain = s => A.ar(String(s || '').replace(/\$([^$]*)\$/g, (m, x) => x.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '$1/$2').replace(/\\sqrt\{([^}]*)\}/g, '√$1')
  .replace(/\^\{([^}]*)\}/g, '^$1').replace(/\\times/g, '×').replace(/\\div/g, '÷').replace(/[{}\\]/g, ''))).replace(/%/g, '٪');
const LETTERS = ['أ', 'ب', 'ج', 'د'];

/* ---------- draft ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const S = {draft:null, changes:[]};
const W = () => S.draft || (S.draft = clone({units:D().units, lessons:D().lessons, books:D().books, studyPlan:D().studyPlan, daily:D().daily}));
const can = () => A.can('course.edit');
function change(text, fn){
  if (!can()) { U.toast('لا تملك صلاحية تعديل الدورة.', {tone:'no'}); return null; }
  const snap = {draft:clone(W()), changes:S.changes.slice()};
  fn(W()); S.changes.push(text); A.changed(); return snap;
}
const restore = snap => { S.draft = snap.draft; S.changes = snap.changes; A.changed(); };
let seq = 0; const nid = p => p + '-n' + Date.now().toString(36) + (++seq);

/* ---------- helpers ---------- */
const KIND = {r:'درس', i:'تعريف', f:'ملف', c:'حل تجميعات', m:'حل نموذج'};
const unitLessons = (d, n) => d.lessons.filter(l => l.unit === n).sort((a, b) => a.ord - b.ord);
const mins = l => l.clips.reduce((a, c) => a + (+c.min || 0), 0);
const plural = (n, one, few, many) => A.n(n) + ' ' + (n === 1 ? one : n <= 10 ? few : many);
const clipsTxt = n => n === 1 ? 'مقطع واحد' : n === 2 ? 'مقطعان' : plural(n, 'مقطع', 'مقاطع', 'مقطعًا');
const minTxt = n => n === 0 ? '' : n === 1 ? 'دقيقة' : n === 2 ? 'دقيقتان' : plural(n, 'دقيقة', 'دقائق', 'دقيقة');
const lessonById = id => W().lessons.find(l => l.id === id);
const qById = id => D().questions.find(q => q.id === id);
const skillName = id => { for (const u of D().tree) for (const l of u.lessons) for (const s of l.skills) if (s.id === id) return s.name; return id; };
const quietQ = patch => { const nq = Object.assign({}, A.cur.q, patch); Object.keys(nq).forEach(k => (nq[k] === undefined || nq[k] === '') && delete nq[k]);
  history.replaceState(null, '', A.href(A.cur.id, nq)); A.cur.q = nq; };
const swap = (arr, i, j) => { if (j < 0 || j >= arr.length) return false; const t = arr[i].ord; arr[i].ord = arr[j].ord; arr[j].ord = t; return true; };

/* ---------- page ---------- */
const TABS = [{id:'units', label:'الوحدات والدروس'}, {id:'books', label:'الكتب'}, {id:'plan', label:'الخطة'}, {id:'daily', label:'تحدّي اليوم'}];
A.page('course', {
  title:'دورة الفطن',
  sub:'كل تفاصيل الدورة. تعديلاتك تبقى مسودة حتى تنشرها.',
  tabs:TABS,
  primary:q => (!q.tab || q.tab === 'units') && can() ? {label:'أضف درسًا', icon:'plus', tone:'secondary', run:() => addLesson(null)} : null,
  render(el, q, ctx){
    const host = document.createElement('div'); el.append(host);
    ({units:unitsTab, books:booksTab, plan:planTab, daily:dailyTab})[ctx.tab](host, q);
    if (S.changes.length) el.append(bar());
    syncLesson(q);
  }
});

/* unpublished-changes bar */
function bar(){

  b.innerHTML = String(h`<span class="dot"></span><button type="button" class="cr-bar-t" data-a="list">تغييرات غير منشورة (${A.n(n)})</button><span class="sp"></span>
    ${U.btn({label:'تجاهل', tone:'ghost', sm:true, a:'discard'})}${U.btn({label:'انشر', icon:'rocket', tone:'primary', sm:true, a:'publish', disabled:!A.can('course.full')})}`);
  const list = () => h`<ol class="cr-chg">${S.changes.map(c => h`<li>${c}</li>`)}</ol>`;
  A.bind(b, {
    list:() => U.modal({title:'تغييرات غير منشورة', text:'لا يراها الطلاب حتى تنشرها.', body:list(), foot:h`<span class="sp"></span>${U.btn({label:'إغلاق', tone:'ghost', a:'x'})}`, bind:{x:l => l.close()}}),
    discard:() => U.confirm({title:'تجاهل التغييرات؟', text:'تُلغى ' + plural(n, 'تغيير', 'تغييرات', 'تغييرًا') + ' وتعود الدورة كما هي منشورة.', body:list(), reason:false, tone:'danger', confirmLabel:'تجاهلها'}).then(r => {
      if (!r) return; const snap = {draft:S.draft, changes:S.changes};
      A.log({action:'course.discard', summary:'تجاهل ' + plural(n, 'تغيير', 'تغييرات', 'تغييرًا') + ' غير منشورة على دورة الفطن'});
      S.draft = null; S.changes = []; A.changed();
      U.toast('أُلغيت التغييرات.', {undo:() => { S.draft = snap.draft; S.changes = snap.changes; A.changed(); }}); }),
    publish:() => U.confirm({title:'نشر تغييرات الدورة', text:'يراها الطلاب فورًا (' + plural(n, 'تغيير', 'تغييرات', 'تغييرًا') + ').', body:list(), reason:'optional', secure:'نشر تغييرات الدورة', confirmLabel:'انشر الآن'}).then(r => {
      if (!r) return; const d = W();
      ['units', 'lessons', 'books', 'studyPlan'].forEach(k => { const arr = D()[k]; arr.splice(0, arr.length, ...clone(d[k])); });
      Object.keys(D().daily).forEach(k => delete D().daily[k]); Object.assign(D().daily, clone(d.daily));
      const shown = S.changes.slice(0, 6).join('؛ ') + (n > 6 ? '؛ و' + plural(n - 6, 'تغيير آخر', 'تغييرات أخرى', 'تغييرًا آخر') : '');
      A.log({action:'course.publish', summary:'نشر ' + plural(n, 'تغيير', 'تغييرات', 'تغييرًا') + ' على دورة الفطن', after:{التغييرات:shown}, reason:r.reason || ''});
      S.draft = null; S.changes = []; A.changed(); U.toast('نُشرت التغييرات ويراها الطلاب الآن.'); })
  });
  return b;
}

/* ---------- الوحدات والدروس ---------- */
function unitsTab(el){
  const d = W(), open = A.mem('cr:open', {1:true});
  el.innerHTML = String(h`<section class="card cr-units">${d.units.slice().sort((a, b) => a.n - b.n).map(u => { const ls = unitLessons(d, u.n), on = !!open[u.n];
    const total = ls.reduce((a, l) => a + mins(l), 0);
    return h`<div class="cr-u${on ? ' open' : ''}${u.visible ? '' : ' off'}">
      <div class="cr-uh">
        <button type="button" class="cr-ut" data-a="unit" data-u="${u.n}" aria-expanded="${on}"><span class="ch">${I('chevDown', 's16')}</span><span class="tt"><b>${u.title}</b><small>${u.sub}</small></span></button>
        <span class="cr-um">${plural(ls.length, 'درس', 'دروس', 'درسًا')} · ${minTxt(total)}</span>
        ${u.visible ? '' : U.chip('مخفية')}
        <label class="sw" title="${u.visible ? 'ظاهرة للطلاب' : 'مخفية عن الطلاب'}"><input type="checkbox" data-vu="${u.n}"${u.visible ? A.raw(' checked') : ''}${can() ? '' : A.raw(' disabled')}><i></i><span class="sr">${u.title}: ظاهرة للطلاب</span></label>
      </div>
      ${on ? h`<ol class="cr-ls">${ls.map((l, k) => h`<li class="cr-l${l.visible ? '' : ' off'}">
          <span class="cr-ord">${U.btn({icon:'up', sm:true, tone:'ghost', a:'lup', aria:'انقل لأعلى', disabled:k === 0 || !can(), attrs:h`data-l="${l.id}"`})}${U.btn({icon:'down', sm:true, tone:'ghost', a:'ldown', aria:'انقل لأسفل', disabled:k === ls.length - 1 || !can(), attrs:h`data-l="${l.id}"`})}</span>
          <button type="button" class="cr-lt" data-a="lesson" data-l="${l.id}"><b>${l.title}</b><small>${KIND[l.kind]} · ${clipsTxt(l.clips.length)}${mins(l) ? ' · ' + minTxt(mins(l)) : ''}${l.visible ? '' : ' · مخفي'}</small></button>
          <label class="sw" title="${l.visible ? 'ظاهر للطلاب' : 'مخفي عن الطلاب'}"><input type="checkbox" data-vl="${l.id}"${l.visible ? A.raw(' checked') : ''}${can() ? '' : A.raw(' disabled')}><i></i><span class="sr">${l.title}: ظاهر للطلاب</span></label>
          ${U.btn({icon:'more', tone:'ghost', a:'lmore', aria:'خيارات الدرس', attrs:h`data-l="${l.id}" aria-haspopup="menu"`})}
        </li>`)}</ol>
        ${ls.length ? '' : h`<p class="cr-none">لا دروس في هذه الوحدة بعد.</p>`}
        <div class="cr-add">${U.btn({label:'أضف درسًا', icon:'plus', tone:'ghost', sm:true, a:'addL', attrs:h`data-u="${u.n}"`, disabled:!can()})}</div>` : ''}
    </div>`; })}</section>`);
  const move = (id, dir) => { const l = lessonById(id); change((dir < 0 ? 'رفع' : 'إنزال') + ' ترتيب الدرس «' + l.title + '»', dd => { const arr = unitLessons(dd, l.unit); const i = arr.findIndex(x => x.id === id); swap(arr, i, i + dir); }); };
  A.bind(el, {
    unit:b => { open[b.dataset.u] = !open[b.dataset.u]; A.changed(); },
    lesson:b => openLesson(b.dataset.l),
    lup:b => move(b.dataset.l, -1), ldown:b => move(b.dataset.l, 1),
    addL:b => addLesson(+b.dataset.u),
    lmore:b => { const l = lessonById(b.dataset.l); const arr = unitLessons(W(), l.unit), k = arr.indexOf(l);

        {label:'انقل لأعلى', icon:'up', run:() => move(l.id, -1), disabled:k === 0 || !can()}, {label:'انقل لأسفل', icon:'down', run:() => move(l.id, 1), disabled:k === arr.length - 1 || !can()},
        '-', {label:'احذف الدرس', icon:'trash', tone:'danger', run:() => delLesson(l.id), disabled:!can()}]); }
  });
  el.addEventListener('change', e => { const t = e.target;
    if (t.dataset.vu !== undefined) { const u = W().units.find(x => x.n === +t.dataset.vu); const v = t.checked;
      if (!change((v ? 'إظهار ' : 'إخفاء ') + u.title, dd => { dd.units.find(x => x.n === u.n).visible = v; })) t.checked = !v; }
    if (t.dataset.vl) { const l = lessonById(t.dataset.vl); const v = t.checked;
      if (!change((v ? 'إظهار الدرس «' : 'إخفاء الدرس «') + l.title + '»', dd => { dd.lessons.find(x => x.id === l.id).visible = v; })) t.checked = !v; }
  });
}

function addLesson(unitN){
  const d = W();
  U.modal({title:'درس جديد', text:'يُضاف في آخر الوحدة، ويبقى مسودة حتى تنشر.',
    body:U.fields([{name:'unit', label:'الوحدة', type:'select', value:unitN === null ? 1 : unitN, options:d.units.map(u => ({v:u.n, label:u.title + ' — ' + u.sub}))},
      {name:'title', label:'عنوان الدرس', placeholder:'مثلًا: درس الأسس'}, {name:'kind', label:'النوع', type:'select', value:'r', options:Object.entries(KIND).map(([v, label]) => ({v, label}))}]),
    foot:h`<span class="sp"></span>${U.btn({label:'إلغاء', tone:'ghost', a:'no'})}${U.btn({label:'أضف', tone:'primary', a:'ok'})}`,
    bind:{no:l => l.close(), ok:l => { const v = U.values(l.el);
      if (v.title.length < 3) { const f = l.el.querySelector('[data-fld="title"]'); if (!f.querySelector('.err')) f.insertAdjacentHTML('beforeend', '<span class="err">اكتب عنوان الدرس.</span>'); return; }
      const n = +v.unit, id = nid('LS'); const ord = Math.max(-1, ...unitLessons(d, n).map(x => x.ord)) + 1;
      l.close();
      const snap = change('إضافة الدرس «' + v.title + '»', dd => dd.lessons.push({id, unit:n, ord, title:v.title, kind:v.kind, kindLabel:KIND[v.kind], clips:[], clipsTotal:0, visible:true}));
      if (!snap) return;
      A.mem('cr:open', {1:true})[n] = true;
      U.toast('أُضيف الدرس. أضف مقاطعه الآن.', {undo:() => restore(snap)});
      openLesson(id); }}});
}
function delLesson(id){
  const l = lessonById(id);
  U.confirm({title:'حذف الدرس «' + l.title + '»', text:'يُحذف مع ' + clipsTxt(l.clips.length) + '. لا يتأثر الطلاب حتى تنشر.', reason:false, tone:'danger', confirmLabel:'احذف'}).then(r => {
    if (!r) return;
    if (qd && !qd.l.closed && qd.id === id) qd.l.close();
    const snap = change('حذف الدرس «' + l.title + '»', dd => { dd.lessons = dd.lessons.filter(x => x.id !== id); unitLessons(dd, l.unit).forEach((x, k) => { x.ord = k; }); });
    if (snap) U.toast('حُذف الدرس.', {undo:() => restore(snap)});
  });
}

/* lesson drawer (#/course?lesson=<id>) */
let qd = null;
const openLesson = id => { quietQ({lesson:id}); syncLesson(A.cur.q); };
function syncLesson(q){
  if (!q.lesson) { if (qd && !qd.l.closed) qd.l.close(); qd = null; return; }
  const l = lessonById(q.lesson);
  if (!l) { if (qd && !qd.l.closed) qd.l.close(); qd = null; quietQ({lesson:undefined}); return; }
  if (qd && qd.id === l.id && !qd.l.closed) { fillLesson(qd.l, l); return; }
  if (qd && !qd.l.closed) qd.l.close();
  const dr = U.drawer({title:l.title, sub:' ', foot:h`${U.btn({label:'احذف الدرس', icon:'trash', tone:'danger', a:'del', disabled:!can()})}<span class="cr-sp"></span>${U.btn({label:'تم', tone:'ghost', a:'done'})}`,
    onClose:() => { if (A.cur.q && A.cur.q.lesson === l.id) { quietQ({lesson:undefined}); A.changed(); } }});
  qd = {id:l.id, l:dr};
  bindLesson(dr, l.id);
  fillLesson(dr, l);
}
function fillLesson(dr, l){
  const u = W().units.find(x => x.n === l.unit);
  dr.el.querySelector('#dt').textContent = l.title;
  dr.el.querySelector('.drawer-h p').textContent = (u ? u.title + ' · ' : '') + KIND[l.kind] + ' · ' + clipsTxt(l.clips.length) + (mins(l) ? ' · ' + minTxt(mins(l)) : '');
  const cs = l.clips;
  dr.set(h`<section class="cr-sec">
      <h3>بيانات الدرس</h3>
      ${U.fields([{name:'title', label:'العنوان', value:l.title}, [{name:'kind', label:'النوع', type:'select', value:l.kind, options:Object.entries(KIND).map(([v, label]) => ({v, label}))}, {name:'visible', label:'ظاهر للطلاب', type:'toggle', value:l.visible}]])}
      <div class="cr-acts">${U.btn({label:'احفظ', icon:'check', sm:true, a:'saveL', disabled:!can()})}</div>
    </section>
    <section class="cr-sec">

const work = f => A.mem('fg:w:' + f.qid, {spec:null, sel:-1});

const tpState = fam => A.mem('fg:tp:' + fam, {patch:{}, shown:false});
const glState = () => A.mem('fg:gl', {d:{}, shown:false});

/* ---------------- status & approve ---------------- */
function setStatus(f, s, why){
  if (!canEdit()) return noPerm();
  const titles = {source:['يحتاج تأكيد المصدر', 'يُعلَّم الشكل ليتحقق أحد من الكتاب الأصلي قبل اعتماده.', 'علّمه'],
    image:['صورة يدوية بدل القالب', 'يُعرض هذا السؤال بصورة ترفعها بدل الرسم الآلي. يبقى القالب محفوظًا ويمكن الرجوع إليه.', 'استخدم صورة يدوية'],
    review:['العودة إلى رسم القالب', 'يُعرض الرسم الآلي من جديد ويرجع الشكل إلى «يحتاج مراجعة».', 'ارجع للقالب']};
  const [title, text, cl] = titles[s];
  U.confirm({title, text, reason:'optional', confirmLabel:cl, reasonPh:'ملاحظة تُكتب في سجل التصحيحات'}).then(v => {
    if (!v) return; const before = f.status; f.status = s;
    logFig({qid:f.qid, family:f.family, scope:'status', summary:s === 'review' ? (why || 'العودة إلى رسم القالب') : 'علّم الشكل «' + ST[s][0] + '»', reason:v.reason, before:{الحالة:ST[before][0]}, after:{الحالة:ST[s][0]}});
    A.changed(); U.toast('الحالة الآن «' + ST[s][0] + '».', {undo:() => { f.status = before; logFig({qid:f.qid, family:f.family, scope:'status', summary:'تراجع عن تغيير الحالة'}); A.changed(); }});
  });
}
function approve(f){
  if (!canEdit()) return noPerm();
  const doIt = reason => { const before = f.status; f.status = 'ok';
    logFig({qid:f.qid, family:f.family, scope:'status', summary:'اعتماد الشكل «سليم»', reason, before:{الحالة:ST[before][0]}, after:{الحالة:'سليم'}});
    A.changed(); U.toast('اعتُمد الشكل.', {undo:() => { f.status = before; logFig({qid:f.qid, family:f.family, scope:'status', summary:'تراجع عن الاعتماد'}); A.changed(); }}); };
  if (dirty(f)) U.confirm({title:'لديك تعديلات غير محفوظة', text:'نحفظها إصدارًا جديدًا ثم نعتمد الشكل.', reason:'optional', confirmLabel:'احفظ واعتمد'}).then(v => { if (!v) return; saveQ(f, v.reason, true); doIt(v.reason); });
  else doIt('');
}
function rerender(f, el){
  const go = () => { work(f).spec = null; work(f).sel = -1; A.changed(); requestAnimationFrame(() => { const c = document.querySelector('.fg-cur'); if (c) { c.classList.remove('fg-flash'); void c.offsetWidth; c.classList.add('fg-flash'); } });
    U.toast('أُعيد رسم الشكل من المواصفة المحفوظة.'); };
  if (dirty(f)) U.confirm({title:'إعادة الرسم من المواصفة المحفوظة؟', text:'ستُهمَل التعديلات التي لم تحفظها.', reason:false, confirmLabel:'أعد الرسم', tone:'dangerf'}).then(v => v && go());
  else go();
}
function saveQ(f, note, quiet){
  const spec = clone(editSpec(f)), before = clone(f.spec), v = curV(f) + 1;
  f.spec = spec; f.versions.push({v, at:A.iso(), by:A.me().name, kind:'question', note:note || 'تعديل التسميات', spec:clone(spec)});
  work(f).spec = null;
  logFig({qid:f.qid, family:f.family, scope:'question', summary:'تعديل السؤال — إصدار v' + A.ar(v), reason:note});
  if (quiet) return;
  A.changed();
  U.toast('حُفظ الإصدار v' + A.ar(v) + '.', {undo:() => { f.spec = before; f.versions = f.versions.filter(x => x.v !== v); logFig({qid:f.qid, family:f.family, scope:'question', summary:'تراجع عن الإصدار v' + A.ar(v)}); A.changed(); }});
}

          <span class="fg-sep"></span>
          <button type="button" class="fg-tb2" data-a="nudge" data-i="${i}" data-d="closer"${ro || !a ? A.raw(' disabled') : ''}>تقريب</button>
          <button type="button" class="fg-tb2" data-a="nudge" data-i="${i}" data-d="farther"${ro || !a ? A.raw(' disabled') : ''}>إبعاد</button>
          ${kind === 'angle' ? h`<span class="fg-sep"></span><button type="button" class="fg-tb2" data-a="nudge" data-i="${i}" data-d="in"${ro ? A.raw(' disabled') : ''}>داخل الزاوية</button><button type="button" class="fg-tb2" data-a="nudge" data-i="${i}" data-d="out"${ro ? A.raw(' disabled') : ''}>خارج الزاوية</button>` : ''}
        </div></li>`; })}` : h`<li class="fg-none">لا تسميات في هذا الرسم بعد.</li>`);
    live.innerHTML = iftnSvg(f, s, {live:true, hi:w.sel});
    const d = dirty(f);
    body.querySelector('[data-a="save"]').disabled = !d || ro;
    body.querySelector('[data-a="discard"]').disabled = !d;
    body.querySelector('[data-a="save"]').className = 'btn ' + (d ? 'secondary fg-go' : 'secondary');
    syncJson(); paintCur(page, f);
  };
  const nudge = (i, d, step) => {
    if (ro) return noPerm();
    const s = editSpec(f), Lb = s.labels[i]; if (!Lb) return;
    const st = step || NUDGE;
    if (d === 'up') Lb.dy = (Lb.dy || 0) - st; else if (d === 'down') Lb.dy = (Lb.dy || 0) + st;
    else if (d === 'left') Lb.dx = (Lb.dx || 0) - st; else if (d === 'right') Lb.dx = (Lb.dx || 0) + st;
    else if (d === 'in') Lb.r = (Lb.r || 0) - st; else if (d === 'out') Lb.r = (Lb.r || 0) + st;
    else { /* تقريب / إبعاد — along the line from the drawing centre through the label (as the old studio did) */
      const r = drawFig(f.family, s, styleOf(s), tplOf(f.family), {}), q = r.pos[i]; if (!q) return;
      const v = unit(sub(q, [200, 140])), sign = d === 'closer' ? -1 : 1;
      Lb.dx = r1((Lb.dx || 0) + v[0] * st * sign); Lb.dy = r1((Lb.dy || 0) + v[1] * st * sign); }
    ['dx', 'dy', 'r'].forEach(k => { if (Lb[k] !== undefined) { Lb[k] = r1(Lb[k]); if (!Lb[k]) delete Lb[k]; } });
    w.sel = i; paint();
  };
  paint();

    sel:b => { const i = +b.dataset.i; w.sel = w.sel === i ? -1 : i; paint(); },
    nudge:b => nudge(+b.dataset.i, b.dataset.d),
    reset:() => { if (ro) return noPerm(); const s = editSpec(f); s.labels.forEach(Lb => { delete Lb.dx; delete Lb.dy; delete Lb.r; }); paint(); U.toast('أُعيدت كل التسميات إلى مواضعها الافتراضية — لم تُحفظ بعد.'); },
    discard:() => { w.spec = null; paint(); },

    json:() => { let s; try { s = JSON.parse(ta.value); } catch (e) { err.textContent = 'JSON غير صالح: ' + e.message; return; }
      if (!s || typeof s !== 'object' || !Array.isArray(s.labels) || typeof s.params !== 'object') { err.textContent = 'يجب أن يحوي params (كائن) وlabels (قائمة).'; return; }
      w.spec = {params:s.params, labels:s.labels}; if (s.style && typeof s.style === 'object' && Object.keys(s.style).length) w.spec.style = s.style;
      err.textContent = ''; ta.blur(); paint(); }
  });

}
/* keyboard nudging (edit tab): arrows move, Shift = small step, +/- = إبعاد/تقريب, Esc = deselect */
document.addEventListener('keydown', e => {
  if (!kb || A.cur.id !== 'figures' || !A.cur.q.id || document.body.classList.contains('lock')) return;
  if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
  const w = work(kb.f); if (w.sel < 0) return;
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', '+':'farther', '=':'farther', '-':'closer'};
  if (e.key === 'Escape') { kb.sel(-1); return; }
  const d = map[e.key]; if (!d || e.altKey || e.ctrlKey || e.metaKey) return;

/* diff grid (template / global previews) */
function diffGrid(rows, unitLabel, max){
  const changed = rows.filter(r => r.b !== r.a), show = max ? changed.slice(0, max) : rows;
  return h`<div class="fg-dh"><b>${A.n(changed.length)} من ${A.n(rows.length)} ${unitLabel} ستتغيّر</b>${max && changed.length > max ? h`<span>نعرض أول ${A.n(max)}</span>` : ''}</div>
    ${show.length ? h`<div class="fg-dg">${show.map(r => h`<div class="fg-dc${r.b !== r.a ? ' ch' : ''}">
      <div class="fg-dch"><a href="${A.href('figures', {id:r.f.qid})}">${A.id(r.f.qid)}</a><span>${r.b !== r.a ? 'تغيّر' : 'بلا تغيير'}</span></div>
      <div class="fg-dcb"><figure><figcaption>قبل</figcaption>${A.raw(r.b)}</figure><figure><figcaption>بعد</figcaption>${A.raw(r.a)}</figure></div></div>`)}</div>`
    : h`<p class="fg-hint">لا أثر على أي شكل — جرّب قيمة أخرى.</p>`}`;
}
function stepRow(c, val, base, extra){
  const changed = c.toggle ? val !== base : Math.abs(val - base) > 1e-9;
  if (c.toggle) return h`<li class="fg-st${changed ? ' ch' : ''}"><span class="fg-stl">${c.label}</span>
    <label class="sw"><input type="checkbox" data-tg="${c.k}"${val ? A.raw(' checked') : ''}${extra ? A.raw(' disabled') : ''}><i></i><span>${val ? 'ظاهر' : 'مخفي'}</span></label></li>`;
  const fmt = c.fmt || (v => A.n(v));
  return h`<li class="fg-st${changed ? ' ch' : ''}"><span class="fg-stl">${c.label}</span>
    <span class="fg-stc"><button type="button" class="fg-tb2" data-step="${c.k}" data-s="-1"${val <= c.min || extra ? A.raw(' disabled') : ''}>${c.dec}</button>
    <span class="fg-stv num">${fmt(val)}${changed ? h`<small>كان ${fmt(base)}</small>` : ''}</span>
    <button type="button" class="fg-tb2" data-step="${c.k}" data-s="1"${val >= c.max || extra ? A.raw(' disabled') : ''}>${c.inc}</button></span></li>`;
}
